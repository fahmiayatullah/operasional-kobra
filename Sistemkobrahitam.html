<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Kobra Hitam — Sistem Operasional Percetakan</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            ink: { 950: '#09090B', 900: '#111827', 800: '#1F2937' },
            gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Icons, SheetJS (Excel), jsPDF -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* Scrollbar minimalis */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.6); }

    @keyframes modalPop {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop { animation: modalPop 0.18s ease-out forwards; }

    /* Mode cetak struk / daftar harga / laporan */
    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        position: fixed !important; inset: 0 !important;
        width: 100% !important; background: #fff !important; color: #000 !important;
        padding: 16px !important; z-index: 99999 !important; display: block !important;
      }
    }
  </style>
</head>

<body class="h-full bg-[#F8FAFC] text-slate-800 dark:bg-[#0B0F19] dark:text-slate-100 font-sans antialiased selection:bg-amber-400/25">

  <!-- Area khusus Print -->
  <div id="printArea" class="hidden"></div>

  <!-- Toast Notifikasi -->
  <div id="toastBox" class="fixed bottom-4 right-4 z-[95] flex flex-col gap-2 max-w-sm w-[calc(100%-2rem)] pointer-events-none"></div>

  <!-- Backdrop Mobile -->
  <div id="navBackdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-950/50 backdrop-blur-[2px] z-40 hidden lg:hidden"></div>

  <!-- =========================================================
       SIDEBAR MINIMALIS (12 HALAMAN)
  ========================================================== -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-60 bg-white dark:bg-[#111623] border-r border-slate-200/80 dark:border-slate-800/80 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <!-- Brand -->
    <div class="h-16 px-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-800/80 shrink-0">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-slate-900 dark:bg-amber-500 text-amber-400 dark:text-slate-950 flex items-center justify-center shrink-0 shadow-xs">
          <svg viewBox="0 0 36 36" class="w-5 h-5" fill="none">
            <path d="M18 5C12 5 8 10 8 15.5C8 19.6 10.6 22.7 13.5 24.2V28C13.5 29.7 14.8 31 16.5 31H19.5C21.2 31 22.5 29.7 22.5 28V24.2C25.4 22.7 28 19.6 28 15.5C28 10 24 5 18 5Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M13.5 14.5L16.5 16.2L13.5 17.5M22.5 14.5L19.5 16.2L22.5 17.5M18 19.5V24.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="truncate">
          <div id="brandName" class="text-sm font-extrabold tracking-tight text-slate-900 dark:text-white truncate">Kobra Hitam</div>
          <div class="text-[11px] text-slate-400 truncate">Operasional Percetakan</div>
        </div>
      </div>
      <button onclick="toggleSidebar(false)" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Tutup menu">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Menu 12 Halaman -->
    <nav id="sidebarNav" class="flex-1 overflow-y-auto px-3 py-3 space-y-0.5 text-[13px]"></nav>

    <!-- Tombol Impor Excel Ringkas -->
    <div class="p-3 border-t border-slate-100 dark:border-slate-800/80 shrink-0">
      <button onclick="openExcelModal()" class="w-full py-2.5 px-3 rounded-xl bg-amber-50 dark:bg-amber-500/10 hover:bg-amber-100 dark:hover:bg-amber-500/20 text-amber-700 dark:text-amber-400 border border-amber-200/80 dark:border-amber-500/25 text-xs font-semibold flex items-center justify-center gap-2 transition">
        <i data-lucide="file-spreadsheet" class="w-4 h-4 shrink-0"></i>
        <span id="sidebarImportText">Impor Excel (83 Barang)</span>
      </button>
    </div>
  </aside>

  <!-- =========================================================
       AREA KONTEN UTAMA
  ========================================================== -->
  <div class="lg:pl-60 min-h-full flex flex-col">
    <!-- Topbar Bersih -->
    <header class="sticky top-0 z-30 h-16 bg-white/85 dark:bg-[#111623]/85 backdrop-blur-md border-b border-slate-200/70 dark:border-slate-800/80 px-4 sm:px-6 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <button onclick="toggleSidebar(true)" class="lg:hidden p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300" aria-label="Menu">
          <i data-lucide="menu" class="w-4 h-4"></i>
        </button>
        <div class="min-w-0">
          <h1 id="pageTitle" class="text-base font-bold tracking-tight text-slate-900 dark:text-white truncate">Dashboard</h1>
          <p id="pageDesc" class="text-xs text-slate-400 truncate hidden sm:block">Ringkasan usaha Percetakan Kobra Hitam</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <span id="stockBadge" class="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
          0 Barang
        </span>
        <button onclick="go('kasir')" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 text-xs font-semibold hover:opacity-90 transition">
          <i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Kasir</span>
        </button>
        <button onclick="toggleTheme()" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Mode Gelap / Terang">
          <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Konten Halaman -->
    <main id="app" class="flex-1 p-4 sm:p-6 max-w-[1440px] w-full mx-auto"></main>
  </div>

  <!-- =========================================================
       MODAL GLOBAL
  ========================================================== -->
  <div id="modalWrap" class="fixed inset-0 z-[80] bg-slate-950/55 backdrop-blur-[2px] hidden items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div id="modalCard" class="bg-white dark:bg-[#111623] border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden animate-pop my-auto">
      <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between gap-3 shrink-0">
        <div>
          <h2 id="modalTitle" class="text-sm sm:text-base font-bold text-slate-900 dark:text-white"></h2>
          <p id="modalSub" class="text-xs text-slate-400 hidden"></p>
        </div>
        <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modalBody" class="p-5 overflow-y-auto flex-1"></div>
      <div id="modalFoot" class="px-5 py-3.5 border-t border-slate-100 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-900/50 flex items-center justify-end gap-2 shrink-0 hidden"></div>
    </div>
  </div>

  <!-- =========================================================
       LOGIKA APLIKASI PERCETAKAN KOBRA HITAM
  ========================================================== -->
  <script>
    // -------------------------------------------------------------------------
    // 1. KONFIGURASI & STATE (LOCALSTORAGE)
    // -------------------------------------------------------------------------
    const STORE_KEY = 'kobra_hitam_simple_ui_v2';

    const PAGES = [
      { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard', group: 'Utama', desc: 'Ringkasan omzet, laba, dan kondisi stok' },
      { id: 'kasir', label: 'Kasir', icon: 'shopping-cart', group: 'Utama', desc: 'Transaksi barang & jasa, otomatis potong stok' },
      { id: 'barang', label: 'Data Barang', icon: 'package', group: 'Inventaris', desc: 'Master 83 barang inventaris & 8 kolom asli Excel' },
      { id: 'stok-masuk', label: 'Stok Masuk', icon: 'package-plus', group: 'Inventaris', desc: 'Catat barang masuk & pembelian ke jurnal' },
      { id: 'stok-keluar', label: 'Stok Keluar', icon: 'package-minus', group: 'Inventaris', desc: 'Mutasi keluar manual, penyesuaian & resep otomatis' },
      { id: 'kategori', label: 'Kategori Barang', icon: 'tags', group: 'Inventaris', desc: 'Kelompok jenis barang percetakan' },
      { id: 'kalkulator-hpp', label: 'Kalkulator HPP', icon: 'calculator', group: 'Produksi', desc: 'Hitung HPP, Markup, Margin & profit pesanan' },
      { id: 'resep', label: 'Resep Bahan Baku', icon: 'flask-conical', group: 'Produksi', desc: 'Konsumsi bahan baku per unit jasa percetakan' },
      { id: 'daftar-harga', label: 'Daftar Harga', icon: 'tag', group: 'Produksi', desc: 'Katalog harga jual barang & jasa' },
      { id: 'jurnal', label: 'Jurnal Harian', icon: 'book-open', group: 'Keuangan', desc: 'Catatan otomatis seluruh transaksi & pengeluaran' },
      { id: 'laporan', label: 'Laporan Bulanan', icon: 'bar-chart-3', group: 'Keuangan', desc: 'Laporan harian, mingguan & bulanan terpisah' },
      { id: 'pengaturan', label: 'Pengaturan', icon: 'settings', group: 'Sistem', desc: 'Identitas usaha, nota 1080×1350 & backup data' },
    ];

    // 6 Preset Jasa Wajib & HPP Akurat
    function defaultServices() {
      return [
        {
          id: 'svc_fotokopi', nama: 'Fotokopi', satuan: 'lembar', aktif: true,
          bahanItems: [{ id: 'b1', nama: 'Kertas HVS A4/F4', biaya: 130 }, { id: 'b2', nama: 'Toner Fotokopi', biaya: 70 }],
          listrik: 50, jasa: 50, // HPP = Rp300
          markupPct: 66.67, marginPct: 40, hargaJual: 500,
          resep: [{ id: 'r1', label: 'Kertas HVS', keyword: 'hvs', productId: '', qtyPerUnit: 1 }]
        },
        {
          id: 'svc_print_bw', nama: 'Print Hitam Putih', satuan: 'lembar', aktif: true,
          bahanItems: [{ id: 'b1', nama: 'Kertas HVS A4/F4', biaya: 130 }, { id: 'b2', nama: 'Tinta Hitam', biaya: 140 }],
          listrik: 60, jasa: 70, // HPP = Rp400
          markupPct: 150, marginPct: 60, hargaJual: 1000,
          resep: [{ id: 'r1', label: 'Kertas HVS', keyword: 'hvs', productId: '', qtyPerUnit: 1 }]
        },
        {
          id: 'svc_print_warna', nama: 'Print Warna', satuan: 'lembar', aktif: true,
          bahanItems: [{ id: 'b1', nama: 'Kertas HVS A4/F4', biaya: 130 }, { id: 'b2', nama: 'Tinta CMYK Warna', biaya: 390 }],
          listrik: 80, jasa: 100, // HPP = Rp700
          markupPct: 185.71, marginPct: 65, hargaJual: 2000,
          resep: [{ id: 'r1', label: 'Kertas HVS', keyword: 'hvs', productId: '', qtyPerUnit: 1 }]
        },
        {
          id: 'svc_jilid', nama: 'Jilid', satuan: 'buku', aktif: true,
          bahanItems: [{ id: 'b1', nama: 'Cover Buffalo', biaya: 700 }, { id: 'b2', nama: 'Plastik Mika', biaya: 620 }, { id: 'b3', nama: 'Lakban & Staples', biaya: 400 }],
          listrik: 100, jasa: 500, // HPP = Rp2.320
          markupPct: 115.52, marginPct: 53.6, hargaJual: 5000,
          resep: [
            { id: 'r1', label: 'Cover Buffalo', keyword: 'buffalo', productId: '', qtyPerUnit: 1 },
            { id: 'r2', label: 'Plastik Mika', keyword: 'mika', productId: '', qtyPerUnit: 1 }
          ]
        },
        {
          id: 'svc_lam_f4', nama: 'Laminating F4', satuan: 'lembar', aktif: true,
          bahanItems: [{ id: 'b1', nama: 'Plastik Laminating F4', biaya: 6820 }],
          listrik: 500, jasa: 1000, // HPP = Rp8.320
          markupPct: 44.23, marginPct: 30.67, hargaJual: 12000,
          resep: [{ id: 'r1', label: 'Plastik Laminating F4', keyword: 'laminating f4', productId: '', qtyPerUnit: 1 }]
        },
        {
          id: 'svc_lam_a4', nama: 'Laminating A4', satuan: 'lembar', aktif: true,
          bahanItems: [{ id: 'b1', nama: 'Plastik Laminating A4', biaya: 4020 }],
          listrik: 400, jasa: 900, // HPP = Rp5.320
          markupPct: 50.38, marginPct: 33.5, hargaJual: 8000,
          resep: [{ id: 'r1', label: 'Plastik Laminating A4', keyword: 'laminating a4', productId: '', qtyPerUnit: 1 }]
        }
      ];
    }

    function defaultCategories() {
      return [
        { id: 'cat_kertas', nama: 'Kertas & HVS', warna: '#3B82F6', deskripsi: 'HVS A4, F4, Art Paper, Foto, Stiker' },
        { id: 'cat_tinta', nama: 'Tinta & Toner', warna: '#8B5CF6', deskripsi: 'Tinta printer, toner fotokopi, cartridge' },
        { id: 'cat_jilid', nama: 'Bahan Jilid', warna: '#F59E0B', deskripsi: 'Buffalo, mika, lakban, spiral, staples' },
        { id: 'cat_lam', nama: 'Laminating', warna: '#10B981', deskripsi: 'Plastik laminating A4, F4, KTP' },
        { id: 'cat_atk', nama: 'ATK & Umum', warna: '#EC4899', deskripsi: 'Pulpen, map, amplop, lem, alat tulis' },
        { id: 'cat_lain', nama: 'Lainnya', warna: '#64748B', deskripsi: 'Perlengkapan percetakan lainnya' }
      ];
    }

    function defaultState() {
      return {
        settings: {
          shopName: 'PERCETAKAN KOBRA HITAM',
          tagline: 'Cetak Cepat, Rapi & Berkualitas',
          address: 'Jl. Percetakan Raya No. 88, Surabaya',
          phone: '0812-3456-7890',
          instagram: '@percetakankobrahitam',
          footerNote: 'Terima kasih atas kepercayaan Anda. Simpan nota ini sebagai bukti pembayaran resmi.',
          invoicePrefix: 'KH',
          invoiceCounter: 1,
          lowStockThreshold: 10,
          darkMode: false
        },
        categories: defaultCategories(),
        // Dikosongkan agar tidak mengarang data; seluruh 83 barang asli diimpor langsung dari Excel Anda.
        products: [],
        services: defaultServices(),
        stockMovements: [],
        sales: [],
        journal: []
      };
    }

    let state = loadState();
    let page = 'dashboard';

    // State tampilan sementara
    const ui = {
      pos: { tab: 'semua', q: '', cat: 'all', cart: [], customer: '', note: '', discType: 'rp', discVal: 0, method: 'Tunai', paid: 0 },
      prod: { q: '', cat: 'all', stock: 'all' },
      hpp: { svcId: 'svc_fotokopi', qty: 100 },
      priceTab: 'jasa',
      jrn: { type: 'all', q: '' },
      rep: { period: 'bulanan', date: todayISO(), month: todayISO().slice(0, 7) },
      excelPending: null
    };

    function loadState() {
      try {
        // Migrasi otomatis bila user sebelumnya sudah impor data di versi v1
        const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem('kobra_hitam_operasional_v1');
        if (!raw) return defaultState();
        const p = JSON.parse(raw);
        const d = defaultState();
        return {
          settings: { ...d.settings, ...(p.settings || {}) },
          categories: p.categories?.length ? p.categories : d.categories,
          products: Array.isArray(p.products) ? p.products : [],
          services: p.services?.length ? p.services : d.services,
          stockMovements: Array.isArray(p.stockMovements) ? p.stockMovements : [],
          sales: Array.isArray(p.sales) ? p.sales : [],
          journal: Array.isArray(p.journal) ? p.journal : []
        };
      } catch {
        return defaultState();
      }
    }

    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        updateBadges();
      } catch {
        toast('Penyimpanan browser penuh. Silakan backup data di Pengaturan.', 'error');
      }
    }

    // -------------------------------------------------------------------------
    // 2. UTILITAS RINGKAS
    // -------------------------------------------------------------------------
    function todayISO() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    const uid = (p = 'id') => `${p}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const rp = n => { const v = Number(n) || 0; return (v < 0 ? '-' : '') + 'Rp' + Math.round(Math.abs(v)).toLocaleString('id-ID'); };
    const num = (n, d = 2) => (Number(n) || 0).toLocaleString('id-ID', { maximumFractionDigits: d });
    const fmtDT = iso => { if (!iso) return '-'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); };
    const fmtD = iso => { if (!iso) return '-'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); };

    function svcHpp(s) {
      const bahan = (s.bahanItems || []).reduce((a, b) => a + (Number(b.biaya) || 0), 0);
      const listrik = Number(s.listrik) || 0;
      const jasa = Number(s.jasa) || 0;
      return { bahan, listrik, jasa, hpp: bahan + listrik + jasa };
    }

    function catById(id) {
      return state.categories.find(c => c.id === id) || { nama: 'Umum', warna: '#64748B' };
    }

    function totalInventoryValue() {
      return state.products.reduce((s, p) => s + Math.max(0, Number(p.stok) || 0) * (Number(p.hargaBeliSatuan) || 0), 0);
    }

    function toast(msg, type = 'success') {
      const box = document.getElementById('toastBox');
      const cls = {
        success: 'bg-slate-900 dark:bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        info: 'bg-slate-700 text-white'
      }[type] || 'bg-slate-900 text-white';
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2.5 animate-pop ${cls}`;
      el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : type === 'warning' ? 'alert-triangle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span>${esc(msg)}</span>`;
      box.appendChild(el);
      lucide.createIcons({ nodes: [el] });
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 260); }, 3000);
    }

    function openModal({ title, sub = '', body = '', foot = '', width = 'max-w-2xl' }) {
      const wrap = document.getElementById('modalWrap');
      const card = document.getElementById('modalCard');
      card.className = `bg-white dark:bg-[#111623] border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full ${width} max-h-[90vh] flex flex-col overflow-hidden animate-pop my-auto`;
      document.getElementById('modalTitle').textContent = title;
      const sEl = document.getElementById('modalSub');
      sEl.textContent = sub;
      sEl.classList.toggle('hidden', !sub);
      document.getElementById('modalBody').innerHTML = body;
      const fEl = document.getElementById('modalFoot');
      fEl.innerHTML = foot;
      fEl.classList.toggle('hidden', !foot);
      wrap.classList.remove('hidden');
      wrap.classList.add('flex');
      lucide.createIcons({ nodes: [card] });
    }

    function closeModal() {
      const wrap = document.getElementById('modalWrap');
      wrap.classList.add('hidden');
      wrap.classList.remove('flex');
    }

    function confirmDialog(title, msg, onYes, yesText = 'Lanjutkan', danger = true) {
      const bid = uid('cfm');
      openModal({
        title, width: 'max-w-sm',
        body: `<p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${esc(msg)}</p>`,
        foot: `
          <button onclick="closeModal()" class="px-3.5 py-2 rounded-xl text-xs font-semibold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">Batal</button>
          <button id="${bid}" class="px-3.5 py-2 rounded-xl text-xs font-semibold text-white ${danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-slate-900 dark:bg-amber-500 dark:text-slate-950'}">${esc(yesText)}</button>
        `
      });
      document.getElementById(bid).onclick = () => { closeModal(); onYes(); };
    }

    // -------------------------------------------------------------------------
    // 4. IMPOR EXCEL INVENTARIS (8 KOLOM ASLI TANPA MENGUBAH DATA)
    // -------------------------------------------------------------------------
    function parseIndoNum(v) {
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      let s = String(v ?? '').trim().replace(/Rp\.?/gi, '').replace(/\s+/g, '');
      if (!s) return 0;
      if (s.includes('.') && s.includes(',')) {
        s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
      } else if (s.includes('.')) {
        const parts = s.split('.');
        if (parts.length > 1 && parts[parts.length - 1].length === 3) s = s.replace(/\./g, '');
      } else if (s.includes(',')) {
        const parts = s.split(',');
        s = parts.length > 1 && parts[parts.length - 1].length === 3 ? s.replace(/,/g, '') : s.replace(',', '.');
      }
      const n = parseFloat(s.replace(/[^0-9.\-]/g, ''));
      return isFinite(n) ? n : 0;
    }

    function parseExcelDate(raw, fmt) {
      if (fmt && String(fmt).trim() && isNaN(Number(fmt))) return String(fmt).trim();
      if (typeof raw === 'number' && raw > 20000 && raw < 70000) {
        const d = new Date(Math.floor(raw - 25569) * 86400 * 1000);
        if (!isNaN(d)) {
          const p = n => String(n).padStart(2, '0');
          return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}`;
        }
      }
      return String(fmt ?? raw ?? '').trim();
    }

    function guessCat(nama, desk = '') {
      const t = `${nama} ${desk}`.toLowerCase();
      if (/hvs|kertas|a4|f4|art\s?paper|glossy|foto|stiker|sticker|folio|concorde/.test(t)) return 'cat_kertas';
      if (/tinta|toner|cartridge|cyan|magenta|yellow|black|epson|canon|brother/.test(t)) return 'cat_tinta';
      if (/jilid|buffalo|mika|lakban|spiral|staples|steples|cover|ring/.test(t)) return 'cat_jilid';
      if (/laminat|pouch|plastik/.test(t)) return 'cat_lam';
      if (/pulpen|pena|pensil|spidol|map|amplop|lem|gunting|cutter|buku/.test(t)) return 'cat_atk';
      return 'cat_lain';
    }

    function detectCols(row) {
      const hs = row.map(h => String(h || '').toLowerCase().trim());
      const find = (pats, ex = []) => hs.findIndex(h => h && !ex.some(e => e.test(h)) && pats.some(p => p.test(h)));
      return {
        nama: find([/nama\s*barang/, /^nama$/, /barang/, /produk/, /item/]),
        tanggalPembelian: find([/tanggal\s*pembelian/, /tgl\s*beli/, /tanggal/, /tgl/]),
        deskripsi: find([/deskripsi/, /keterangan/, /detail/, /spek/]),
        stok: find([/^stok$/, /stock/, /stok/]),
        isiKemasan: find([/isi\s*kemasan/, /kemasan/, /^isi$/, /pack/]),
        hargaBeliSatuan: find([/harga\s*beli\s*satuan/, /beli\s*satuan/, /harga\s*satuan/, /satuan/]),
        hargaBeli: find([/harga\s*beli/, /beli/, /modal/], [/satuan/]),
        hargaJual: find([/harga\s*jual/, /jual/])
      };
    }

    function readExcel(file) {
      if (typeof XLSX === 'undefined') return toast('Library Excel belum termuat.', 'error');
      const r = new FileReader();
      r.onload = e => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const sh = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(sh, { header: 1, raw: true, defval: '' });
          const fmt = XLSX.utils.sheet_to_json(sh, { header: 1, raw: false, defval: '' });
          prepareExcel(raw, fmt, file.name);
        } catch (err) { toast('Gagal membaca file: ' + err.message, 'error'); }
      };
      r.readAsArrayBuffer(file);
    }

    function readPastedExcel() {
      const txt = (document.getElementById('pasteTable')?.value || '').trim();
      if (!txt) return toast('Tempel data tabel terlebih dahulu.', 'warning');
      const rows = txt.split(/\r?\n/).map(l => l.split('\t'));
      prepareExcel(rows, rows, 'Clipboard Excel');
    }

    function prepareExcel(raw, fmt, name) {
      if (!raw || raw.length < 2) return toast('Baris data tidak mencukupi.', 'error');
      let hIdx = 0, best = -1;
      for (let i = 0; i < Math.min(10, raw.length); i++) {
        const sc = Object.values(detectCols(raw[i])).filter(v => v >= 0).length;
        if (sc > best) { best = sc; hIdx = i; }
      }
      ui.excelPending = { name, hIdx, headers: raw[hIdx], raw, fmt, map: detectCols(raw[hIdx]), mode: 'replace' };
      renderExcelPreview();
    }

    function extractExcelItems() {
      const { hIdx, raw, fmt, map } = ui.excelPending;
      const out = [];
      for (let i = hIdx + 1; i < raw.length; i++) {
        const r = raw[i] || [], f = fmt[i] || r;
        if (!r.some(c => String(c ?? '').trim() !== '')) continue;
        const gR = k => (map[k] >= 0 ? r[map[k]] : '');
        const gF = k => (map[k] >= 0 ? (f[map[k]] ?? r[map[k]]) : '');
        const nama = String(gF('nama') || gR('nama') || '').trim();
        if (!nama || /^total$/i.test(nama)) continue;
        const deskripsi = String(gF('deskripsi') ?? '').trim();
        out.push({
          id: uid('prd'),
          nama,
          tanggalPembelian: parseExcelDate(gR('tanggalPembelian'), gF('tanggalPembelian')),
          deskripsi,
          stok: parseIndoNum(gR('stok')),
          isiKemasan: String(gF('isiKemasan') ?? gR('isiKemasan') ?? '').trim(),
          hargaBeli: parseIndoNum(gR('hargaBeli')),
          hargaBeliSatuan: parseIndoNum(gR('hargaBeliSatuan')),
          hargaJual: parseIndoNum(gR('hargaJual')),
          kategoriId: guessCat(nama, deskripsi),
          aktif: true
        });
      }
      return out;
    }

    function autoLinkRecipes() {
      if (!state.products.length) return;
      state.services.forEach(s => (s.resep || []).forEach(r => {
        if (r.productId && state.products.some(p => p.id === r.productId)) return;
        const kws = (r.keyword || r.label || '').toLowerCase().split(/\s+/).filter(Boolean);
        const m = state.products.find(p => kws.every(k => `${p.nama} ${p.deskripsi}`.toLowerCase().includes(k)))
          || state.products.find(p => kws.some(k => k.length > 2 && `${p.nama} ${p.deskripsi}`.toLowerCase().includes(k)));
        if (m) r.productId = m.id;
      }));
    }

    // -------------------------------------------------------------------------
    // 5. JURNAL OTOMATIS & PERHITUNGAN LAPORAN KEUANGAN
    // -------------------------------------------------------------------------
    function addJournal({ type, refNo = '-', description, amount = 0, hpp = 0, direction = 'neutral', paymentMethod = '-', date = new Date().toISOString(), meta = {} }) {
      state.journal.unshift({ id: uid('jrn'), date, type, refNo, description, amount: Number(amount) || 0, hpp: Number(hpp) || 0, direction, paymentMethod, meta });
    }

    function periodRange(period, dateStr, monthStr) {
      if (period === 'harian') {
        return { start: new Date(`${dateStr}T00:00:00`), end: new Date(`${dateStr}T23:59:59.999`), label: fmtD(dateStr) };
      }
      if (period === 'mingguan') {
        const ref = new Date(`${dateStr}T12:00:00`);
        const diff = ref.getDay() === 0 ? -6 : 1 - ref.getDay();
        const start = new Date(ref); start.setDate(ref.getDate() + diff); start.setHours(0, 0, 0, 0);
        const end = new Date(start); end.setDate(start.getDate() + 6); end.setHours(23, 59, 59, 999);
        return { start, end, label: `${fmtD(start.toISOString())} – ${fmtD(end.toISOString())}` };
      }
      const [y, m] = (monthStr || todayISO().slice(0, 7)).split('-').map(Number);
      const start = new Date(y, m - 1, 1, 0, 0, 0, 0);
      const end = new Date(y, m, 0, 23, 59, 59, 999);
      return { start, end, label: start.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }) };
    }

    function calcReport(start, end) {
      const hit = iso => { const d = new Date(iso); return d >= start && d <= end; };
      const sales = state.sales.filter(s => hit(s.date));
      const jrns = state.journal.filter(j => hit(j.date));
      const omzet = sales.reduce((a, s) => a + (Number(s.total) || 0), 0);
      const hpp = sales.reduce((a, s) => a + (Number(s.totalHpp) || 0), 0);
      const labaKotor = omzet - hpp;
      const pengeluaran = jrns.filter(j => j.type === 'Pengeluaran').reduce((a, j) => a + (Number(j.amount) || 0), 0);
      const pembelian = jrns.filter(j => j.type === 'Pembelian').reduce((a, j) => a + (Number(j.amount) || 0), 0);
      const labaBersih = labaKotor - pengeluaran;
      return { omzet, hpp, labaKotor, pengeluaran, pembelian, labaBersih, persediaan: totalInventoryValue(), trxCount: sales.length, sales, jrns };
    }

    // -------------------------------------------------------------------------
    // 6. HALAMAN 1: DASHBOARD (BERSIH & RINGKAS)
    // -------------------------------------------------------------------------
    function viewDashboard(el) {
      const t = todayISO();
      const mDay = calcReport(...Object.values(periodRange('harian', t)).slice(0, 2));
      const mMon = calcReport(...Object.values(periodRange('bulanan', t, t.slice(0, 7))).slice(0, 2));
      const lowStock = state.products.filter(p => (Number(p.stok) || 0) <= state.settings.lowStockThreshold);

      // Data grafik 7 hari
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        const r = periodRange('harian', d.toISOString().slice(0, 10));
        days.push({ lbl: d.toLocaleDateString('id-ID', { weekday: 'short' }), val: calcReport(r.start, r.end).omzet });
      }
      const maxV = Math.max(...days.map(x => x.val), 10000);

      el.innerHTML = `
        <div class="space-y-6">
          ${state.products.length === 0 ? `
            <div class="rounded-2xl bg-slate-900 dark:bg-[#161D2F] text-white p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border border-slate-800">
              <div class="flex items-center gap-3.5">
                <div class="w-11 h-11 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center shrink-0">
                  <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
                </div>
                <div>
                  <h2 class="text-sm font-bold">Impor File Excel Inventaris (83 Barang Asli)</h2>
                  <p class="text-xs text-slate-400 mt-0.5">Unggah <strong>Untitled spreadsheet.xlsx</strong> untuk memuat seluruh data asli tanpa perubahan.</p>
                </div>
              </div>
              <button onclick="openExcelModal()" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold shrink-0 transition">Impor Sekarang</button>
            </div>
          ` : ''}

          <!-- 4 Kartu Metrik Utama -->

            ${statCard('Omzet Bulan Ini', rp(mMon.omzet), `Hari ini ${rp(mDay.omzet)} (${mDay.trxCount} trx)`, 'trending-up', 'text-amber-500')}

          <!-- Grafik 7 Hari & Pintasan -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

                      <span class="text-[10px] font-mono text-slate-400 opacity-0 group-hover:opacity-100 transition">${rp(d.val)}</span>

                      <span class="text-[11px] text-slate-500">${d.lbl}</span>
                    </div>

            <div class="bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 flex flex-col justify-between gap-4">
              <div>
                <h3 class="text-sm font-bold mb-3">Pintasan Cepat</h3>

                    <i data-lucide="package-plus" class="w-4 h-4 text-emerald-500"></i><div>Stok Masuk</div>
                  </button>
                  <button onclick="go('kalkulator-hpp')" class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-semibold text-left space-y-1.5 transition">
                    <i data-lucide="calculator" class="w-4 h-4 text-blue-500"></i><div>Hitung HPP</div>
                  </button>

              <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">

                <span class="font-mono font-bold">${rp(mMon.hpp)}</span>
              </div>
            </div>
          </div>

          <!-- Transaksi Terbaru & Stok Menipis -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
            <div class="bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5">
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold">Penjualan Terakhir</h3>
                <button onclick="go('jurnal')" class="text-xs text-slate-400 hover:text-slate-900 dark:hover:text-white">Lihat Jurnal</button>
              </div>
              ${state.sales.length === 0 ? `<p class="py-8 text-center text-xs text-slate-400">Belum ada transaksi penjualan.</p>` : `
                <div class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${state.sales.slice(0, 5).map(s => `
                    <div class="py-2.5 flex items-center justify-between gap-2 text-xs">
                      <div class="min-w-0">
                        <div class="font-semibold truncate">${esc(s.customerName)} <span class="font-mono text-slate-400 font-normal">· ${esc(s.invoiceNo)}</span></div>
                        <div class="text-[11px] text-slate-400">${fmtDT(s.date)} · ${esc(s.paymentMethod)}</div>
                      </div>
                      <div class="text-right shrink-0">
                        <div class="font-mono font-bold">${rp(s.total)}</div>
                        <button onclick="openReceiptModal('${s.id}')" class="text-[11px] font-semibold text-amber-600 dark:text-amber-400 hover:underline">Struk</button>
                      </div>

                </div>
              `}

            <div class="bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5">

                <div class="divide-y divide-slate-100 dark:divide-slate-800 max-h-56 overflow-y-auto">

                    <div class="py-2.5 flex items-center justify-between gap-2 text-xs">

    function statCard(title, value, sub, icon, iconColor) {
      return `
        <div class="bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 sm:p-5">
          <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
            <span class="font-medium">${title}</span>
            <i data-lucide="${icon}" class="w-4 h-4 ${iconColor}"></i>
          </div>
          <div class="text-xl font-extrabold font-mono tracking-tight text-slate-900 dark:text-white truncate">${value}</div>
          <div class="text-[11px] text-slate-400 mt-1 truncate">${sub}</div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // 7. HALAMAN 2: KASIR (POS RINGKAS & CEPAT)
    // -------------------------------------------------------------------------
    function viewKasir(el) {
      const q = ui.pos.q.toLowerCase().trim();
      const svcs = ui.pos.tab === 'barang' ? [] : state.services.filter(s => s.aktif && (!q || s.nama.toLowerCase().includes(q)));
      const prods = ui.pos.tab === 'jasa' ? [] : state.products.filter(p => p.aktif !== false && (ui.pos.cat === 'all' || p.kategoriId === ui.pos.cat) && (!q || p.nama.toLowerCase().includes(q) || (p.deskripsi || '').toLowerCase().includes(q)));
      const calc = cartTotals();

      el.innerHTML = `
        <div class="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
          <!-- Katalog -->
          <div class="xl:col-span-7 2xl:col-span-8 space-y-4">
            <div class="bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-3.5 space-y-3">
              <div class="flex flex-col sm:flex-row gap-2">
                <div class="relative flex-1">
                  <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                  <input id="posQ" value="${esc(ui.pos.q)}" oninput="ui.pos.q=this.value; render(); keepFocus('posQ')" placeholder="Cari jasa atau barang..." class="w-full pl-9 pr-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500/40" />
                </div>
                <select onchange="ui.pos.cat=this.value; render()" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
                  <option value="all">Semua Kategori</option>
                  ${state.categories.map(c => `<option value="${c.id}" ${ui.pos.cat === c.id ? 'selected' : ''}>${esc(c.nama)}</option>`).join('')}
                </select>
              </div>
              <div class="flex gap-1.5">
                ${[['semua', 'Semua'], ['jasa', 'Jasa Percetakan'], ['barang', `Barang (${state.products.length})`]].map(([k, l]) => `
                  <button onclick="ui.pos.tab='${k}'; render()" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${ui.pos.tab === k ? 'bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${l}</button>
                `).join('')}
              </div>
            </div>

            ${svcs.length ? `
              <div>
                <div class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2 px-1">Jasa Percetakan</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                  ${svcs.map(s => `
                    <button onclick="addCart('jasa','${s.id}')" class="text-left p-3.5 rounded-2xl bg-white dark:bg-[#111623] border border-slate-200/80 dark:border-slate-800 hover:border-amber-500 transition">
                      <span class="text-[10px] font-bold text-amber-600 dark:text-amber-400">JASA</span>
                      <div class="font-bold text-xs sm:text-sm text-slate-900 dark:text-white mt-0.5 truncate">${esc(s.nama)}</div>
                      <div class="font-mono font-bold text-xs text-slate-600 dark:text-slate-300 mt-2">${rp(s.hargaJual)}<span class="text-[10px] font-normal text-slate-400">/${esc(s.satuan)}</span></div>
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            ${ui.pos.tab !== 'jasa' ? `
              <div>
                <div class="flex items-center justify-between mb-2 px-1">
                  <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Barang Inventaris (${prods.length})</span>
                  ${state.products.length === 0 ? `<button onclick="openExcelModal()" class="text-xs font-semibold text-amber-600 hover:underline">+ Impor 83 Barang</button>` : ''}
                </div>
                ${prods.length === 0 ? `
                  <div class="p-8 rounded-2xl bg-white dark:bg-[#111623] border border-dashed border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400">
                    ${state.products.length === 0 ? 'Impor file Excel Anda untuk menampilkan daftar barang di kasir.' : 'Barang tidak ditemukan.'}
                  </div>
                ` : `
                  <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-[500px] overflow-y-auto pr-1">
                    ${prods.map(p => `
                      <button onclick="addCart('barang','${p.id}')" class="text-left p-3.5 rounded-2xl bg-white dark:bg-[#111623] border border-slate-200/80 dark:border-slate-800 hover:border-emerald-500 transition">
                        <div class="flex items-center justify-between text-[10px]">
                          <span class="text-slate-400 truncate max-w-[90px]">${esc(catById(p.kategoriId).nama)}</span>
                          <span class="font-mono font-bold ${p.stok <= 0 ? 'text-rose-500' : 'text-emerald-600 dark:text-emerald-400'}">Stok ${num(p.stok)}</span>
                        </div>
                        <div class="font-semibold text-xs text-slate-900 dark:text-white mt-1 line-clamp-2">${esc(p.nama)}</div>
                        <div class="font-mono font-bold text-xs text-slate-700 dark:text-slate-200 mt-2">${rp(p.hargaJual)}</div>
                      </button>
                    `).join('')}
                  </div>
                `}
              </div>
            ` : ''}
          </div>

          <!-- Keranjang & Pembayaran -->
          <div class="xl:col-span-5 2xl:col-span-4 bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 space-y-4 sticky top-20">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-bold">Keranjang</h3>
                <span class="px-2 py-0.5 rounded-full bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 font-mono text-[11px] font-bold">${ui.pos.cart.reduce((a, b) => a + b.qty, 0)}</span>
              </div>
              ${ui.pos.cart.length ? `<button onclick="ui.pos.cart=[]; ui.pos.discVal=0; ui.pos.paid=0; render()" class="text-xs text-rose-500 hover:underline">Reset</button>` : ''}
            </div>

            <div class="grid grid-cols-2 gap-2">
              <input value="${esc(ui.pos.customer)}" oninput="ui.pos.customer=this.value" placeholder="Pelanggan (opsional)" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs" />
              <input value="${esc(ui.pos.note)}" oninput="ui.pos.note=this.value" placeholder="Catatan (opsional)" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs" />
            </div>

            <div class="max-h-56 overflow-y-auto space-y-2 pr-0.5">
              ${ui.pos.cart.length === 0 ? `<div class="py-8 text-center text-xs text-slate-400 border border-dashed border-slate-200 dark:border-slate-800 rounded-xl">Pilih barang atau jasa di kiri</div>` : ui.pos.cart.map((it, idx) => `
                <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-100 dark:border-slate-800 space-y-2">
                  <div class="flex items-start justify-between gap-2 text-xs">
                    <div class="min-w-0">
                      <div class="font-semibold truncate">${esc(it.nama)}</div>
                      <div class="text-[11px] font-mono text-slate-400">${rp(it.harga)} × ${it.qty} = <strong class="text-slate-800 dark:text-slate-100">${rp(it.harga * it.qty)}</strong></div>
                    </div>
                    <button onclick="ui.pos.cart.splice(${idx},1); render()" class="text-slate-400 hover:text-rose-500"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                  </div>
                  <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-1">
                      <button onclick="setCartQty(${idx},${it.qty - 1})" class="w-6 h-6 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold">-</button>
                      <input type="number" min="1" value="${it.qty}" onchange="setCartQty(${idx},this.value)" class="w-12 text-center py-0.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono text-xs" />
                      <button onclick="setCartQty(${idx},${it.qty + 1})" class="w-6 h-6 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold">+</button>
                    </div>
                    <input type="number" min="0" value="${it.harga}" onchange="ui.pos.cart[${idx}].harga=Math.max(0,parseFloat(this.value)||0); render()" class="w-24 text-right px-2 py-0.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono text-xs" title="Ubah harga satuan" />
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2.5 text-xs">
              <div class="flex justify-between"><span class="text-slate-400">Subtotal</span><span class="font-mono font-semibold">${rp(calc.subtotal)}</span></div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-400">Diskon</span>
                <div class="flex items-center gap-1">
                  <select onchange="ui.pos.discType=this.value; render()" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
                    <option value="rp" ${ui.pos.discType === 'rp' ? 'selected' : ''}>Rp</option>
                    <option value="pct" ${ui.pos.discType === 'pct' ? 'selected' : ''}>%</option>
                  </select>
                  <input type="number" min="0" value="${ui.pos.discVal}" oninput="ui.pos.discVal=parseFloat(this.value)||0; refreshPosTotals()" class="w-24 text-right px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" />
                </div>
              </div>

              <div class="p-3 rounded-xl bg-slate-900 dark:bg-amber-500/15 text-white dark:text-amber-300 flex items-center justify-between">
                <span class="font-bold">Total</span>
                <span id="posTot" class="font-mono font-extrabold text-lg">${rp(calc.total)}</span>
              </div>

              <div class="grid grid-cols-4 gap-1.5">
                ${['Tunai', 'QRIS', 'Transfer', 'Debit'].map(m => `
                  <button onclick="ui.pos.method='${m}'; if('${m}'!=='Tunai') ui.pos.paid=cartTotals().total; render()" class="py-1.5 rounded-lg text-[11px] font-semibold border transition ${ui.pos.method === m ? 'bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 border-transparent' : 'border-slate-200 dark:border-slate-700'}">${m}</button>
                `).join('')}
              </div>

              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-400">Bayar</span>
                <input id="posPaid" type="number" min="0" value="${ui.pos.paid}" oninput="ui.pos.paid=parseFloat(this.value)||0; refreshPosTotals()" class="w-32 text-right px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" />
              </div>
              <div class="flex justify-end gap-1.5">
                <button onclick="quickPay(cartTotals().total)" class="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-medium hover:bg-amber-500 hover:text-slate-950">Pas</button>
                ${[20000, 50000, 100000].map(v => `<button onclick="quickPay(${v})" class="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-mono hover:bg-amber-500 hover:text-slate-950">${v / 1000}rb</button>`).join('')}
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">Kembalian</span>
                <span id="posChg" class="font-mono font-bold ${calc.change >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}">${rp(calc.change)}</span>
              </div>

              <button onclick="checkout()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-2 transition">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i> Bayar & Cetak Struk
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function cartTotals() {
      const subtotal = ui.pos.cart.reduce((s, i) => s + (Number(i.harga) || 0) * (Number(i.qty) || 0), 0);
      const disc = ui.pos.discType === 'pct'
        ? Math.round(subtotal * Math.min(100, Math.max(0, Number(ui.pos.discVal) || 0)) / 100)
        : Math.min(subtotal, Math.max(0, Number(ui.pos.discVal) || 0));
      const total = Math.max(0, subtotal - disc);
      const paid = Number(ui.pos.paid) || 0;
      return { subtotal, disc, total, paid, change: paid - total };
    }
    function refreshPosTotals() {
      const c = cartTotals();
      const t = document.getElementById('posTot'), ch = document.getElementById('posChg');
      if (t) t.textContent = rp(c.total);
      if (ch) { ch.textContent = rp(c.change); ch.className = `font-mono font-bold ${c.change >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}`; }
    }
    function quickPay(v) { ui.pos.paid = v; const el = document.getElementById('posPaid'); if (el) el.value = v; refreshPosTotals(); }
    function setCartQty(idx, v) { ui.pos.cart[idx].qty = Math.max(1, parseInt(v, 10) || 1); if (ui.pos.method !== 'Tunai') ui.pos.paid = cartTotals().total; render(); }

    function addCart(type, id) {
      const ex = ui.pos.cart.find(c => c.type === type && c.refId === id);
      if (ex) ex.qty += 1;
      else if (type === 'barang') {
        const p = state.products.find(x => x.id === id);
        if (!p) return;
        ui.pos.cart.push({ type, refId: id, nama: p.nama, satuan: p.isiKemasan || 'pcs', harga: Number(p.hargaJual) || 0, hppUnit: Number(p.hargaBeliSatuan) || 0, qty: 1 });
      } else {
        const s = state.services.find(x => x.id === id);
        if (!s) return;
        ui.pos.cart.push({ type, refId: id, nama: s.nama, satuan: s.satuan || 'unit', harga: Number(s.hargaJual) || 0, hppUnit: svcHpp(s).hpp, qty: 1 });
      }
      if (ui.pos.method !== 'Tunai') ui.pos.paid = cartTotals().total;
      render();
    }

    function checkout() {
      if (!ui.pos.cart.length) return toast('Keranjang masih kosong.', 'warning');
      const c = cartTotals();
      if (ui.pos.method === 'Tunai' && c.paid < c.total) return toast('Uang bayar kurang dari total tagihan.', 'error');

      const paidAmount = ui.pos.method === 'Tunai' ? c.paid : c.total;
      const changeAmount = Math.max(0, paidAmount - c.total);
      const now = new Date().toISOString();
      const inv = `${state.settings.invoicePrefix || 'KH'}-${todayISO().replace(/-/g, '').slice(2)}-${String(state.settings.invoiceCounter++).padStart(4, '0')}`;

      let totalHpp = 0;
      const logs = [];

      ui.pos.cart.forEach(it => {
        totalHpp += (Number(it.hppUnit) || 0) * it.qty;
        if (it.type === 'barang') {
          const p = state.products.find(x => x.id === it.refId);
          if (p) {
            const bef = Number(p.stok) || 0, aft = Number((bef - it.qty).toFixed(4));
            p.stok = aft;
            state.stockMovements.unshift({ id: uid('mov'), date: now, type: 'out', source: 'penjualan_barang', productId: p.id, productName: p.nama, qty: it.qty, stockBefore: bef, stockAfter: aft, unitCost: Number(p.hargaBeliSatuan) || 0, totalCost: (Number(p.hargaBeliSatuan) || 0) * it.qty, refNo: inv, notes: `Penjualan ${inv}` });
            logs.push(`${p.nama} (-${it.qty})`);
          }
        } else {
          const s = state.services.find(x => x.id === it.refId);
          (s?.resep || []).forEach(r => {
            if (!r.productId || !r.qtyPerUnit) return;
            const p = state.products.find(x => x.id === r.productId);
            if (!p) return;
            const use = Number(((Number(r.qtyPerUnit) || 0) * it.qty).toFixed(4));
            const bef = Number(p.stok) || 0, aft = Number((bef - use).toFixed(4));
            p.stok = aft;
            state.stockMovements.unshift({ id: uid('mov'), date: now, type: 'out', source: 'resep_jasa', productId: p.id, productName: p.nama, qty: use, stockBefore: bef, stockAfter: aft, unitCost: Number(p.hargaBeliSatuan) || 0, totalCost: (Number(p.hargaBeliSatuan) || 0) * use, refNo: inv, notes: `Resep ${s.nama} (×${it.qty})` });
            logs.push(`${p.nama} (-${use} via ${s.nama})`);
          });
        }
      });

      const sale = {
        id: uid('sale'), invoiceNo: inv, date: now,
        customerName: ui.pos.customer.trim() || 'Pelanggan Umum',
        notes: ui.pos.note.trim(),
        items: ui.pos.cart.map(i => ({ ...i, subtotal: i.harga * i.qty })),
        subtotal: c.subtotal, discountAmount: c.disc, total: c.total, totalHpp,
        paymentMethod: ui.pos.method, paidAmount, changeAmount
      };
      state.sales.unshift(sale);

      addJournal({ type: 'Penjualan', refNo: inv, description: `Penjualan ${sale.customerName} (${sale.items.length} item)`, amount: sale.total, hpp: totalHpp, direction: 'in', paymentMethod: sale.paymentMethod, date: now, meta: { saleId: sale.id } });
      if (logs.length) addJournal({ type: 'Stok Keluar', refNo: inv, description: `Potong stok otomatis: ${logs.join(', ')}`, amount: totalHpp, date: now, meta: { saleId: sale.id } });

      Object.assign(ui.pos, { cart: [], customer: '', note: '', discVal: 0, paid: 0 });
      save();
      toast(`Transaksi ${inv} berhasil dicatat!`);
      render();
      openReceiptModal(sale.id);
    }

    // -------------------------------------------------------------------------
    // 8. NOTA STRUK THERMAL RESMI (JPG & PDF + CETAK STRUK)
    // -------------------------------------------------------------------------
    async function drawReceiptCanvas(sale) {
      if (document.fonts?.ready) { try { await document.fonts.ready; } catch {} }

      const W = 722;
      const px = 82;
      const contentW = W - px * 2; // 558

      const settings = state.settings || {};
      const shopName = String(settings.shopName || 'PERCETAKAN KOBRA HITAM').trim();
      const address = String(settings.address || '').trim();
      const phone = String(settings.phone || '').trim();
      const footerNote = String(settings.footerNote || 'Terima kasih atas kepercayaan Anda. Simpan\nnota ini sebagai bukti pembayaran resmi.').trim();

      // Helper pemecah teks per baris dan pembungkus kata
      const wrapText = (txt, mw, font, ctxTemp) => {
        ctxTemp.font = font;
        const rawLines = String(txt || '').split('\n');
        const res = [];
        for (const raw of rawLines) {
          const words = raw.trim().split(/\s+/);
          let line = '';
          for (const w of words) {
            if (!w) continue;
            const test = line ? `${line} ${w}` : w;
            if (ctxTemp.measureText(test).width > mw && line) {
              res.push(line);
              line = w;
            } else {
              line = test;
            }
          }
          if (line) res.push(line);
        }
        return res;
      };

      // Buat dummy canvas untuk menghitung tinggi konten secara presisi
      const dcv = document.createElement('canvas');
      dcv.width = W; dcv.height = 100;
      const dctx = dcv.getContext('2d');

      const addrLines = wrapText(address, contentW, '500 17px "JetBrains Mono", monospace', dctx);
      const items = sale.items || [];
      const footLines = wrapText(footerNote, contentW, '500 15px "JetBrains Mono", monospace', dctx);

      // Hitung estimasi tinggi yang diperlukan
      let estY = 104; // header baseline
      estY += addrLines.length * 35;
      if (phone) estY += 33;
      estY += 34; // dash 1
      estY += 35 + 33 + 34; // meta (No, Tgl, Plg)
      estY += 34; // dash 2
      for (const it of items) {
        estY += 36; // nama item
        estY += 34; // qty x harga & subtotal
      }
      estY += 34; // dash 3
      estY += 35; // subtotal
      if (sale.discountAmount > 0) estY += 32; // diskon
      estY += 34; // dash 4
      estY += 38; // TOTAL
      estY += 36 + 34; // Bayar & Kembali
      estY += 37; // dash 5
      estY += footLines.length * 30; // footer
      estY += 80; // ruang bawah

      // Sesuai contoh struk: minimal 1024px atau menyesuaikan jika item banyak
      const H = Math.max(1024, estY);

      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');

      // Latar belakang putih bersih thermal struk
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, W, H);

      const drawDash = (yPos) => {
        ctx.save();
        ctx.setLineDash([6, 4]);
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = '#000000';
        ctx.beginPath();
        ctx.moveTo(px, yPos);
        ctx.lineTo(W - px, yPos);
        ctx.stroke();
        ctx.restore();
      };

      ctx.fillStyle = '#000000';
      let y = 104;

      // Header Toko
      ctx.textAlign = 'center';
      ctx.font = '700 23px "JetBrains Mono", monospace';
      ctx.fillText(shopName, W / 2, y);

      // Alamat Toko
      ctx.font = '500 17px "JetBrains Mono", monospace';
      for (const al of addrLines) {
        y += 35;
        ctx.fillText(al, W / 2, y);
      }

      // Telepon / WA
      if (phone) {
        y += 33;
        ctx.fillText(phone, W / 2, y);
      }

      // Garis Pembatas 1
      y += 34;
      drawDash(y);

      // Metadata Transaksi
      y += 35;
      ctx.textAlign = 'left';
      ctx.font = '500 17px "JetBrains Mono", monospace';
      ctx.fillText(`No: ${sale.invoiceNo}`, px, y);
      y += 33;
      ctx.fillText(`Tgl: ${fmtDT(sale.date)}`, px, y);
      y += 34;
      ctx.fillText(`Plg: ${sale.customerName || 'Pelanggan Umum'} (${sale.paymentMethod || 'Tunai'})`, px, y);

      // Garis Pembatas 2
      y += 34;
      drawDash(y);

      // Daftar Item Belanja / Jasa
      for (const it of items) {
        y += 36;
        ctx.textAlign = 'left';
        ctx.font = '700 18px "JetBrains Mono", monospace';
        let nm = String(it.nama || '');
        if (ctx.measureText(nm).width > contentW) {
          while (ctx.measureText(nm + '…').width > contentW && nm.length > 3) {
            nm = nm.slice(0, -1);
          }
          nm += '…';
        }
        ctx.fillText(nm, px, y);

        y += 34;
        ctx.font = '500 17px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`${it.qty} x ${rp(it.harga)}`, px, y);
        ctx.textAlign = 'right';
        ctx.fillText(rp(it.subtotal), W - px, y);
      }

      // Garis Pembatas 3
      y += 34;
      drawDash(y);

      // Subtotal & Diskon
      y += 35;
      ctx.textAlign = 'left';
      ctx.font = '500 17px "JetBrains Mono", monospace';
      ctx.fillText('Subtotal', px, y);
      ctx.textAlign = 'right';
      ctx.fillText(rp(sale.subtotal), W - px, y);

      if (sale.discountAmount > 0) {
        y += 32;
        ctx.textAlign = 'left';
        ctx.fillText('Diskon', px, y);
        ctx.textAlign = 'right';
        ctx.fillText(`-${rp(sale.discountAmount)}`, W - px, y);
      }

      // Garis Pembatas 4
      y += 34;
      drawDash(y);

      // TOTAL
      y += 38;
      ctx.textAlign = 'left';
      ctx.font = '800 24px "JetBrains Mono", monospace';
      ctx.fillText('TOTAL', px, y);
      ctx.textAlign = 'right';
      ctx.fillText(rp(sale.total), W - px, y);

      // Pembayaran & Kembalian
      y += 36;
      ctx.textAlign = 'left';
      ctx.font = '500 17px "JetBrains Mono", monospace';
      ctx.fillText('Bayar', px, y);
      ctx.textAlign = 'right';
      ctx.fillText(rp(sale.paidAmount), W - px, y);

      y += 34;
      ctx.textAlign = 'left';
      ctx.fillText('Kembali', px, y);
      ctx.textAlign = 'right';
      ctx.fillText(rp(sale.changeAmount), W - px, y);

      // Garis Pembatas 5
      y += 37;
      drawDash(y);

      // Catatan Kaki Nota
      ctx.textAlign = 'center';
      ctx.font = '500 15px "JetBrains Mono", monospace';
      for (const fl of footLines) {
        y += 30;
        ctx.fillText(fl, W / 2, y);
      }

      return cv;
    }

      openModal({
        title: `Struk ${s.invoiceNo}`,
        sub: 'Struk Kasir Kobra Hitam',
        width: 'max-w-2xl',
        body: `

            <div class="w-full sm:w-72 shrink-0 mx-auto">

            <div class="flex-1 w-full space-y-3">

              <button onclick="dlReceiptJPG('${s.id}')" class="w-full py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-2 transition shadow-xs"><i data-lucide="image-down" class="w-4 h-4"></i> Unduh JPG (Struk)</button>
              <button onclick="dlReceiptPDF('${s.id}')" class="w-full py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-slate-800 text-white font-semibold text-xs flex items-center justify-center gap-2 hover:opacity-90 transition"><i data-lucide="file-down" class="w-4 h-4"></i> Unduh PDF (Struk)</button>
            </div>
          </div>
        `
      });
      const cv = await drawReceiptCanvas(s);
      const wrap = document.getElementById('rcpPreview');
      if (wrap) {
        cv.className = 'w-full h-auto object-contain block mx-auto rounded shadow-xs';
        wrap.innerHTML = '';
        wrap.appendChild(cv);
      }
    }

    async function dlReceiptJPG(id) {
      const s = state.sales.find(x => x.id === id); if (!s) return;
      const cv = await drawReceiptCanvas(s);
      const a = document.createElement('a');
      a.download = `Struk_${s.invoiceNo}.jpg`;
      a.href = cv.toDataURL('image/jpeg', 0.96);
      a.click();
      toast('Struk JPG berhasil diunduh.');
    }

    async function dlReceiptPDF(id) {
      const s = state.sales.find(x => x.id === id); if (!s) return;
      if (!window.jspdf?.jsPDF) return toast('Library PDF belum termuat.', 'error');
      const cv = await drawReceiptCanvas(s);
      const doc = new window.jspdf.jsPDF({
        orientation: 'portrait',
        unit: 'px',
        format: [cv.width, cv.height],
        hotfixes: ['px_scaling']
      });
      doc.addImage(cv.toDataURL('image/jpeg', 0.96), 'JPEG', 0, 0, cv.width, cv.height);
      doc.save(`Struk_${s.invoiceNo}.pdf`);
      toast('Struk PDF berhasil diunduh.');
    }

    function saveProd(id) {
      const fd = new FormData(document.getElementById('fProd'));
      const nama = String(fd.get('nama') || '').trim();
      if (!nama) return toast('Nama barang wajib diisi.', 'warning');
      const d = { nama, tanggalPembelian: String(fd.get('tanggalPembelian') || '').trim(), kategoriId: fd.get('kategoriId'), deskripsi: String(fd.get('deskripsi') || '').trim(), stok: parseFloat(fd.get('stok')) || 0, isiKemasan: String(fd.get('isiKemasan') || '').trim(), hargaBeli: parseFloat(fd.get('hargaBeli')) || 0, hargaBeliSatuan: parseFloat(fd.get('hargaBeliSatuan')) || 0, hargaJual: parseFloat(fd.get('hargaJual')) || 0, aktif: true };
      if (id) {
        const i = state.products.findIndex(x => x.id === id);
        if (i >= 0) {
          const old = Number(state.products[i].stok) || 0;
          state.products[i] = { ...state.products[i], ...d };
          if (old !== d.stok) addJournal({ type: 'Penyesuaian Stok', refNo: 'EDIT', description: `Penyesuaian ${d.nama}: ${old} → ${d.stok}`, amount: Math.abs(d.stok - old) * d.hargaBeliSatuan });
        }
      } else state.products.unshift({ id: uid('prd'), ...d });
      save(); closeModal(); toast('Data barang disimpan.'); render();
    }

    function delProd(id) {
      const p = state.products.find(x => x.id === id); if (!p) return;
      confirmDialog('Hapus Barang?', `Hapus "${p.nama}" dari inventaris?`, () => { state.products = state.products.filter(x => x.id !== id); save(); toast('Barang dihapus.', 'info'); render(); }, 'Hapus');
    }

    function exportExcel() {
      if (!state.products.length || typeof XLSX === 'undefined') return toast('Tidak ada data untuk diekspor.', 'warning');
      const ws = XLSX.utils.json_to_sheet(state.products.map(p => ({ 'Nama barang': p.nama, 'Tanggal pembelian': p.tanggalPembelian, 'Deskripsi': p.deskripsi, 'Stok': p.stok, 'Isi kemasan': p.isiKemasan, 'Harga beli': p.hargaBeli, 'Harga beli satuan': p.hargaBeliSatuan, 'Harga jual': p.hargaJual })));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inventaris');
      XLSX.writeFile(wb, `Inventaris_Kobra_Hitam_${todayISO()}.xlsx`);
      toast('Excel inventaris diekspor.');
    }

            ${!list.length ? `<p class="p-10 text-center text-xs text-slate-400">Belum ada catatan stok masuk.</p>` : `

              </table></div>
            `}
          </div>
        </div>
      `;

    function submitIn(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const p = state.products.find(x => x.id === fd.get('pid'));
      const qty = parseFloat(fd.get('qty')) || 0, cost = parseFloat(fd.get('cost')) || 0;
      if (!p || qty <= 0) return toast('Data stok masuk tidak valid.', 'warning');
      const bef = Number(p.stok) || 0, aft = Number((bef + qty).toFixed(4));
      p.stok = aft; if (cost > 0) p.hargaBeliSatuan = cost; p.tanggalPembelian = fd.get('date') || todayISO();
      const iso = new Date(`${p.tanggalPembelian}T${new Date().toTimeString().slice(0, 8)}`).toISOString();
      const ref = `IN-${Date.now().toString().slice(-5)}`, notes = String(fd.get('notes') || '').trim() || 'Stok masuk';
      state.stockMovements.unshift({ id: uid('mov'), date: iso, type: 'in', source: 'pembelian', productId: p.id, productName: p.nama, qty, stockBefore: bef, stockAfter: aft, unitCost: cost, totalCost: qty * cost, refNo: ref, notes });
      addJournal({ type: 'Stok Masuk', refNo: ref, description: `${p.nama} (+${qty}) — ${notes}`, amount: qty * cost, date: iso });
      if (fd.get('buy') === 'on') addJournal({ type: 'Pembelian', refNo: ref, description: `Beli ${p.nama} (${qty} × ${rp(cost)})`, amount: qty * cost, direction: 'out', paymentMethod: 'Tunai', date: iso });
      save(); toast(`Stok ${p.nama} +${qty}.`); render();
    }

      el.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <form onsubmit="submitOut(event)" class="lg:col-span-4 bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 space-y-3 text-xs">
            <h3 class="text-sm font-bold">Stok Keluar / Penyesuaian</h3>
            <div><label class="block font-semibold mb-1">Jenis</label><select name="mode" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900"><option value="manual">Stok Keluar (Pakai / Rusak)</option><option value="penyesuaian">Penyesuaian Stok (Set Stok Baru)</option></select></div>
            <div><label class="block font-semibold mb-1">Barang *</label><select name="pid" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900"><option value="">-- Pilih barang --</option>${state.products.map(p => `<option value="${p.id}">${esc(p.nama)} (Stok ${num(p.stok)})</option>`).join('')}</select></div>
            <div><label class="block font-semibold mb-1">Jumlah / Stok Fisik Baru *</label><input name="qty" type="number" step="any" min="0" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div>

            <div class="px-4 py-3.5 border-b border-slate-100 dark:border-slate-800 text-sm font-bold">Riwayat Stok Keluar & Penyesuaian (${list.length})</div>
            ${!list.length ? `<p class="p-10 text-center text-xs text-slate-400">Belum ada mutasi stok keluar.</p>` : `
              <div class="overflow-x-auto"><table class="w-full text-xs text-left">
                <thead class="bg-slate-50 dark:bg-slate-900/60 text-slate-500"><tr><th class="p-3">Tanggal</th><th class="p-3">Sumber</th><th class="p-3">Barang</th><th class="p-3 text-right">Mutasi</th><th class="p-3 text-right">Akhir</th><th class="p-3">Catatan</th></tr></thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">${list.map(m => `<tr><td class="p-3 whitespace-nowrap text-slate-400">${fmtDT(m.date)}</td><td class="p-3"><span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-[10px] font-semibold">${tag(m.source)}</span></td><td class="p-3 font-semibold">${esc(m.productName)}</td><td class="p-3 text-right font-mono font-bold text-rose-500">${m.type === 'adjustment' ? (m.qty >= 0 ? `+${num(m.qty)}` : num(m.qty)) : `-${num(m.qty)}`}</td><td class="p-3 text-right font-mono">${num(m.stockAfter)}</td><td class="p-3 text-slate-500">${esc(m.notes)}</td></tr>`).join('')}</tbody>
              </table></div>
            `}
          </div>
        </div>
      `;
    }

    function submitOut(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const p = state.products.find(x => x.id === fd.get('pid'));
      const q = parseFloat(fd.get('qty')), mode = fd.get('mode');
      if (!p || isNaN(q) || q < 0) return toast('Input tidak valid.', 'warning');
      const bef = Number(p.stok) || 0, uc = Number(p.hargaBeliSatuan) || 0;
      const iso = new Date(`${fd.get('date') || todayISO()}T${new Date().toTimeString().slice(0, 8)}`).toISOString();
      const notes = String(fd.get('notes') || '').trim();
      if (mode === 'penyesuaian') {
        const diff = Number((q - bef).toFixed(4)); p.stok = q;
        const ref = `ADJ-${Date.now().toString().slice(-5)}`;
        state.stockMovements.unshift({ id: uid('mov'), date: iso, type: 'adjustment', source: 'penyesuaian', productId: p.id, productName: p.nama, qty: diff, stockBefore: bef, stockAfter: q, unitCost: uc, totalCost: Math.abs(diff) * uc, refNo: ref, notes: notes || `${bef} → ${q}` });
        addJournal({ type: 'Penyesuaian Stok', refNo: ref, description: `${p.nama}: ${bef} → ${q}`, amount: Math.abs(diff) * uc, date: iso });
        toast(`Stok ${p.nama} disesuaikan ke ${q}.`);
      } else {
        if (q <= 0) return toast('Jumlah keluar harus > 0.', 'warning');
        const aft = Number((bef - q).toFixed(4)); p.stok = aft;
        const ref = `OUT-${Date.now().toString().slice(-5)}`;
        state.stockMovements.unshift({ id: uid('mov'), date: iso, type: 'out', source: 'manual', productId: p.id, productName: p.nama, qty: q, stockBefore: bef, stockAfter: aft, unitCost: uc, totalCost: q * uc, refNo: ref, notes: notes || 'Keluar manual' });
        addJournal({ type: 'Stok Keluar', refNo: ref, description: `${p.nama} (-${q}) ${notes}`, amount: q * uc, date: iso });
        toast(`Stok ${p.nama} -${q}.`);
      }
      save(); render();
    }

    function openCatModal(id = '') {
      const c = id ? state.categories.find(x => x.id === id) : null;
      openModal({
        title: c ? 'Edit Kategori' : 'Kategori Baru', width: 'max-w-sm',
        body: `<form id="fCat" class="space-y-3 text-xs">
          <div><label class="block font-semibold mb-1">Nama *</label><input name="nama" required value="${esc(c?.nama || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
