        </form>`,
        foot: `<button onclick="closeModal()" class="px-3.5 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700">Batal</button><button onclick="saveCat('${id}')" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950">Simpan</button>`
      });
    }
    function saveCat(id) {
      const fd = new FormData(document.getElementById('fCat'));
      const nama = String(fd.get('nama') || '').trim(); if (!nama) return toast('Nama kategori wajib diisi.', 'warning');
      const d = { nama, warna: fd.get('warna') || '#64748B', deskripsi: String(fd.get('deskripsi') || '').trim() };
      if (id) { const i = state.categories.findIndex(x => x.id === id); if (i >= 0) state.categories[i] = { ...state.categories[i], ...d }; }
      else state.categories.push({ id: uid('cat'), ...d });
      save(); closeModal(); toast('Kategori disimpan.'); render();
    }
    function delCat(id) {
      if (state.categories.length <= 1) return toast('Minimal harus ada 1 kategori.', 'warning');
      confirmDialog('Hapus Kategori?', 'Barang di kategori ini akan dipindahkan ke kategori pertama.', () => {
        state.categories = state.categories.filter(x => x.id !== id);
        state.products.forEach(p => { if (p.kategoriId === id) p.kategoriId = state.categories[0].id; });
        save(); render();
      }, 'Hapus');
    }

    // -------------------------------------------------------------------------
    // 12. HALAMAN 7: KALKULATOR HPP (6 PRESET + RUMUS MARKUP & MARGIN)
    // -------------------------------------------------------------------------
    function viewHpp(el) {
      const s = state.services.find(x => x.id === ui.hpp.svcId) || state.services[0];
      ui.hpp.svcId = s.id;
      const { bahan, listrik, jasa, hpp } = svcHpp(s);
      const mk = (Number(s.markupPct) || 0) / 100;
      const mgPct = Math.min(99, Math.max(0, Number(s.marginPct) || 0));
      const mg = mgPct / 100;

      // Rumus wajib:
      // HPP = Total biaya bahan + listrik + jasa
      // Harga jual markup = HPP × (1 + markup)
      // Harga jual margin = HPP / (1 - margin)
      const hMarkup = hpp * (1 + mk);
      const hMargin = hpp / (1 - mg);
      const qty = Math.max(1, Number(ui.hpp.qty) || 1);

      el.innerHTML = `
        <div class="space-y-5">
          <!-- Pilihan 6 Layanan -->
          <div class="flex flex-wrap gap-2">
            ${state.services.map(x => {
              const active = x.id === s.id;
              return `
                <button onclick="ui.hpp.svcId='${x.id}'; render()" class="px-3.5 py-2.5 rounded-xl border text-left transition ${active ? 'bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 border-transparent' : 'bg-white dark:bg-[#111623] border-slate-200/80 dark:border-slate-800 hover:border-amber-400'}">
                  <div class="text-xs font-bold">${esc(x.nama)}</div>
                  <div class="font-mono text-[11px] ${active ? 'text-amber-300 dark:text-slate-800' : 'text-slate-400'}">HPP ${rp(svcHpp(x).hpp)}</div>
                </button>
              `;
            }).join('')}
            <button onclick="openNewSvcModal()" class="px-3.5 py-2.5 rounded-xl border border-dashed border-slate-300 dark:border-slate-700 text-xs font-semibold text-slate-500 hover:border-amber-500">+ Jasa Baru</button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <!-- Kiri: Komponen Biaya -->
            <div class="lg:col-span-6 bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 space-y-4">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold">Biaya HPP — ${esc(s.nama)}</h3>
                <button onclick="resetSvcHpp('${s.id}')" class="text-xs text-slate-400 hover:text-amber-600">Reset Default</button>
              </div>

              <div class="space-y-2">
                <div class="flex justify-between text-[11px] font-semibold text-slate-400">
                  <span>BIAYA BAHAN</span>
                  <button onclick="addBahan('${s.id}')" class="text-amber-600 dark:text-amber-400 hover:underline">+ Tambah Bahan</button>
                </div>
                ${s.bahanItems.map((b, i) => `
                  <div class="flex items-center gap-2">
                    <input value="${esc(b.nama)}" onchange="editBahan('${s.id}',${i},'nama',this.value)" class="flex-1 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs" />
                    <input type="number" step="any" min="0" value="${b.biaya}" onchange="editBahan('${s.id}',${i},'biaya',this.value)" class="w-28 text-right px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-xs font-semibold" />
                    <button onclick="delBahan('${s.id}',${i})" class="p-1.5 text-slate-400 hover:text-rose-500"><i data-lucide="x" class="w-4 h-4"></i></button>
                  </div>
                `).join('')}
              </div>

              <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">
                <div><label class="block text-slate-400 mb-1">Listrik (Rp)</label><input type="number" step="any" min="0" value="${s.listrik}" onchange="setSvc('${s.id}','listrik',this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>
                <div><label class="block text-slate-400 mb-1">Jasa / Tenaga (Rp)</label><input type="number" step="any" min="0" value="${s.jasa}" onchange="setSvc('${s.id}','jasa',this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>
              </div>

              <div class="p-4 rounded-xl bg-slate-900 dark:bg-slate-800/80 text-white flex items-center justify-between">
                <div>
                  <div class="text-[11px] text-amber-400 font-mono">HPP = Bahan + Listrik + Jasa</div>
                  <div class="text-[11px] text-slate-400 font-mono mt-0.5">${rp(bahan)} + ${rp(listrik)} + ${rp(jasa)}</div>
                </div>
                <div class="font-mono text-2xl font-extrabold">${rp(hpp)}</div>
              </div>
            </div>

            <!-- Kanan: Markup, Margin & Profit Pesanan -->
            <div class="lg:col-span-6 bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 space-y-4">
              <h3 class="text-sm font-bold">Harga Jual & Keuntungan</h3>

              <div class="grid grid-cols-3 gap-2.5 text-xs">
                <div><label class="block text-slate-400 mb-1">Markup (%)</label><input type="number" step="any" min="0" value="${s.markupPct}" onchange="setSvc('${s.id}','markupPct',this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>
                <div><label class="block text-slate-400 mb-1">Margin (%)</label><input type="number" step="any" min="0" max="99" value="${s.marginPct}" onchange="setSvc('${s.id}','marginPct',Math.min(99,Math.max(0,parseFloat(this.value)||0)))" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>
                <div><label class="block text-amber-600 dark:text-amber-400 font-semibold mb-1">Jml Pesanan</label><input type="number" min="1" value="${qty}" oninput="ui.hpp.qty=Math.max(1,parseInt(this.value)||1); render()" class="w-full px-3 py-2 rounded-xl border border-amber-400 bg-amber-50/40 dark:bg-amber-950/20 font-mono font-bold" /></div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200/80 dark:border-slate-800 space-y-2">
                  <div class="flex justify-between items-center"><span class="font-bold text-blue-600 dark:text-blue-400">Markup</span><span class="font-mono text-[10px] text-slate-400">HPP × (1+${s.markupPct}%)</span></div>
                  <div class="font-mono text-xl font-extrabold">${rp(hMarkup)}</div>
                  <div class="space-y-1 pt-2 border-t border-slate-200/70 dark:border-slate-800">
                    <div class="flex justify-between"><span class="text-slate-400">Untung / unit</span><b class="font-mono text-emerald-600">${rp(hMarkup - hpp)}</b></div>
                    <div class="flex justify-between"><span class="text-slate-400">Untung (${num(qty)} ${esc(s.satuan)})</span><b class="font-mono text-emerald-600">${rp((hMarkup - hpp) * qty)}</b></div>
                  </div>
                  <button onclick="applySvcPrice('${s.id}',${Math.round(hMarkup)})" class="w-full py-2 rounded-xl bg-slate-900 dark:bg-blue-600 text-white font-semibold text-[11px] hover:opacity-90">Pakai ke Kasir</button>
                </div>

                <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200/80 dark:border-slate-800 space-y-2">
                  <div class="flex justify-between items-center"><span class="font-bold text-emerald-600 dark:text-emerald-400">Margin</span><span class="font-mono text-[10px] text-slate-400">HPP / (1-${mgPct}%)</span></div>
                  <div class="font-mono text-xl font-extrabold">${rp(hMargin)}</div>
                  <div class="space-y-1 pt-2 border-t border-slate-200/70 dark:border-slate-800">
                    <div class="flex justify-between"><span class="text-slate-400">Untung / unit</span><b class="font-mono text-emerald-600">${rp(hMargin - hpp)}</b></div>
                    <div class="flex justify-between"><span class="text-slate-400">Untung (${num(qty)} ${esc(s.satuan)})</span><b class="font-mono text-emerald-600">${rp((hMargin - hpp) * qty)}</b></div>
                  </div>
                  <button onclick="applySvcPrice('${s.id}',${Math.round(hMargin)})" class="w-full py-2 rounded-xl bg-emerald-600 text-white font-semibold text-[11px] hover:opacity-90">Pakai ke Kasir</button>
                </div>
              </div>

              <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
                <span class="text-slate-400">Harga Aktif Kasir: <strong class="font-mono text-slate-900 dark:text-white">${rp(s.hargaJual)}/${esc(s.satuan)}</strong></span>
                <span class="font-mono font-bold text-emerald-600">Profit ${num(qty)}x: ${rp((s.hargaJual - hpp) * qty)}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function editBahan(id, i, k, v) { const s = state.services.find(x => x.id === id); if (s?.bahanItems[i]) { s.bahanItems[i][k] = k === 'biaya' ? (parseFloat(v) || 0) : v; save(); render(); } }
    function addBahan(id) { const s = state.services.find(x => x.id === id); if (s) { s.bahanItems.push({ id: uid('b'), nama: 'Bahan baru', biaya: 0 }); save(); render(); } }
    function delBahan(id, i) { const s = state.services.find(x => x.id === id); if (s) { s.bahanItems.splice(i, 1); save(); render(); } }
    function setSvc(id, k, v) { const s = state.services.find(x => x.id === id); if (s) { s[k] = parseFloat(v) || 0; save(); render(); } }
    function applySvcPrice(id, p) { const s = state.services.find(x => x.id === id); if (s) { s.hargaJual = p; save(); toast(`Harga ${s.nama} diperbarui menjadi ${rp(p)}.`); render(); } }
    function resetSvcHpp(id) {
      const def = defaultServices().find(x => x.id === id), i = state.services.findIndex(x => x.id === id);
      if (def && i >= 0) { state.services[i] = { ...state.services[i], bahanItems: def.bahanItems, listrik: def.listrik, jasa: def.jasa }; save(); toast('HPP dikembalikan ke standar.'); render(); }
    }
    function openNewSvcModal() {
      openModal({
        title: 'Tambah Jasa Baru', width: 'max-w-sm',
        body: `<form id="fSvc" class="space-y-3 text-xs">
          <div><label class="block font-semibold mb-1">Nama Jasa *</label><input name="nama" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
          <div class="grid grid-cols-2 gap-2"><div><label class="block font-semibold mb-1">Satuan</label><input name="satuan" value="lembar" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div><div><label class="block font-semibold mb-1">Harga Jual</label><input name="harga" type="number" value="5000" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div></div>
          <div class="grid grid-cols-3 gap-2"><div><label class="block font-semibold mb-1">Bahan</label><input name="b" type="number" value="1000" class="w-full px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div><div><label class="block font-semibold mb-1">Listrik</label><input name="l" type="number" value="200" class="w-full px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div><div><label class="block font-semibold mb-1">Jasa</label><input name="j" type="number" value="500" class="w-full px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div></div>
        </form>`,
        foot: `<button onclick="closeModal()" class="px-3.5 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700">Batal</button><button onclick="saveNewSvc()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950">Simpan</button>`
      });
    }
    function saveNewSvc() {
      const fd = new FormData(document.getElementById('fSvc'));
      const nama = String(fd.get('nama') || '').trim(); if (!nama) return toast('Nama jasa wajib diisi.', 'warning');
      const ns = { id: uid('svc'), nama, satuan: fd.get('satuan') || 'unit', aktif: true, bahanItems: [{ id: uid('b'), nama: 'Bahan Utama', biaya: parseFloat(fd.get('b')) || 0 }], listrik: parseFloat(fd.get('l')) || 0, jasa: parseFloat(fd.get('j')) || 0, markupPct: 50, marginPct: 35, hargaJual: parseFloat(fd.get('harga')) || 0, resep: [] };
      state.services.push(ns); ui.hpp.svcId = ns.id; save(); closeModal(); toast('Jasa baru ditambahkan.'); render();
    }

    // 13. HALAMAN 8: RESEP BAHAN BAKU
    // -------------------------------------------------------------------------

        <div class="space-y-4">

                    <div class="flex items-center gap-2 text-xs">
                      <select onchange="editRec('${s.id}',${i},'productId',this.value)" class="flex-1 min-w-0 px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">

    function addRec(id) { const s = state.services.find(x => x.id === id); if (s) { (s.resep ||= []).push({ id: uid('r'), label: 'Bahan', productId: '', qtyPerUnit: 1 }); save(); render(); } }

    // -------------------------------------------------------------------------
    function viewJurnal(el) {
      const types = ['all', 'Penjualan', 'Pembelian', 'Stok Masuk', 'Stok Keluar', 'Pengeluaran', 'Penyesuaian Stok'];
      const q = ui.jrn.q.toLowerCase().trim();
      const rows = state.journal.filter(j => (ui.jrn.type === 'all' || j.type === ui.jrn.type) && (!q || j.description.toLowerCase().includes(q) || (j.refNo || '').toLowerCase().includes(q)));

      const badge = t => ({
        Penjualan: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300',
        Pembelian: 'bg-blue-100 text-blue-700 dark:bg-blue-950/60 dark:text-blue-300',
        Pengeluaran: 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300',
        'Stok Masuk': 'bg-teal-100 text-teal-700 dark:bg-teal-950/60 dark:text-teal-300',
        'Stok Keluar': 'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300',
        'Penyesuaian Stok': 'bg-violet-100 text-violet-700 dark:bg-violet-950/60 dark:text-violet-300'
      }[t] || 'bg-slate-100 text-slate-600');

      el.innerHTML = `
        <div class="space-y-4">
          <div class="bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-3.5 flex flex-col md:flex-row gap-2.5 justify-between">
            <div class="flex flex-wrap gap-2 flex-1">
              <input id="jrnQ" value="${esc(ui.jrn.q)}" oninput="ui.jrn.q=this.value; render(); keepFocus('jrnQ')" placeholder="Cari no. ref atau keterangan..." class="flex-1 min-w-[180px] px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs" />
              <select onchange="ui.jrn.type=this.value; render()" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
                ${types.map(t => `<option value="${t}" ${ui.jrn.type === t ? 'selected' : ''}>${t === 'all' ? 'Semua Jenis Jurnal' : t}</option>`).join('')}
              </select>
            </div>
            <button onclick="openExpenseModal()" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shrink-0">+ Catat Pengeluaran</button>
          </div>

          <div class="bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            ${!rows.length ? `<p class="p-10 text-center text-xs text-slate-400">Belum ada catatan jurnal. Transaksi kasir, stok, dan pengeluaran akan muncul otomatis di sini.</p>` : `
              <div class="overflow-x-auto"><table class="w-full text-xs text-left">
                <thead class="bg-slate-50 dark:bg-slate-900/60 text-slate-500"><tr><th class="p-3">Waktu</th><th class="p-3">Jenis</th><th class="p-3">Ref</th><th class="p-3">Keterangan</th><th class="p-3 text-right">Nominal</th><th class="p-3 text-center">Struk</th></tr></thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${rows.map(j => `
                    <tr>
                      <td class="p-3 whitespace-nowrap text-slate-400">${fmtDT(j.date)}</td>
                      <td class="p-3"><span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${badge(j.type)}">${esc(j.type)}</span></td>
                      <td class="p-3 font-mono text-slate-400">${esc(j.refNo)}</td>
                      <td class="p-3">${esc(j.description)}</td>
                      <td class="p-3 text-right font-mono font-bold ${j.direction === 'in' ? 'text-emerald-600' : j.direction === 'out' ? 'text-rose-500' : ''}">${rp(j.amount)}</td>
                      <td class="p-3 text-center">${j.meta?.saleId ? `<button onclick="openReceiptModal('${j.meta.saleId}')" class="text-amber-600 dark:text-amber-400 font-semibold hover:underline">Buka</button>` : '-'}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table></div>
            `}
          </div>
        </div>
      `;
    }

    function openExpenseModal() {
      openModal({
        title: 'Catat Pengeluaran Operasional', width: 'max-w-sm',
        body: `<form id="fExp" class="space-y-3 text-xs">
          <div><label class="block font-semibold mb-1">Keterangan *</label><input name="desc" required placeholder="misal: Token Listrik / Gaji / Sewa" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="block font-semibold mb-1">Nominal (Rp) *</label><input name="amt" type="number" min="1" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>
            <div><label class="block font-semibold mb-1">Tanggal</label><input name="date" type="date" value="${todayISO()}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
          </div>
          <div><label class="block font-semibold mb-1">Metode</label><select name="met" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900"><option>Tunai</option><option>Transfer</option><option>QRIS</option></select></div>
        </form>`,
        foot: `<button onclick="closeModal()" class="px-3.5 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700">Batal</button><button onclick="saveExp()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white">Simpan</button>`
      });
    }
    function saveExp() {
      const fd = new FormData(document.getElementById('fExp'));
      const desc = String(fd.get('desc') || '').trim(), amt = parseFloat(fd.get('amt')) || 0;
      if (!desc || amt <= 0) return toast('Isi keterangan & nominal valid.', 'warning');
      const iso = new Date(`${fd.get('date') || todayISO()}T${new Date().toTimeString().slice(0, 8)}`).toISOString();
      addJournal({ type: 'Pengeluaran', refNo: `EXP-${Date.now().toString().slice(-5)}`, description: desc, amount: amt, direction: 'out', paymentMethod: fd.get('met'), date: iso });
      save(); closeModal(); toast('Pengeluaran tercatat di jurnal.'); render();
    }

    // -------------------------------------------------------------------------
    // 16. HALAMAN 11: LAPORAN (HARIAN, MINGGUAN, BULANAN TERPISAH)
    // -------------------------------------------------------------------------
    function viewLaporan(el) {
      const rng = periodRange(ui.rep.period, ui.rep.date, ui.rep.month);
      const m = calcReport(rng.start, rng.end);

      el.innerHTML = `
        <div class="space-y-5">
          <!-- Filter Periode -->
          <div class="bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <div class="inline-flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800">
                ${[['harian', 'Harian'], ['mingguan', 'Mingguan'], ['bulanan', 'Bulanan']].map(([k, l]) => `
                  <button onclick="ui.rep.period='${k}'; render()" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition ${ui.rep.period === k ? 'bg-white dark:bg-slate-900 shadow-xs text-slate-900 dark:text-white' : 'text-slate-500'}">${l}</button>
                `).join('')}
              </div>
              ${ui.rep.period === 'bulanan'
                ? `<input type="month" value="${ui.rep.month}" onchange="ui.rep.month=this.value; render()" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs font-semibold" />`
                : `<input type="date" value="${ui.rep.date}" onchange="ui.rep.date=this.value; render()" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs font-semibold" />`
              }
              <span class="text-xs text-slate-400 px-1">Periode: <strong class="text-slate-700 dark:text-slate-200">${esc(rng.label)}</strong></span>
            </div>
            <button onclick="printReport('${esc(rng.label)}')" class="px-3.5 py-2 rounded-xl bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 text-xs font-bold flex items-center gap-1.5"><i data-lucide="printer" class="w-3.5 h-3.5"></i> Cetak Laporan</button>
          </div>

          <!-- 6 Metrik Keuangan Terpisah -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${statCard('1. Omzet Penjualan', rp(m.omzet), `${m.trxCount} transaksi berhasil`, 'trending-up', 'text-amber-500')}
            ${statCard('2. HPP (Harga Pokok)', rp(m.hpp), 'Akumulasi modal barang & jasa terjual', 'layers', 'text-slate-500')}
            ${statCard('3. Laba Kotor', rp(m.labaKotor), 'Omzet dikurangi HPP', 'plus-circle', 'text-emerald-500')}
            ${statCard('4. Pengeluaran Operasional', rp(m.pengeluaran), `Pembelian stok terpisah: ${rp(m.pembelian)}`, 'minus-circle', 'text-rose-500')}
            ${statCard('5. Laba Bersih', rp(m.labaBersih), 'Laba Kotor dikurangi Pengeluaran Operasional', 'award', m.labaBersih >= 0 ? 'text-blue-500' : 'text-rose-500')}
            ${statCard('6. Nilai Persediaan', rp(m.persediaan), `Aset stok gudang (${state.products.length} barang)`, 'boxes', 'text-violet-500')}
          </div>

          <!-- Rincian Penjualan pada Periode -->
          <div class="bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            <div class="px-4 py-3.5 border-b border-slate-100 dark:border-slate-800 text-sm font-bold">Rincian Penjualan (${m.sales.length})</div>
            ${!m.sales.length ? `<p class="p-10 text-center text-xs text-slate-400">Tidak ada penjualan pada periode ini.</p>` : `
              <div class="overflow-x-auto"><table class="w-full text-xs text-left">
                <thead class="bg-slate-50 dark:bg-slate-900/60 text-slate-500"><tr><th class="p-3">No. Struk</th><th class="p-3">Tanggal</th><th class="p-3">Pelanggan</th><th class="p-3">Bayar</th><th class="p-3 text-right">Omzet</th><th class="p-3 text-right">HPP</th><th class="p-3 text-right">Laba Kotor</th><th class="p-3 text-center">Struk</th></tr></thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${m.sales.map(s => `<tr><td class="p-3 font-mono font-bold">${esc(s.invoiceNo)}</td><td class="p-3 whitespace-nowrap text-slate-400">${fmtDT(s.date)}</td><td class="p-3">${esc(s.customerName)}</td><td class="p-3">${esc(s.paymentMethod)}</td><td class="p-3 text-right font-mono font-bold">${rp(s.total)}</td><td class="p-3 text-right font-mono text-slate-400">${rp(s.totalHpp)}</td><td class="p-3 text-right font-mono font-semibold text-emerald-600">${rp(s.total - (s.totalHpp || 0))}</td><td class="p-3 text-center"><button onclick="openReceiptModal('${s.id}')" class="text-amber-600 dark:text-amber-400 font-semibold hover:underline">Struk</button></td></tr>`).join('')}
                </tbody>
              </table></div>
            `}
          </div>
        </div>
      `;
    }

    function printReport(label) {
      const rng = periodRange(ui.rep.period, ui.rep.date, ui.rep.month);
      const m = calcReport(rng.start, rng.end);
      document.getElementById('printArea').innerHTML = `
        <div style="font-family:Inter,sans-serif;max-width:720px;margin:0 auto;">
          <h2 style="margin:0;">${esc(state.settings.shopName)} — Laporan Keuangan (${ui.rep.period.toUpperCase()})</h2>
          <p style="margin:4px 0 16px;font-size:12px;color:#555;">Periode: ${esc(label)}</p>
          <table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:20px;">
            <tr><td style="padding:8px;border:1px solid #ddd;">Omzet Penjualan</td><td style="padding:8px;border:1px solid #ddd;text-align:right;font-weight:700;">${rp(m.omzet)}</td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;">HPP (Harga Pokok Penjualan)</td><td style="padding:8px;border:1px solid #ddd;text-align:right;">${rp(m.hpp)}</td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;">Laba Kotor</td><td style="padding:8px;border:1px solid #ddd;text-align:right;font-weight:700;">${rp(m.labaKotor)}</td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;">Pengeluaran Operasional</td><td style="padding:8px;border:1px solid #ddd;text-align:right;">${rp(m.pengeluaran)}</td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;background:#f8fafc;"><b>Laba Bersih</b></td><td style="padding:8px;border:1px solid #ddd;background:#f8fafc;text-align:right;font-weight:800;">${rp(m.labaBersih)}</td></tr>
            <tr><td style="padding:8px;border:1px solid #ddd;">Nilai Persediaan Gudang (Terpisah)</td><td style="padding:8px;border:1px solid #ddd;text-align:right;font-weight:700;">${rp(m.persediaan)}</td></tr>
          </table>
        </div>
      `;
      window.print();
    }

    // -------------------------------------------------------------------------
    // 17. HALAMAN 12: PENGATURAN
    // -------------------------------------------------------------------------
    function viewPengaturan(el) {
      const s = state.settings;
      el.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <form onsubmit="saveSettings(event)" class="lg:col-span-7 bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 space-y-3.5 text-xs">
            <h3 class="text-sm font-bold">Profil Usaha & Pengaturan Struk Kasir</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div class="sm:col-span-2"><label class="block font-semibold mb-1">Nama Percetakan</label><input name="shopName" value="${esc(s.shopName)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div class="sm:col-span-2"><label class="block font-semibold mb-1">Tagline</label><input name="tagline" value="${esc(s.tagline)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div class="sm:col-span-2"><label class="block font-semibold mb-1">Alamat</label><input name="address" value="${esc(s.address)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div><label class="block font-semibold mb-1">Telepon / WA</label><input name="phone" value="${esc(s.phone)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div><label class="block font-semibold mb-1">Instagram / Sosmed</label><input name="instagram" value="${esc(s.instagram)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div><label class="block font-semibold mb-1">Prefix No. Struk</label><input name="invoicePrefix" value="${esc(s.invoicePrefix)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div>
              <div><label class="block font-semibold mb-1">Batas Stok Menipis</label><input name="lowStockThreshold" type="number" value="${s.lowStockThreshold}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div>
              <div class="sm:col-span-2"><label class="block font-semibold mb-1">Catatan Kaki Struk</label><textarea name="footerNote" rows="2" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">${esc(s.footerNote)}</textarea></div>
            </div>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 font-bold">Simpan Pengaturan</button>
          </form>

          <div class="lg:col-span-5 bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 space-y-3 text-xs">
            <h3 class="text-sm font-bold">Data & Cadangan (Backup)</h3>
            <button onclick="openExcelModal()" class="w-full py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold flex items-center justify-center gap-2"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Impor Excel Inventaris</button>
            <button onclick="backupJSON()" class="w-full py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 font-semibold flex items-center justify-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800"><i data-lucide="download" class="w-4 h-4"></i> Backup Semua Data (.json)</button>
            <label class="w-full py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 font-semibold flex items-center justify-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer">
              <i data-lucide="upload" class="w-4 h-4"></i> Pulihkan Backup (.json)
              <input type="file" accept=".json" class="hidden" onchange="if(this.files[0]) restoreJSON(this.files[0])" />
            </label>
            <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
              <button onclick="resetAllData()" class="w-full py-2.5 px-4 rounded-xl bg-rose-50 dark:bg-rose-950/30 text-rose-600 dark:text-rose-400 font-bold hover:bg-rose-100">Reset Seluruh Data Aplikasi</button>
            </div>
          </div>
        </div>
      `;
    }

    function saveSettings(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      Object.assign(state.settings, {
        shopName: String(fd.get('shopName') || '').trim() || 'PERCETAKAN KOBRA HITAM',
        tagline: String(fd.get('tagline') || '').trim(),
        address: String(fd.get('address') || '').trim(),
        phone: String(fd.get('phone') || '').trim(),
        instagram: String(fd.get('instagram') || '').trim(),
        invoicePrefix: String(fd.get('invoicePrefix') || 'KH').trim().toUpperCase(),
        lowStockThreshold: Math.max(0, parseInt(fd.get('lowStockThreshold'), 10) || 10),
        footerNote: String(fd.get('footerNote') || '').trim()
      });
      save(); toast('Pengaturan berhasil disimpan.'); renderNav();
    }

    function backupJSON() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
      a.download = `Backup_Kobra_Hitam_${todayISO()}.json`;
      a.click();
      toast('Backup JSON berhasil diunduh.');
    }

    function restoreJSON(file) {
      const r = new FileReader();
      r.onload = e => {
        try {
          const d = JSON.parse(e.target.result);
          if (!d || typeof d !== 'object') throw new Error('Format tidak valid');
          state = { ...defaultState(), ...d };
          save(); applyTheme(); toast('Data backup berhasil dipulihkan.'); render();
        } catch (err) { toast('Gagal memulihkan: ' + err.message, 'error'); }
      };
      r.readAsText(file);
    }

    function resetAllData() {
      confirmDialog('Reset Seluruh Data?', 'Semua data barang, transaksi, jurnal, dan pengaturan akan dikembalikan ke awal.', () => {
        state = defaultState(); save(); applyTheme(); toast('Aplikasi direset.', 'info'); go('dashboard');
      }, 'Ya, Reset');
    }

    // -------------------------------------------------------------------------
    // 18. INISIALISASI APLIKASI
    // -------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      updateBadges();
      renderNav();
      render();
      document.getElementById('modalWrap').addEventListener('click', e => { if (e.target.id === 'modalWrap') closeModal(); });
    });
  </script>
</body>
</html>
