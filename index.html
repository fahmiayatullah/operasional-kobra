    function extractSheetId(url) {
      if (!url) return DEFAULT_SHEET_ID;
      const m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
      return m ? m[1] : DEFAULT_SHEET_ID;
    }

    function fetchGvizJsonp(sheetId, sheetName) {
      return new Promise((resolve, reject) => {
        const cbName = 'gviz_cb_' + Math.random().toString(36).substring(2, 9);
        const script = document.createElement('script');
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Koneksi ke Google Sheets timeout (15 detik).'));
        }, 15000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function(response) {
          cleanup();
          if (response && response.status === 'ok' && response.table) {
            resolve(response.table);
          } else {
            reject(new Error(response?.errors?.[0]?.message || 'Gagal memproses spreadsheet'));
          }
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('Tidak dapat terhubung ke Google Sheets'));
        };

        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${cbName}`;
        script.src = url;
        document.head.appendChild(script);
      });
    }

    let sb = null;

    function getSupabase() {
      if (sb) return sb;
      const url = (state.settings.supabaseUrl || DEFAULT_SUPABASE_URL || '').trim();
      const key = (state.settings.supabaseKey || DEFAULT_SUPABASE_KEY || '').trim();
      if (url && key && window.supabase && typeof window.supabase.createClient === 'function') {
        try {
          sb = window.supabase.createClient(url, key);
          initSupabaseRealtime();
          return sb;
        } catch (err) {
          console.error('Inisialisasi Supabase gagal:', err);
          return null;
        }
      }
      return null;
    }

    function initSupabaseRealtime() {
      if (!sb) return;
      if (sbRealtimeChannel) {
        try { sb.removeChannel(sbRealtimeChannel); } catch (e) {}
      }

      sbRealtimeChannel = sb.channel('kobra_realtime_changes')
        // 1. Transaksi Penjualan Masuk / Dihapus
        .on('postgres_changes', { event: '*', schema: 'public', table: 'sales' }, payload => {
          if (payload.eventType === 'INSERT') {
            const r = payload.new;
            if (!state.sales.some(s => s.invoiceNo === r.invoice_no)) {
              state.sales.unshift({
                id: r.id,
                invoiceNo: r.invoice_no,
                date: r.date,
                customerName: r.customer_name || 'Pelanggan Umum',
                notes: r.notes || '',
                subtotal: Number(r.subtotal) || 0,
                discountAmount: Number(r.discount_amount) || 0,
                total: Number(r.total) || 0,
                totalHpp: Number(r.total_hpp) || 0,
                paymentMethod: r.payment_method || 'Tunai',
                paidAmount: Number(r.paid_amount) || 0,
                changeAmount: Number(r.change_amount) || 0,
                items: Array.isArray(r.items) ? r.items : []
              });
              save();
              updateBadges();
              render();
              toast(`Transaksi Baru: ${r.invoice_no} (${rp(r.total)})`, 'info');
            }
          } else if (payload.eventType === 'DELETE') {
            const delId = payload.old?.id;
            if (delId) {
              const sale = state.sales.find(s => s.id === delId);
              const inv = sale?.invoiceNo;
              state.sales = state.sales.filter(s => s.id !== delId);
              if (inv) {
                state.journal = state.journal.filter(j => j.refNo !== inv && j.meta?.saleId !== delId);
              }
              save();
              updateBadges();
              render();
            }
          }
        })
        // 2. Jurnal Keuangan Masuk / Dihapus
        .on('postgres_changes', { event: '*', schema: 'public', table: 'journal' }, payload => {
          if (payload.eventType === 'INSERT') {
            const j = payload.new;
            if (!state.journal.some(x => x.id === j.id)) {
              state.journal.unshift({
                id: j.id,
                date: j.date,
                type: j.type,
                refNo: j.ref_no || '-',
                description: j.description || '',
                direction: j.direction || 'neutral',
                amount: Number(j.amount) || 0,
                hpp: Number(j.hpp) || 0,
                paymentMethod: j.payment_method || 'Tunai',
                meta: j.meta || {}
              });
              save();
              render();
            }
          } else if (payload.eventType === 'DELETE') {
            const delId = payload.old?.id;
            if (delId) {
              const j = state.journal.find(x => x.id === delId);
              const saleId = j?.meta?.saleId;
              const refNo = j?.ref_no;
              state.journal = state.journal.filter(x => x.id !== delId);
              if (saleId || (refNo && refNo.startsWith('KH-'))) {
                state.sales = state.sales.filter(s => s.id !== saleId && s.invoiceNo !== refNo);
              }
              save();
              render();
            }
          }
        })
        // 3. Perubahan Stok & Harga Produk Realtime
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'products' }, payload => {
          const pNew = payload.new;
          const p = state.products.find(x => x.id === pNew.id);
          if (p) {
            p.stok = Number(pNew.stok);
            p.hargaJual = Number(pNew.harga_jual);
            if (pNew.custom_price !== undefined) p.customPrice = pNew.custom_price;
            save();
            render();
          }
        })
        .subscribe(status => {
          console.log('Supabase Realtime status:', status);
          updateSyncBadgeUI();
        });
    }

    function updateSyncBadgeUI() {

      const url = state.settings.supabaseUrl || DEFAULT_SUPABASE_URL;

    let isSyncing = false;

    async function syncAllData(silent = false) {
      if (isSyncing) return;
      isSyncing = true;

      const client = getSupabase();
      const dot = document.getElementById('syncDot');
      const label = document.getElementById('sheetsSyncLabel');
      const sideText = document.getElementById('sidebarSyncText');

      if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-ping';
      if (label) label.textContent = 'Menyinkronkan...';
      if (sideText) sideText.textContent = 'Menyinkronkan...';

      // 1. JIKA SUPABASE TERHUBUNG: Sinkronkan langsung dari PostgreSQL Cloud!
      if (client) {
        if (!silent) toast('Menghubungkan ke Supabase Cloud (PostgreSQL)...', 'info');
        try {
          // A. Ambil Produk (83 barang)
          const { data: prods, error: errP } = await client.from('products').select('*').order('no', { ascending: true });
          if (!errP && prods && prods.length > 0) {
            state.products = prods.map(p => ({
              id: p.id,
              no: p.no,
              nama: p.nama,
              tanggalPembelian: p.tanggal_pembelian || '',
              deskripsi: p.deskripsi || '',
              stok: Number(p.stok) || 0,
              isiKemasan: p.isi_kemasan || '',
              hargaBeli: Number(p.harga_beli) || 0,
              hargaBeliSatuan: Number(p.harga_beli_satuan) || 0,
              hargaJual: Number(p.harga_jual) || 0,
              customPrice: !!p.custom_price,
              kategoriId: p.kategori_id || 'cat_atk',
              supplier: p.supplier || '',
              aktif: p.aktif !== false
            }));
          }

          // B. Ambil Jasa (Services)
          const { data: svcs, error: errS } = await client.from('services').select('*');
          if (!errS && svcs && svcs.length > 0) {
            state.services = svcs.map(s => ({
              id: s.id,
              nama: s.nama,
              satuan: s.satuan || 'unit',
              listrik: Number(s.listrik) || 0,
              jasa: Number(s.jasa) || 0,
              markupPct: Number(s.markup_pct) || 50,
              marginPct: Number(s.margin_pct) || 35,
              hargaJual: Number(s.harga_jual) || 0,
              customPrice: !!s.custom_price,
              aktif: s.aktif !== false,
              bahanItems: s.bahan_items || []
            }));
          }

          // C. Ambil Belanja
          const { data: blj, error: errB } = await client.from('belanja').select('*');
          if (!errB && blj && blj.length > 0) {
            state.belanja = blj.map(b => ({
              id: b.id,
              nama: b.nama,
              qty: Number(b.qty) || 1,
              nominal: Number(b.nominal) || 0,
              biayaSatuan: Number(b.biaya_satuan) || 0
            }));
          }

          // D. Ambil Transaksi Penjualan (Sales)
          const { data: remoteSales, error: errSale } = await client.from('sales').select('*').order('date', { ascending: false }).limit(1000);
          if (!errSale && remoteSales) {
            state.sales = remoteSales.map(r => ({
              id: r.id,
              invoiceNo: r.invoice_no,
              date: r.date,
              customerName: r.customer_name || 'Pelanggan Umum',
              notes: r.notes || '',
              subtotal: Number(r.subtotal) || 0,
              discountAmount: Number(r.discount_amount) || 0,
              total: Number(r.total) || 0,
              totalHpp: Number(r.total_hpp) || 0,
              paymentMethod: r.payment_method || 'Tunai',
              paidAmount: Number(r.paid_amount) || 0,
              changeAmount: Number(r.change_amount) || 0,
              items: Array.isArray(r.items) ? r.items : []
            }));
          }

          // E. Ambil Jurnal Keuangan
          const { data: remoteJrn, error: errJrn } = await client.from('journal').select('*').order('date', { ascending: false }).limit(2000);
          if (!errJrn && remoteJrn) {
            state.journal = remoteJrn.map(j => ({
              id: j.id,
              date: j.date,
              type: j.type,
              refNo: j.ref_no || '-',
              description: j.description || '',
              direction: j.direction || 'neutral',
              amount: Number(j.amount) || 0,
              hpp: Number(j.hpp) || 0,
              paymentMethod: j.payment_method || 'Tunai',
              meta: j.meta || {}
            }));
          }

          // F. Rekonsiliasi: Pastikan setiap Penjualan memiliki catatan di Jurnal
          if (state.sales.length > 0) {
            const missingJournals = [];
            for (const s of state.sales) {
              const hasJrn = state.journal.some(j => j.refNo === s.invoiceNo || j.meta?.saleId === s.id);
              if (!hasJrn) {
                const jNew = {
                  id: uid('jrn'),
                  date: s.date,
                  type: 'Penjualan',
                  refNo: s.invoiceNo,
                  description: `Penjualan ${s.customerName} (${s.items?.length || 1} item)`,
                  direction: 'in',
                  amount: s.total,
                  hpp: s.totalHpp || 0,
                  paymentMethod: s.paymentMethod || 'Tunai',
                  meta: { saleId: s.id }
                };
                state.journal.unshift(jNew);
                missingJournals.push(jNew);
              }
            }
            if (missingJournals.length > 0) {
              client.from('journal').insert(missingJournals.map(j => ({
                id: j.id,
                date: j.date,
                type: j.type,
                ref_no: j.refNo,
                description: j.description,
                direction: 'in',
                amount: j.amount,
                hpp: j.hpp,
                payment_method: j.paymentMethod,
                meta: j.meta
              }))).catch(e => console.error('Reconciliation journal insert error:', e));
            }
          }
          state.settings.lastSync = new Date().toISOString();
          save();
          updateBadges();
          renderNav();
          render();
          updateSyncBadgeUI();

          if (!silent) toast(`Berhasil sinkronkan Supabase! ${state.products.length} barang, ${state.sales.length} transaksi.`, 'success');
          isSyncing = false;
          return;
        } catch (errSupabase) {
          console.error('Supabase sync error:', errSupabase);
          if (!silent) toast('Koneksi Supabase bermasalah: ' + errSupabase.message + '. Membaca data spreadsheet...', 'warning');
        }
      }

      // 2. JIKA SUPABASE BELUM DIATUR: Gunakan Google Sheets Read-Only sebagai Fallback
      await syncAllFromSheets(silent);
      isSyncing = false;
    }

    let isSyncingSheets = false;

    async function syncAllFromSheets(silent = false) {
      if (isSyncingSheets) return;
      isSyncingSheets = true;
      const sheetId = extractSheetId(state.settings.spreadsheetUrl);

      const dot = document.getElementById('syncDot');
      const label = document.getElementById('sheetsSyncLabel');
      const sideText = document.getElementById('sidebarSyncText');

      if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-ping';
      if (label) label.textContent = 'Menyinkronkan...';
      if (sideText) sideText.textContent = 'Menyinkronkan...';
      if (!silent) toast('Menghubungkan ke Google Spreadsheet Kobra Hitam...', 'info');

      try {
        // 1. Ambil Harga Dasar (83 Barang)
        const tableDasar = await fetchGvizJsonp(sheetId, 'Harga Dasar');
        const newProducts = [];
        tableDasar.rows.forEach(r => {
          const c = r.c || [];
          const cell = i => (c[i] ? (c[i].f !== undefined && c[i].f !== null ? c[i].f : c[i].v) : '') || '';
          const no = String(cell(0)).trim();
          const tgl = String(cell(1)).trim();
          const nama = String(cell(2)).trim() || String(cell(3)).trim();
          const deskripsi = String(cell(3)).trim();
          const stok = parseIndoNum(cell(4));
          const isiKemasan = String(cell(5)).trim();
          const hargaBeli = parseIndoNum(cell(6));
          const hargaBeliSatuan = parseIndoNum(cell(7));
          const hargaJual = parseIndoNum(cell(8));
          const supplier = String(cell(12)).trim();

          if (nama && no && !isNaN(parseInt(no, 10))) {
            const noInt = parseInt(no, 10);
            const exist = state.products.find(p => p.nama.toLowerCase() === nama.toLowerCase() || p.no === noInt);
            // Jika harga diubah secara manual oleh pengguna di web, pertahankan harga manual tersebut!
            const finalHargaJual = (exist && exist.customPrice && exist.hargaJual > 0) ? exist.hargaJual : (hargaJual || exist?.hargaJual || 0);

            newProducts.push({
              id: exist?.id || `prd_${String(noInt).padStart(3, '0')}`,
              no: noInt,
              nama,
              tanggalPembelian: tgl || exist?.tanggalPembelian || '',
              deskripsi,
              stok: isFinite(stok) ? stok : (exist?.stok || 0),
              isiKemasan,
              hargaBeli,
              hargaBeliSatuan,
              hargaJual: finalHargaJual,
              customPrice: !!(exist && exist.customPrice),
              kategoriId: guessCat(nama, deskripsi),
              supplier,
              aktif: true
            });
          }
        });

        if (newProducts.length > 0) {
          state.products = newProducts;
        }

        // 2. Ambil Harga Jasa & HPP dari Spreadsheet
        try {
          const tableJasa = await fetchGvizJsonp(sheetId, 'Harga Jasa');
          syncJasaFromSheet(tableJasa);
        } catch (eJasa) {
          console.warn('Gagal memuat tab Harga Jasa:', eJasa);
        }

        // 3. Ambil Belanja (Pengadaan Bahan)
        try {
          const tableBelanja = await fetchGvizJsonp(sheetId, 'Belanja');
          const newBelanja = [];
          tableBelanja.rows.slice(1).forEach((r, idx) => {
            const c = r.c || [];
            const cell = i => (c[i] ? (c[i].f !== undefined && c[i].f !== null ? c[i].f : c[i].v) : '') || '';
            const ket = String(cell(4)).trim();
            const qty = parseIndoNum(cell(5));
            const nominal = parseIndoNum(cell(10));
            if (ket) {
              newBelanja.push({
                id: `blj_${idx + 1}`,
                nama: ket,
                qty: qty || 1,
                nominal: nominal || 0,
                biayaSatuan: qty > 0 ? Math.round(nominal / qty) : nominal
              });
            }
          });
          if (newBelanja.length > 0) state.belanja = newBelanja;
        } catch (eBelanja) {
          console.warn('Gagal memuat tab Belanja:', eBelanja);
        }

        // 4. Jika Apps Script 2-Arah telah dikonfigurasi, sinkronkan Transaksi, Jurnal, dan Harga Kustom
        if (state.settings.appsScriptUrl) {
          try {
            const gasData = await callAppsScriptGet('getAll');
            if (gasData) {
              // A. Gabungkan transaksi (sales)
              if (Array.isArray(gasData.sales) && gasData.sales.length > 0) {
                const existingMap = new Map(state.sales.map(s => [s.invoiceNo, s]));
                gasData.sales.forEach(remSale => {
                  existingMap.set(remSale.invoiceNo, remSale);
                });
                state.sales = Array.from(existingMap.values()).sort((a, b) => new Date(b.date) - new Date(a.date));
              }

              // B. Gabungkan jurnal keuangan
              if (Array.isArray(gasData.journal) && gasData.journal.length > 0) {
                const jrnMap = new Map(state.journal.map(j => [j.id, j]));
                gasData.journal.forEach(remJrn => {
                  jrnMap.set(remJrn.id, remJrn);
                });
                state.journal = Array.from(jrnMap.values()).sort((a, b) => new Date(b.date) - new Date(a.date));
              }

              // C. Terapkan harga kustom dari spreadsheet jika ada
              if (gasData.customPrices && typeof gasData.customPrices === 'object') {
                Object.keys(gasData.customPrices).forEach(key => {
                  const val = Number(gasData.customPrices[key]);
                  if (val > 0) {
                    if (key.startsWith('prd_')) {
                      const pId = key.replace('prd_', '');
                      const prod = state.products.find(p => p.id === pId || `prd_${p.id}` === key);
                      if (prod) { prod.hargaJual = val; prod.customPrice = true; }
                    } else if (key.startsWith('svc_')) {
                      const sId = key.replace('svc_', '');
                      const svc = state.services.find(s => s.id === sId || s.id === key);
                      if (svc) { svc.hargaJual = val; svc.customPrice = true; }
                    }
                  }
                });
              }
            }
          } catch (eGas) {
            console.warn('Apps Script sync warning:', eGas);
          }
        }

        // 5. Kalibrasi Resep Jasa
        autoLinkRecipes();

        state.settings.lastSync = new Date().toISOString();
        save();
        updateBadges();
        renderNav();
        render();

        if (state.settings.appsScriptUrl) {
          if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
          if (label) label.textContent = '2-Arah: HP & PC Terhubung';
          if (sideText) sideText.textContent = `Sinkron 2-Arah (${state.products.length})`;
          if (!silent) {
            toast(`Sinkronisasi 2-Arah Berhasil! Data kasir, HP, dan spreadsheet 100% identik.`);
          }
        } else {
          if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
          if (label) label.textContent = 'Sheets 1-Arah (Master Data)';
          if (sideText) sideText.textContent = `Sinkronkan Sheets (${state.products.length})`;
          if (!silent) {
            toast(`Berhasil sinkronkan ${state.products.length} Barang & ${state.services.length} Jasa dari Google Sheets!`);
          }
        }
      } catch (err) {
        console.error('Sync error:', err);
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-500';
        if (label) label.textContent = 'Mode Offline (Lokal)';
        if (sideText) sideText.textContent = 'Sinkronkan Sheets';
        if (!silent) {
          toast('Gagal terhubung ke Google Sheets: ' + err.message + '. Menggunakan data lokal.', 'warning');
        }
      } finally {
        isSyncingSheets = false;
      }
    }

    function syncJasaFromSheet(tableJasa) {
      if (!tableJasa || !tableJasa.rows) return;
      const servicesMap = {
        svc_fotokopi: { items: [], listrik: 2, jasa: 163 },
        svc_print_bw: { items: [], listrik: 21, jasa: 189 },
        svc_print_warna: { items: [], listrik: 42, jasa: 228 },
        svc_jilid: { items: [], listrik: 0, jasa: 0 },
        svc_lam_f4: { items: [], listrik: 320, jasa: 1000 },
        svc_lam_a4: { items: [], listrik: 320, jasa: 1000 }
      };

      let currentSvc = 'svc_fotokopi';
      tableJasa.rows.forEach((r, idx) => {
        const c = r.c || [];
        const cell = i => (c[i] ? (c[i].f !== undefined && c[i].f !== null ? c[i].f : c[i].v) : '') || '';
        const col0 = String(cell(0)).trim().toLowerCase();
        const col1 = String(cell(1)).trim();
        const col6 = parseIndoNum(cell(6));

        if (col0.includes('print warna')) currentSvc = 'svc_print_warna';
        else if (col0.includes('print')) currentSvc = 'svc_print_bw';
        else if (col0.includes('jilid')) currentSvc = 'svc_jilid';
        else if (col0.includes('laminating')) currentSvc = idx < 28 ? 'svc_lam_f4' : 'svc_lam_a4';
        else if (col0.includes('foto copy') || col0.includes('fotokopi')) currentSvc = 'svc_fotokopi';

        if (col1 && !col1.toLowerCase().includes('total')) {
          const lCol1 = col1.toLowerCase();
          if (lCol1.includes('listrik')) {
            servicesMap[currentSvc].listrik = col6 || servicesMap[currentSvc].listrik;
          } else if (lCol1.includes('jasa')) {
            servicesMap[currentSvc].jasa = col6 || servicesMap[currentSvc].jasa;
          } else {
            servicesMap[currentSvc].items.push({ id: uid('b'), nama: col1, biaya: col6 });
          }
        }
      });

      // Update state.services without overriding custom user selling price
      state.services.forEach(s => {
        const parsed = servicesMap[s.id];
        if (parsed && parsed.items.length) {
          s.bahanItems = parsed.items;
          s.listrik = parsed.listrik;
          s.jasa = parsed.jasa;
        }
      });
    }

    // -------------------------------------------------------------------------
    // 2. UTILITAS RINGKAS
    // -------------------------------------------------------------------------
    function todayISO() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    const uid = (p = 'id') => `${p}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const rp = n => { const v = Number(n) || 0; return (v < 0 ? '-' : '') + 'Rp' + Math.round(Math.abs(v)).toLocaleString('id-ID'); };
    const num = (n, d = 2) => (Number(n) || 0).toLocaleString('id-ID', { maximumFractionDigits: d });
    const fmtDT = iso => { if (!iso) return '-'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); };
    const fmtD = iso => { if (!iso) return '-'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); };

    function svcHpp(s) {
      const bahan = (s.bahanItems || []).reduce((a, b) => a + (Number(b.biaya) || 0), 0);
      const listrik = Number(s.listrik) || 0;
      const jasa = Number(s.jasa) || 0;
      return { bahan, listrik, jasa, hpp: bahan + listrik + jasa };
    }

    function catById(id) {
      return state.categories.find(c => c.id === id) || { nama: 'Umum', warna: '#64748B' };
    }

    function totalInventoryValue() {
      return state.products.reduce((s, p) => s + Math.max(0, Number(p.stok) || 0) * (Number(p.hargaBeliSatuan) || 0), 0);
    }

    function toast(msg, type = 'success') {
      const box = document.getElementById('toastBox');
      const cls = {
        success: 'bg-slate-900 dark:bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        info: 'bg-slate-700 text-white'
      }[type] || 'bg-slate-900 text-white';
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2.5 animate-pop ${cls}`;
      el.innerHTML = `<i data-lucide="${type === 'error' ? 'alert-circle' : type === 'warning' ? 'alert-triangle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i><span>${esc(msg)}</span>`;
      box.appendChild(el);
      lucide.createIcons({ nodes: [el] });
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(() => el.remove(), 260); }, 3000);
    }

    function openModal({ title, sub = '', body = '', foot = '', width = 'max-w-2xl' }) {
      const wrap = document.getElementById('modalWrap');

      wrap.classList.remove('hidden');
      wrap.classList.add('flex');

      const wrap = document.getElementById('modalWrap');
      wrap.classList.add('hidden');

    function confirmDialog(title, msg, onYes, yesText = 'Lanjutkan', danger = true) {

      openModal({
        title, width: 'max-w-sm',
        body: `<p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${esc(msg)}</p>`,

    // -------------------------------------------------------------------------
    // 3. NAVIGASI & TEMA
    // -------------------------------------------------------------------------
    function applyTheme() {
      const dark = !!state.settings.darkMode;
      document.documentElement.classList.toggle('dark', dark);
      const ic = document.getElementById('themeIcon');
      if (ic) { ic.setAttribute('data-lucide', dark ? 'sun' : 'moon'); lucide.createIcons(); }
    }
    function toggleTheme() { state.settings.darkMode = !state.settings.darkMode; save(); applyTheme(); }
    // -------------------------------------------------------------------------
    // 3. NAVIGASI, SIDEBAR & AUTO-HIDE PADA GULIR (SCROLL)
    // -------------------------------------------------------------------------
    let sidebarOpen = window.innerWidth >= 1024 
      ? (localStorage.getItem('kobra_sidebar_open') !== 'false') 
      : false;

    function applySidebarState() {
      const sb = document.getElementById('sidebar');
      const main = document.getElementById('mainContent');
      const backdrop = document.getElementById('navBackdrop');
      const toggleIcon = document.getElementById('sidebarToggleIcon');
      const isDesktop = window.innerWidth >= 1024;

      if (isDesktop) {
        if (backdrop) backdrop.classList.add('hidden');
        if (sidebarOpen) {
          if (sb) {
            sb.classList.remove('-translate-x-full');
            sb.classList.add('translate-x-0');
          }
          if (main) {
            main.classList.remove('lg:pl-0');
            main.classList.add('lg:pl-64');
          }
        } else {
          if (sb) {
            sb.classList.remove('translate-x-0');
            sb.classList.add('-translate-x-full');
          }
          if (main) {
            main.classList.remove('lg:pl-64');
            main.classList.add('lg:pl-0');
          }
        }
      } else {
        // Mode Mobile / Layar Kecil
        if (main) {
          main.classList.remove('lg:pl-64');
          main.classList.add('lg:pl-0');
        }
        if (sidebarOpen) {
          if (sb) {
            sb.classList.remove('-translate-x-full');
            sb.classList.add('translate-x-0');
          }
          if (backdrop) backdrop.classList.remove('hidden');
        } else {
          if (sb) {
            sb.classList.remove('translate-x-0');
            sb.classList.add('-translate-x-full');
          }
          if (backdrop) backdrop.classList.add('hidden');
        }
      }

      if (toggleIcon) {
        toggleIcon.setAttribute('data-lucide', (isDesktop && sidebarOpen) ? 'panel-left-close' : 'menu');
        lucide.createIcons({ nodes: [toggleIcon.parentElement] });
      }
    }

    function toggleSidebar(force) {
      if (typeof force === 'boolean') {
        sidebarOpen = force;
      } else {
        sidebarOpen = !sidebarOpen;
      }
      if (window.innerWidth >= 1024) {
        localStorage.setItem('kobra_sidebar_open', sidebarOpen ? 'true' : 'false');
      }
      applySidebarState();
    }

    let lastScrollY = 0;
    let isHeaderHidden = false;

    function initScrollAutoHide() {
      window.addEventListener('scroll', () => {
        const currentScrollY = window.scrollY;
        const headerWrap = document.getElementById('headerWrapper');
        const floatingBtn = document.getElementById('floatingMenuBtn');

        const diff = currentScrollY - lastScrollY;

        // Scroll KE BAWAH melebihi 70px -> Sembunyikan header/menu
        if (currentScrollY > 70 && diff > 8 && !isHeaderHidden) {
          isHeaderHidden = true;
          if (headerWrap) headerWrap.style.transform = 'translateY(-100%)';
          if (floatingBtn) {
            floatingBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
            floatingBtn.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
          }
        } else if (diff < -6 && isHeaderHidden) {
          // Scroll KE ATAS -> Tampilkan kembali header/menu
          isHeaderHidden = false;
          if (headerWrap) headerWrap.style.transform = 'translateY(0)';
          if (floatingBtn) {
            floatingBtn.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
            floatingBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
          }
        }

        // Posisi paling atas
        if (currentScrollY <= 20 && isHeaderHidden) {
          isHeaderHidden = false;
          if (headerWrap) headerWrap.style.transform = 'translateY(0)';
          if (floatingBtn) {
            floatingBtn.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
            floatingBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
          }
        }

        lastScrollY = currentScrollY;
      }, { passive: true });
    }

    // -------------------------------------------------------------------------
    // 4. IMPOR EXCEL INVENTARIS (8 KOLOM ASLI TANPA MENGUBAH DATA)
    // -------------------------------------------------------------------------
    function parseIndoNum(v) {
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      let s = String(v ?? '').trim().replace(/Rp\.?/gi, '').replace(/\s+/g, '');
      if (!s) return 0;
      if (s.includes('.') && s.includes(',')) {
        s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
      } else if (s.includes('.')) {
        const parts = s.split('.');
        if (parts.length > 1 && parts[parts.length - 1].length === 3) s = s.replace(/\./g, '');
      } else if (s.includes(',')) {
        const parts = s.split(',');
        s = parts.length > 1 && parts[parts.length - 1].length === 3 ? s.replace(/,/g, '') : s.replace(',', '.');
      }
      const n = parseFloat(s.replace(/[^0-9.\-]/g, ''));
      return isFinite(n) ? n : 0;
    }

    function parseExcelDate(raw, fmt) {
      if (fmt && String(fmt).trim() && isNaN(Number(fmt))) return String(fmt).trim();
      if (typeof raw === 'number' && raw > 20000 && raw < 70000) {
        const d = new Date(Math.floor(raw - 25569) * 86400 * 1000);
        if (!isNaN(d)) {
          const p = n => String(n).padStart(2, '0');
          return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}`;
        }
      }
      return String(fmt ?? raw ?? '').trim();
    }

    function guessCat(nama, desk = '') {
      const t = `${nama} ${desk}`.toLowerCase();
      if (/hvs|kertas|a4|f4|art\s?paper|glossy|foto|stiker|sticker|folio|concorde/.test(t)) return 'cat_kertas';
      if (/tinta|toner|cartridge|cyan|magenta|yellow|black|epson|canon|brother/.test(t)) return 'cat_tinta';
      if (/jilid|buffalo|mika|lakban|spiral|staples|steples|cover|ring/.test(t)) return 'cat_jilid';
      if (/laminat|pouch|plastik/.test(t)) return 'cat_lam';
      if (/pulpen|pena|pensil|spidol|map|amplop|lem|gunting|cutter|buku/.test(t)) return 'cat_atk';
      return 'cat_lain';
    }

    function detectCols(row) {
      const hs = row.map(h => String(h || '').toLowerCase().trim());
      const find = (pats, ex = []) => hs.findIndex(h => h && !ex.some(e => e.test(h)) && pats.some(p => p.test(h)));
      return {
        nama: find([/nama\s*barang/, /^nama$/, /barang/, /produk/, /item/]),
        tanggalPembelian: find([/tanggal\s*pembelian/, /tgl\s*beli/, /tanggal/, /tgl/]),
        deskripsi: find([/deskripsi/, /keterangan/, /detail/, /spek/]),
        stok: find([/^stok$/, /stock/, /stok/]),
        isiKemasan: find([/isi\s*kemasan/, /kemasan/, /^isi$/, /pack/]),
        hargaBeliSatuan: find([/harga\s*beli\s*satuan/, /beli\s*satuan/, /harga\s*satuan/, /satuan/]),
        hargaBeli: find([/harga\s*beli/, /beli/, /modal/], [/satuan/]),
        hargaJual: find([/harga\s*jual/, /jual/])
      };
    }

    function readExcel(file) {
      if (typeof XLSX === 'undefined') return toast('Library Excel belum termuat.', 'error');
      const r = new FileReader();
      r.onload = e => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const sh = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(sh, { header: 1, raw: true, defval: '' });
          const fmt = XLSX.utils.sheet_to_json(sh, { header: 1, raw: false, defval: '' });
          prepareExcel(raw, fmt, file.name);
        } catch (err) { toast('Gagal membaca file: ' + err.message, 'error'); }
      };
      r.readAsArrayBuffer(file);
    }

    function readPastedExcel() {
      const txt = (document.getElementById('pasteTable')?.value || '').trim();
      if (!txt) return toast('Tempel data tabel terlebih dahulu.', 'warning');
      const rows = txt.split(/\r?\n/).map(l => l.split('\t'));
      prepareExcel(rows, rows, 'Clipboard Excel');
    }

    function prepareExcel(raw, fmt, name) {
      if (!raw || raw.length < 2) return toast('Baris data tidak mencukupi.', 'error');
      let hIdx = 0, best = -1;
      for (let i = 0; i < Math.min(10, raw.length); i++) {
        const sc = Object.values(detectCols(raw[i])).filter(v => v >= 0).length;
        if (sc > best) { best = sc; hIdx = i; }
      }
      ui.excelPending = { name, hIdx, headers: raw[hIdx], raw, fmt, map: detectCols(raw[hIdx]), mode: 'replace' };
      renderExcelPreview();
    }

    function extractExcelItems() {
      const { hIdx, raw, fmt, map } = ui.excelPending;
      const out = [];
      for (let i = hIdx + 1; i < raw.length; i++) {
        const r = raw[i] || [], f = fmt[i] || r;
        if (!r.some(c => String(c ?? '').trim() !== '')) continue;
        const gR = k => (map[k] >= 0 ? r[map[k]] : '');
        const gF = k => (map[k] >= 0 ? (f[map[k]] ?? r[map[k]]) : '');
        const nama = String(gF('nama') || gR('nama') || '').trim();
        if (!nama || /^total$/i.test(nama)) continue;
        const deskripsi = String(gF('deskripsi') ?? '').trim();
        out.push({
          id: uid('prd'),
          nama,
          tanggalPembelian: parseExcelDate(gR('tanggalPembelian'), gF('tanggalPembelian')),
          deskripsi,
          stok: parseIndoNum(gR('stok')),
          isiKemasan: String(gF('isiKemasan') ?? gR('isiKemasan') ?? '').trim(),
          hargaBeli: parseIndoNum(gR('hargaBeli')),
          hargaBeliSatuan: parseIndoNum(gR('hargaBeliSatuan')),
          hargaJual: parseIndoNum(gR('hargaJual')),
          kategoriId: guessCat(nama, deskripsi),
          aktif: true
        });
      }
      return out;
    }

            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">

    // -------------------------------------------------------------------------
    // 5. JURNAL OTOMATIS & PERHITUNGAN LAPORAN KEUANGAN
    // -------------------------------------------------------------------------
    function addJournal({ type, refNo = '-', description, amount = 0, hpp = 0, direction = 'neutral', paymentMethod = '-', date = new Date().toISOString(), meta = {} }) {
      state.journal.unshift({ id: uid('jrn'), date, type, refNo, description, amount: Number(amount) || 0, hpp: Number(hpp) || 0, direction, paymentMethod, meta });
    }

    function periodRange(period, dateStr, monthStr) {
      if (period === 'harian') {
        return { start: new Date(`${dateStr}T00:00:00`), end: new Date(`${dateStr}T23:59:59.999`), label: fmtD(dateStr) };
      }
      if (period === 'mingguan') {
        const ref = new Date(`${dateStr}T12:00:00`);
        const diff = ref.getDay() === 0 ? -6 : 1 - ref.getDay();
        const start = new Date(ref); start.setDate(ref.getDate() + diff); start.setHours(0, 0, 0, 0);
        const end = new Date(start); end.setDate(start.getDate() + 6); end.setHours(23, 59, 59, 999);
        return { start, end, label: `${fmtD(start.toISOString())} – ${fmtD(end.toISOString())}` };
      }
      const [y, m] = (monthStr || todayISO().slice(0, 7)).split('-').map(Number);
      const start = new Date(y, m - 1, 1, 0, 0, 0, 0);
      const end = new Date(y, m, 0, 23, 59, 59, 999);
      return { start, end, label: start.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }) };
    }

    function calcReport(start, end) {
      const hit = iso => { const d = new Date(iso); return d >= start && d <= end; };
      const sales = state.sales.filter(s => hit(s.date));
      const jrns = state.journal.filter(j => hit(j.date));
      const omzet = sales.reduce((a, s) => a + (Number(s.total) || 0), 0);
      const hpp = sales.reduce((a, s) => a + (Number(s.totalHpp) || 0), 0);
      const labaKotor = omzet - hpp;
      const pengeluaran = jrns.filter(j => j.type === 'Pengeluaran').reduce((a, j) => a + (Number(j.amount) || 0), 0);
      const pembelian = jrns.filter(j => j.type === 'Pembelian').reduce((a, j) => a + (Number(j.amount) || 0), 0);
      const labaBersih = labaKotor - pengeluaran;
      return { omzet, hpp, labaKotor, pengeluaran, pembelian, labaBersih, persediaan: totalInventoryValue(), trxCount: sales.length, sales, jrns };
    }

              <div class="flex justify-between"><span class="text-slate-400">Subtotal</span><span class="font-mono font-semibold">${rp(calc.subtotal)}</span></div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-400">Diskon</span>
                <div class="flex items-center gap-1">
                  <select onchange="ui.pos.discType=this.value; render()" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
                    <option value="rp" ${ui.pos.discType === 'rp' ? 'selected' : ''}>Rp</option>
                    <option value="pct" ${ui.pos.discType === 'pct' ? 'selected' : ''}>%</option>
                  </select>
                  <input type="number" min="0" value="${ui.pos.discVal}" oninput="ui.pos.discVal=parseFloat(this.value)||0; refreshPosTotals()" class="w-24 text-right px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" />
                </div>
              </div>

              <div class="p-3 rounded-xl bg-slate-900 dark:bg-amber-500/15 text-white dark:text-amber-300 flex items-center justify-between">
                <span class="font-bold">Total</span>
                <span id="posTot" class="font-mono font-extrabold text-lg">${rp(calc.total)}</span>
              </div>

              <div class="grid grid-cols-4 gap-1.5">
                ${['Tunai', 'QRIS', 'Transfer', 'Debit'].map(m => `
                  <button onclick="ui.pos.method='${m}'; if('${m}'!=='Tunai') ui.pos.paid=cartTotals().total; render()" class="py-1.5 rounded-lg text-[11px] font-semibold border transition ${ui.pos.method === m ? 'bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 border-transparent' : 'border-slate-200 dark:border-slate-700'}">${m}</button>
                `).join('')}
              </div>

              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-400">Bayar</span>
                <input id="posPaid" type="number" min="0" value="${ui.pos.paid}" oninput="ui.pos.paid=parseFloat(this.value)||0; refreshPosTotals()" class="w-32 text-right px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" />
              </div>
              <div class="flex justify-end gap-1.5">
                <button onclick="quickPay(cartTotals().total)" class="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-medium hover:bg-amber-500 hover:text-slate-950">Pas</button>
                ${[20000, 50000, 100000].map(v => `<button onclick="quickPay(${v})" class="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-mono hover:bg-amber-500 hover:text-slate-950">${v / 1000}rb</button>`).join('')}
              </div>
              <div class="flex justify-between">
                <span class="text-slate-400">Kembalian</span>
                <span id="posChg" class="font-mono font-bold ${calc.change >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}">${rp(calc.change)}</span>
              </div>

              <button onclick="checkout()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-2 transition">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i> Bayar & Cetak Struk
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function cartTotals() {
      const subtotal = ui.pos.cart.reduce((s, i) => s + (Number(i.harga) || 0) * (Number(i.qty) || 0), 0);
      const disc = ui.pos.discType === 'pct'
        ? Math.round(subtotal * Math.min(100, Math.max(0, Number(ui.pos.discVal) || 0)) / 100)
        : Math.min(subtotal, Math.max(0, Number(ui.pos.discVal) || 0));
      const total = Math.max(0, subtotal - disc);
      const paid = Number(ui.pos.paid) || 0;
      return { subtotal, disc, total, paid, change: paid - total };
    }
    function refreshPosTotals() {
      const c = cartTotals();
      const t = document.getElementById('posTot'), ch = document.getElementById('posChg');
      if (t) t.textContent = rp(c.total);
      if (ch) { ch.textContent = rp(c.change); ch.className = `font-mono font-bold ${c.change >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}`; }
    }
    function quickPay(v) { ui.pos.paid = v; const el = document.getElementById('posPaid'); if (el) el.value = v; refreshPosTotals(); }
    function setCartQty(idx, v) { ui.pos.cart[idx].qty = Math.max(1, parseInt(v, 10) || 1); if (ui.pos.method !== 'Tunai') ui.pos.paid = cartTotals().total; render(); }

    function addCart(type, id) {
      const ex = ui.pos.cart.find(c => c.type === type && c.refId === id);
      if (ex) ex.qty += 1;
      else if (type === 'barang') {
        const p = state.products.find(x => x.id === id);
        if (!p) return;
        ui.pos.cart.push({ type, refId: id, nama: p.nama, satuan: p.isiKemasan || 'pcs', harga: Number(p.hargaJual) || 0, hppUnit: Number(p.hargaBeliSatuan) || 0, qty: 1 });
      } else {
        const s = state.services.find(x => x.id === id);
        if (!s) return;
        ui.pos.cart.push({ type, refId: id, nama: s.nama, satuan: s.satuan || 'unit', harga: Number(s.hargaJual) || 0, hppUnit: svcHpp(s).hpp, qty: 1 });
      }
      if (ui.pos.method !== 'Tunai') ui.pos.paid = cartTotals().total;
      render();
    }

    function checkout() {
      if (!ui.pos.cart.length) return toast('Keranjang masih kosong.', 'warning');
      const c = cartTotals();
      if (ui.pos.method === 'Tunai' && c.paid < c.total) return toast('Uang bayar kurang dari total tagihan.', 'error');

      const paidAmount = ui.pos.method === 'Tunai' ? c.paid : c.total;
      const changeAmount = Math.max(0, paidAmount - c.total);
      const now = new Date().toISOString();
      const inv = `${state.settings.invoicePrefix || 'KH'}-${todayISO().replace(/-/g, '').slice(2)}-${String(state.settings.invoiceCounter++).padStart(4, '0')}`;

      let totalHpp = 0;
      const logs = [];

      ui.pos.cart.forEach(it => {
        totalHpp += (Number(it.hppUnit) || 0) * it.qty;
        if (it.type === 'barang') {
          const p = state.products.find(x => x.id === it.refId);
          if (p) {
            const bef = Number(p.stok) || 0, aft = Number((bef - it.qty).toFixed(4));
            p.stok = aft;
            state.stockMovements.unshift({ id: uid('mov'), date: now, type: 'out', source: 'penjualan_barang', productId: p.id, productName: p.nama, qty: it.qty, stockBefore: bef, stockAfter: aft, unitCost: Number(p.hargaBeliSatuan) || 0, totalCost: (Number(p.hargaBeliSatuan) || 0) * it.qty, refNo: inv, notes: `Penjualan ${inv}` });
            logs.push(`${p.nama} (-${it.qty})`);
          }
        }
      });

      const sale = {
        id: uid('sale'), invoiceNo: inv, date: now,
        customerName: ui.pos.customer.trim() || 'Pelanggan Umum',
        notes: ui.pos.note.trim(),
        items: ui.pos.cart.map(i => ({ ...i, subtotal: i.harga * i.qty })),
        subtotal: c.subtotal, discountAmount: c.disc, total: c.total, totalHpp,
        paymentMethod: ui.pos.method, paidAmount, changeAmount
      };
      state.sales.unshift(sale);

      const jSaleId = uid('jrn');
      const jSale = { 
        id: jSaleId, 
        date: now, 
        type: 'Penjualan', 
        refNo: inv, 
        description: `Penjualan ${sale.customerName} (${sale.items.length} item)`, 
        direction: 'in', 
        amount: sale.total, 
        hpp: totalHpp, 
        paymentMethod: sale.paymentMethod, 
        meta: { saleId: sale.id } 
      };
      state.journal.unshift(jSale);

      Object.assign(ui.pos, { cart: [], customer: '', note: '', discVal: 0, paid: 0 });
      save();

      // Simpan ke Supabase PostgreSQL secara real-time
      const client = getSupabase();
      if (client) {
        (async () => {
          try {
            // 1. Simpan ke tabel sales
            const { error: errSale } = await client.from('sales').insert({
              id: sale.id,
              invoice_no: sale.invoiceNo,
              date: sale.date,
              customer_name: sale.customerName,
              notes: sale.notes,
              subtotal: sale.subtotal,
              discount_amount: sale.discountAmount,
              total: sale.total,
              total_hpp: sale.totalHpp,
              payment_method: sale.paymentMethod,
              paid_amount: sale.paidAmount,
              change_amount: sale.changeAmount,
              items: sale.items
            });
            if (errSale) console.error('Supabase sales insert error:', errSale);

            // 2. Simpan ke tabel sales_items
            const itemRows = sale.items.map(it => ({
              sale_id: sale.id,
              invoice_no: sale.invoiceNo,
              ref_id: it.refId || '',
              nama: it.nama,
              type: it.type,
              qty: it.qty,
              harga: it.harga,
              hpp_unit: it.hppUnit || 0,
              subtotal: it.subtotal
            }));
            if (itemRows.length) await client.from('sales_items').insert(itemRows);

            // 3. Simpan ke tabel journal (Jurnal Keuangan) dengan direction 'in'
            const { error: errJrn } = await client.from('journal').insert({
              id: jSale.id,
              date: jSale.date,
              type: jSale.type,
              ref_no: jSale.refNo,
              description: jSale.description,
              direction: 'in',
              amount: jSale.amount,
              hpp: jSale.hpp,
              payment_method: jSale.paymentMethod,
              meta: jSale.meta
            });
            if (errJrn) console.error('Supabase journal insert error:', errJrn);

            // 4. Update stok barang di Supabase
            for (const it of sale.items) {
              if (it.type === 'barang' && it.refId) {
                const prod = state.products.find(p => p.id === it.refId);
                if (prod) {
                  await client.from('products').update({ stok: prod.stok }).eq('id', prod.id);
                }
              }
            }
          } catch (eDb) {
            console.error('Supabase write error:', eDb);
          }
        })();
      }

      toast(`Transaksi ${inv} berhasil dicatat!`);
      render();
      openReceiptModal(sale.id);
    }

    // -------------------------------------------------------------------------
    // 8. NOTA STRUK THERMAL RESMI (JPG & PDF + CETAK STRUK)
    // -------------------------------------------------------------------------
    async function drawReceiptCanvas(sale) {
      if (document.fonts?.ready) { try { await document.fonts.ready; } catch {} }

      const W = 722;
      const px = 82;
      const contentW = W - px * 2; // 558

      const settings = state.settings || {};
      const shopName = String(settings.shopName || 'Stationary and Advertising Kobra Hitam').trim();
      const address = String(settings.address || 'Jemurwonosari, Gg. Sekolahan, No. 123').trim();
      const phone = String(settings.phone || '082228728720').trim();
      const footerNote = String(settings.footerNote || 'Terima kasih atas kepercayaan Anda. Simpan\nstruk ini sebagai bukti pembayaran resmi.').trim();

      // Helper pemecah teks per baris dan pembungkus kata
      const wrapText = (txt, mw, font, ctxTemp) => {
        ctxTemp.font = font;
        const rawLines = String(txt || '').split('\n');
        const res = [];
        for (const raw of rawLines) {
          const words = raw.trim().split(/\s+/);
          let line = '';
          for (const w of words) {
            if (!w) continue;
            const test = line ? `${line} ${w}` : w;
            if (ctxTemp.measureText(test).width > mw && line) {
              res.push(line);
              line = w;
            } else {
              line = test;
            }
          }
          if (line) res.push(line);
        }
        return res;
      };

      // Buat dummy canvas untuk menghitung tinggi konten secara presisi
      const dcv = document.createElement('canvas');
      dcv.width = W; dcv.height = 100;
      const dctx = dcv.getContext('2d');

      const addrLines = wrapText(address, contentW, '500 17px "JetBrains Mono", monospace', dctx);
      const items = sale.items || [];
      const footLines = wrapText(footerNote, contentW, '500 15px "JetBrains Mono", monospace', dctx);

      // Hitung estimasi tinggi yang diperlukan
      let estY = 104; // header baseline
      estY += addrLines.length * 35;
      if (phone) estY += 33;
      estY += 34; // dash 1
      estY += 35 + 33 + 34; // meta (No, Tgl, Plg)
      estY += 34; // dash 2
      for (const it of items) {
        estY += 36; // nama item
        estY += 34; // qty x harga & subtotal
      }
      estY += 34; // dash 3
      estY += 35; // subtotal
      if (sale.discountAmount > 0) estY += 32; // diskon
      estY += 34; // dash 4
      estY += 38; // TOTAL
      estY += 36 + 34; // Bayar & Kembali
      estY += 37; // dash 5
      estY += footLines.length * 30; // footer
      estY += 80; // ruang bawah

      // Sesuai contoh struk: minimal 1024px atau menyesuaikan jika item banyak
      const H = Math.max(1024, estY);

      const cv = document.createElement('canvas');
      cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');

      // Latar belakang putih bersih thermal struk
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, W, H);

      const drawDash = (yPos) => {
        ctx.save();
        ctx.setLineDash([6, 4]);
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = '#000000';
        ctx.beginPath();
        ctx.moveTo(px, yPos);
        ctx.lineTo(W - px, yPos);
        ctx.stroke();
        ctx.restore();
      };

      ctx.fillStyle = '#000000';
      let y = 104;

      // Header Toko
      ctx.textAlign = 'center';
      ctx.font = '700 23px "JetBrains Mono", monospace';
      ctx.fillText(shopName, W / 2, y);

      // Alamat Toko
      ctx.font = '500 17px "JetBrains Mono", monospace';
      for (const al of addrLines) {
        y += 35;
        ctx.fillText(al, W / 2, y);
      }

      // Telepon / WA
      if (phone) {
        y += 33;
        ctx.fillText(phone, W / 2, y);
      }

      // Garis Pembatas 1
      y += 34;
      drawDash(y);

      // Metadata Transaksi
      y += 35;
      ctx.textAlign = 'left';
      ctx.font = '500 17px "JetBrains Mono", monospace';
      ctx.fillText(`No: ${sale.invoiceNo}`, px, y);
      y += 33;
      ctx.fillText(`Tgl: ${fmtDT(sale.date)}`, px, y);
      y += 34;
      ctx.fillText(`Plg: ${sale.customerName || 'Pelanggan Umum'} (${sale.paymentMethod || 'Tunai'})`, px, y);

      // Garis Pembatas 2
      y += 34;
      drawDash(y);

      // Daftar Item Belanja / Jasa
      for (const it of items) {
        y += 36;
        ctx.textAlign = 'left';
        ctx.font = '700 18px "JetBrains Mono", monospace';
        let nm = String(it.nama || '');
        if (ctx.measureText(nm).width > contentW) {
          while (ctx.measureText(nm + '…').width > contentW && nm.length > 3) {
            nm = nm.slice(0, -1);
          }
          nm += '…';
        }
        ctx.fillText(nm, px, y);

        y += 34;
        ctx.font = '500 17px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`${it.qty} x ${rp(it.harga)}`, px, y);
        ctx.textAlign = 'right';
        ctx.fillText(rp(it.subtotal), W - px, y);
      }

      // Garis Pembatas 3
      y += 34;
      drawDash(y);

      // Subtotal & Diskon
      y += 35;
      ctx.textAlign = 'left';
      ctx.font = '500 17px "JetBrains Mono", monospace';
      ctx.fillText('Subtotal', px, y);
      ctx.textAlign = 'right';
      ctx.fillText(rp(sale.subtotal), W - px, y);

      if (sale.discountAmount > 0) {
        y += 32;
        ctx.textAlign = 'left';
        ctx.fillText('Diskon', px, y);
        ctx.textAlign = 'right';
        ctx.fillText(`-${rp(sale.discountAmount)}`, W - px, y);
      }

      // Garis Pembatas 4
      y += 34;
      drawDash(y);

      // TOTAL
      y += 38;
      ctx.textAlign = 'left';
      ctx.font = '800 24px "JetBrains Mono", monospace';
      ctx.fillText('TOTAL', px, y);
      ctx.textAlign = 'right';
      ctx.fillText(rp(sale.total), W - px, y);

      // Pembayaran & Kembalian
      y += 36;
      ctx.textAlign = 'left';
      ctx.font = '500 17px "JetBrains Mono", monospace';
      ctx.fillText('Bayar', px, y);
      ctx.textAlign = 'right';
      ctx.fillText(rp(sale.paidAmount), W - px, y);

      y += 34;
      ctx.textAlign = 'left';
      ctx.fillText('Kembali', px, y);
      ctx.textAlign = 'right';
      ctx.fillText(rp(sale.changeAmount), W - px, y);

      // Garis Pembatas 5
      y += 37;
      drawDash(y);

      // Catatan Kaki Nota
      ctx.textAlign = 'center';
      ctx.font = '500 15px "JetBrains Mono", monospace';
      for (const fl of footLines) {
        y += 30;
        ctx.fillText(fl, W / 2, y);
      }

      return cv;
    }

        title: `Struk ${s.invoiceNo}`,
        sub: 'Struk Kasir Kobra Hitam',
        width: 'max-w-2xl',
        body: `
          <div class="flex flex-col sm:flex-row gap-5 items-start">
            <div class="w-full sm:w-72 shrink-0 mx-auto">
              <div id="rcpPreview" class="rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-white shadow-sm flex items-center justify-center p-2 min-h-[360px] max-h-[500px] overflow-y-auto no-scrollbar text-xs text-slate-400">Memuat struk...</div>
            </div>
            <div class="flex-1 w-full space-y-3">

                <div class="flex justify-between pt-1.5 border-t border-slate-200 dark:border-slate-800"><span class="font-bold">Total</span><span class="font-mono font-bold">${rp(s.total)}</span></div>

              <button onclick="dlReceiptJPG('${s.id}')" class="w-full py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs flex items-center justify-center gap-2 transition shadow-xs"><i data-lucide="image-down" class="w-4 h-4"></i> Unduh JPG (Struk)</button>
              <button onclick="dlReceiptPDF('${s.id}')" class="w-full py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-slate-800 text-white font-semibold text-xs flex items-center justify-center gap-2 hover:opacity-90 transition"><i data-lucide="file-down" class="w-4 h-4"></i> Unduh PDF (Struk)</button>

        wrap.appendChild(cv);
      }

    async function dlReceiptJPG(id) {
      const s = state.sales.find(x => x.id === id); if (!s) return;
      const cv = await drawReceiptCanvas(s);
      const a = document.createElement('a');
      a.download = `Struk_${s.invoiceNo}.jpg`;
      a.href = cv.toDataURL('image/jpeg', 0.96);
      a.click();
      toast('Struk JPG berhasil diunduh.');
    }

    async function dlReceiptPDF(id) {
      const s = state.sales.find(x => x.id === id); if (!s) return;
      if (!window.jspdf?.jsPDF) return toast('Library PDF belum termuat.', 'error');
      const cv = await drawReceiptCanvas(s);
      const doc = new window.jspdf.jsPDF({
        orientation: 'portrait',
        unit: 'px',
        format: [cv.width, cv.height],
        hotfixes: ['px_scaling']
      });
      doc.addImage(cv.toDataURL('image/jpeg', 0.96), 'JPEG', 0, 0, cv.width, cv.height);
      doc.save(`Struk_${s.invoiceNo}.pdf`);
      toast('Struk PDF berhasil diunduh.');
    }

        title: p ? 'Edit Barang' : 'Tambah Barang', width: 'max-w-lg',
        body: `
          <form id="fProd" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div class="sm:col-span-2"><label class="block font-semibold mb-1">Nama Barang *</label><input name="nama" required value="${esc(p?.nama || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
            <div><label class="block font-semibold mb-1">Tanggal Pembelian</label><input name="tanggalPembelian" value="${esc(p?.tanggalPembelian || todayISO())}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>

            <div><label class="block font-semibold mb-1">Harga Beli</label><input name="hargaBeli" type="number" step="any" value="${p?.hargaBeli ?? 0}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div>
            <div><label class="block font-semibold mb-1">Harga Beli Satuan</label><input name="hargaBeliSatuan" type="number" step="any" value="${p?.hargaBeliSatuan ?? 0}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div>
            <div class="sm:col-span-2"><label class="block font-semibold mb-1">Harga Jual</label><input name="hargaJual" type="number" step="any" value="${p?.hargaJual ?? 0}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>

        foot: `<button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-slate-200 dark:border-slate-700">Batal</button><button onclick="saveProd('${id}')" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950">Simpan</button>`
      });
    }

    function saveProd(id) {
      const fd = new FormData(document.getElementById('fProd'));
      const nama = String(fd.get('nama') || '').trim();
      if (!nama) return toast('Nama barang wajib diisi.', 'warning');
      const d = { nama, tanggalPembelian: String(fd.get('tanggalPembelian') || '').trim(), kategoriId: fd.get('kategoriId'), deskripsi: String(fd.get('deskripsi') || '').trim(), stok: parseFloat(fd.get('stok')) || 0, isiKemasan: String(fd.get('isiKemasan') || '').trim(), hargaBeli: parseFloat(fd.get('hargaBeli')) || 0, hargaBeliSatuan: parseFloat(fd.get('hargaBeliSatuan')) || 0, hargaJual: parseFloat(fd.get('hargaJual')) || 0, aktif: true };
      if (id) {
        const i = state.products.findIndex(x => x.id === id);
        if (i >= 0) {
          const old = Number(state.products[i].stok) || 0;
          state.products[i] = { ...state.products[i], ...d };
          if (old !== d.stok) addJournal({ type: 'Penyesuaian Stok', refNo: 'EDIT', description: `Penyesuaian ${d.nama}: ${old} → ${d.stok}`, amount: Math.abs(d.stok - old) * d.hargaBeliSatuan });
        }
      } else state.products.unshift({ id: uid('prd'), ...d });
      save(); closeModal(); toast('Data barang disimpan.'); render();
    }

    function delProd(id) {
      const p = state.products.find(x => x.id === id); if (!p) return;
      confirmDialog('Hapus Barang?', `Hapus "${p.nama}" dari inventaris?`, () => { state.products = state.products.filter(x => x.id !== id); save(); toast('Barang dihapus.', 'info'); render(); }, 'Hapus');
    }

    function exportExcel() {
      if (!state.products.length || typeof XLSX === 'undefined') return toast('Tidak ada data untuk diekspor.', 'warning');
      const ws = XLSX.utils.json_to_sheet(state.products.map(p => ({ 'Nama barang': p.nama, 'Tanggal pembelian': p.tanggalPembelian, 'Deskripsi': p.deskripsi, 'Stok': p.stok, 'Isi kemasan': p.isiKemasan, 'Harga beli': p.hargaBeli, 'Harga beli satuan': p.hargaBeliSatuan, 'Harga jual': p.hargaJual })));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inventaris');
      XLSX.writeFile(wb, `Inventaris_Kobra_Hitam_${todayISO()}.xlsx`);
      toast('Excel inventaris diekspor.');
    }

    function submitOut(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const p = state.products.find(x => x.id === fd.get('pid'));
      const q = parseFloat(fd.get('qty')), mode = fd.get('mode');
      if (!p || isNaN(q) || q < 0) return toast('Input tidak valid.', 'warning');
      const bef = Number(p.stok) || 0, uc = Number(p.hargaBeliSatuan) || 0;
      const iso = new Date(`${fd.get('date') || todayISO()}T${new Date().toTimeString().slice(0, 8)}`).toISOString();
      const notes = String(fd.get('notes') || '').trim();
      if (mode === 'penyesuaian') {
        const diff = Number((q - bef).toFixed(4)); p.stok = q;
        const ref = `ADJ-${Date.now().toString().slice(-5)}`;
        state.stockMovements.unshift({ id: uid('mov'), date: iso, type: 'adjustment', source: 'penyesuaian', productId: p.id, productName: p.nama, qty: diff, stockBefore: bef, stockAfter: q, unitCost: uc, totalCost: Math.abs(diff) * uc, refNo: ref, notes: notes || `${bef} → ${q}` });
        addJournal({ type: 'Penyesuaian Stok', refNo: ref, description: `${p.nama}: ${bef} → ${q}`, amount: Math.abs(diff) * uc, date: iso });
        toast(`Stok ${p.nama} disesuaikan ke ${q}.`);
      } else {
        if (q <= 0) return toast('Jumlah keluar harus > 0.', 'warning');
        const aft = Number((bef - q).toFixed(4)); p.stok = aft;
        const ref = `OUT-${Date.now().toString().slice(-5)}`;
        state.stockMovements.unshift({ id: uid('mov'), date: iso, type: 'out', source: 'manual', productId: p.id, productName: p.nama, qty: q, stockBefore: bef, stockAfter: aft, unitCost: uc, totalCost: q * uc, refNo: ref, notes: notes || 'Keluar manual' });
        addJournal({ type: 'Stok Keluar', refNo: ref, description: `${p.nama} (-${q}) ${notes}`, amount: q * uc, date: iso });
        toast(`Stok ${p.nama} -${q}.`);
      }
      save(); render();
    }

        s.customPrice = true;
        save();

    function updateProdPriceLive(id, val) {
      const p = parseFloat(val) || 0;

      if (prod) {
        prod.hargaJual = p;
        prod.customPrice = true;
        save();
        const marginEl = document.getElementById('margin_' + id);
        if (marginEl) {
          marginEl.textContent = rp(p - (Number(prod.hargaBeliSatuan) || 0));
        }
      }
    }

    async function deleteSaleRecord(saleId, restoreStock = true) {
      const sale = state.sales.find(s => s.id === saleId);
      if (!sale) return toast('Transaksi penjualan tidak ditemukan.', 'error');

      // 1. Kembalikan stok barang jika ada
      if (restoreStock && Array.isArray(sale.items)) {
        sale.items.forEach(it => {
          if (it.type === 'barang' && it.refId) {
            const p = state.products.find(x => x.id === it.refId);
            if (p) p.stok = Number(((Number(p.stok) || 0) + it.qty).toFixed(4));
          }
        });
      }

      // 2. Hapus dari state.sales lokal
      const sIdx = state.sales.findIndex(s => s.id === saleId);
      if (sIdx !== -1) state.sales.splice(sIdx, 1);

      // 3. Hapus SEMUA catatan jurnal terkait penjualan ini (berdasarkan invoiceNo atau saleId)
      state.journal = state.journal.filter(j => j.refNo !== sale.invoiceNo && j.meta?.saleId !== saleId);

      // 4. Hapus mutasi stok terkait
      state.stockMovements = state.stockMovements.filter(m => m.refNo !== sale.invoiceNo);

      save();

      // 5. Sinkronisasi hapus bersih ke Supabase (sales, sales_items, journal, dan update stok)
      const client = getSupabase();
      if (client) {
        try {
          await client.from('sales').delete().eq('id', saleId);
          await client.from('sales_items').delete().eq('sale_id', saleId);
          if (sale.invoiceNo) {
            await client.from('journal').delete().eq('ref_no', sale.invoiceNo);
          }
          if (restoreStock && Array.isArray(sale.items)) {
            for (const it of sale.items) {
              if (it.type === 'barang' && it.refId) {
                const prod = state.products.find(p => p.id === it.refId);
                if (prod) {
                  await client.from('products').update({ stok: prod.stok }).eq('id', prod.id);
                }
              }
            }
          }
        } catch (errDb) {
          console.error('Supabase delete sale error:', errDb);
        }
      }

      toast(`Transaksi ${sale.invoiceNo} & catatan jurnal berhasil dihapus bersih.`);
      render();
    }

    function deleteJournalEntry(id) {
      const j = state.journal.find(x => x.id === id);
      if (!j) return toast('Catatan jurnal tidak ditemukan.', 'error');

      // Cek apakah catatan jurnal ini terhubung dengan transaksi Penjualan (Sales)
      const linkedSale = state.sales.find(s => s.id === j.meta?.saleId || s.invoiceNo === j.refNo);

      if (linkedSale) {
        confirmDialog(
          'Hapus Penjualan & Jurnal Terkait?',
          `Catatan jurnal ini terhubung dengan Penjualan ${linkedSale.invoiceNo} (${linkedSale.customerName} - ${rp(linkedSale.total)}). Menghapus jurnal ini akan sekaligus menghapus transaksi penjualan di database (sales & journal) dan mengembalikan stok barang. Lanjutkan?`,
          () => {
            deleteSaleRecord(linkedSale.id, true);
          },
          'Ya, Hapus Penjualan & Jurnal',
          true
        );
        return;
      }

      // Jika jurnal non-penjualan biasa (misal Pengeluaran / Kas Masuk Manual)
      confirmDialog(
        'Hapus Catatan Jurnal?',
        `Apakah Anda yakin ingin menghapus catatan jurnal "${j.description}" (${rp(j.amount)})?`,
        () => {
          const idx = state.journal.findIndex(x => x.id === id);

            state.journal.splice(idx, 1);

            if (client) {

            }
            toast('Catatan jurnal berhasil dihapus.');
            render();

        },
        'Ya, Hapus Jurnal',
        true

    }

    function clearAllJournal() {

    function saveExp() {
      const fd = new FormData(document.getElementById('fExp'));
      const desc = String(fd.get('desc') || '').trim(), amt = parseFloat(fd.get('amt')) || 0;
      if (!desc || amt <= 0) return toast('Isi keterangan & nominal valid.', 'warning');
      const iso = new Date(`${fd.get('date') || todayISO()}T${new Date().toTimeString().slice(0, 8)}`).toISOString();
      const jrnExp = { type: 'Pengeluaran', refNo: `EXP-${Date.now().toString().slice(-5)}`, description: desc, amount: amt, direction: 'out', paymentMethod: fd.get('met'), date: iso };
      addJournal(jrnExp);
      save();
      const client = getSupabase();
      if (client) {
        client.from('journal').insert({
          id: uid('jrn'),
          date: iso,
          type: 'Pengeluaran',
          ref_no: jrnExp.refNo,
          description: desc,
          direction: 'out',
          amount: amt,
          hpp: 0,
          payment_method: fd.get('met')
        }).catch(e => console.error('Supabase exp error:', e));
      }
      closeModal(); toast('Pengeluaran tercatat di jurnal.'); render();
    }

        true
      );
    }

    function clearPeriodSales(label, startIso, endIso) {
      const start = new Date(startIso), end = new Date(endIso);
      const hit = iso => { const d = new Date(iso); return d >= start && d <= end; };
      const salesInPeriod = state.sales.filter(s => hit(s.date));
      if (!salesInPeriod.length) return toast('Tidak ada transaksi penjualan pada periode ini.', 'info');

      confirmDialog(
        `Hapus ${salesInPeriod.length} Penjualan (${label})?`,
        `Semua ${salesInPeriod.length} transaksi penjualan pada periode ${label} akan dihapus beserta jurnalnya dan stok dikembalikan. Tindakan ini tidak dapat dibatalkan.`,
        () => {
          const invNos = new Set(salesInPeriod.map(s => s.invoiceNo));
          const saleIds = new Set(salesInPeriod.map(s => s.id));

          // Kembalikan stok
          salesInPeriod.forEach(sale => {
            (sale.items || []).forEach(it => {
              if (it.type === 'barang' && it.refId) {
                const p = state.products.find(x => x.id === it.refId);
                if (p) p.stok = Number(((Number(p.stok) || 0) + it.qty).toFixed(4));
              }
            });
          });

          // Hapus dari state
          state.sales = state.sales.filter(s => !saleIds.has(s.id));
          state.journal = state.journal.filter(j => !invNos.has(j.refNo) && !saleIds.has(j.meta?.saleId));
          state.stockMovements = state.stockMovements.filter(m => !invNos.has(m.refNo));

          const client = getSupabase();
          if (client) {
            saleIds.forEach(sId => client.from('sales').delete().eq('id', sId).then(null, e => console.error(e)));
            invNos.forEach(inv => client.from('journal').delete().eq('ref_no', inv).then(null, e => console.error(e)));
          }

          save();
          toast(`Berhasil menghapus ${salesInPeriod.length} transaksi pada periode ${label}.`);
          render();
        },
        'Ya, Hapus Semua di Periode Ini',
        true
      );
    }
