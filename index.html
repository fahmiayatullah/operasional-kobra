    // 2. MESIN SINKRONISASI GOOGLE SPREADSHEET LIVE (HARGA DASAR, JASA, BELANJA)
    // -------------------------------------------------------------------------
    function extractSheetId(url) {
      if (!url) return DEFAULT_SHEET_ID;
      const m = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
      return m ? m[1] : DEFAULT_SHEET_ID;
    }

    function fetchGvizJsonp(sheetId, sheetName) {
      return new Promise((resolve, reject) => {
        const cbName = 'gviz_cb_' + Math.random().toString(36).substring(2, 9);
        const script = document.createElement('script');
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('Koneksi ke Google Sheets timeout (15 detik).'));
        }, 15000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function(response) {
          cleanup();
          if (response && response.status === 'ok' && response.table) {
            resolve(response.table);
          } else {
            reject(new Error(response?.errors?.[0]?.message || 'Gagal memproses spreadsheet'));
          }
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('Tidak dapat terhubung ke Google Sheets'));
        };

        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${cbName}`;
        script.src = url;
        document.head.appendChild(script);
      });
    }

    let isSyncingSheets = false;

    async function syncAllFromSheets(silent = false) {
      if (isSyncingSheets) return;
      isSyncingSheets = true;
      const sheetId = extractSheetId(state.settings.spreadsheetUrl);

      const dot = document.getElementById('syncDot');
      const label = document.getElementById('sheetsSyncLabel');
      const sideText = document.getElementById('sidebarSyncText');

      if (dot) dot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-ping';
      if (label) label.textContent = 'Menyinkronkan...';
      if (sideText) sideText.textContent = 'Menyinkronkan...';
      if (!silent) toast('Menghubungkan ke Google Spreadsheet Kobra Hitam...', 'info');

      try {
        // 1. Ambil Harga Dasar (83 Barang)
        const tableDasar = await fetchGvizJsonp(sheetId, 'Harga Dasar');
        const newProducts = [];
        tableDasar.rows.forEach(r => {
          const c = r.c || [];
          const cell = i => (c[i] ? (c[i].f !== undefined && c[i].f !== null ? c[i].f : c[i].v) : '') || '';
          const no = String(cell(0)).trim();
          const tgl = String(cell(1)).trim();
          const nama = String(cell(2)).trim() || String(cell(3)).trim();
          const deskripsi = String(cell(3)).trim();
          const stok = parseIndoNum(cell(4));
          const isiKemasan = String(cell(5)).trim();
          const hargaBeli = parseIndoNum(cell(6));
          const hargaBeliSatuan = parseIndoNum(cell(7));
          const hargaJual = parseIndoNum(cell(8));
          const supplier = String(cell(12)).trim();

          if (nama && no && !isNaN(parseInt(no, 10))) {
            const noInt = parseInt(no, 10);
            const exist = state.products.find(p => p.nama.toLowerCase() === nama.toLowerCase() || p.no === noInt);
            // Jika harga diubah secara manual oleh pengguna di web, pertahankan harga manual tersebut!
            const finalHargaJual = (exist && exist.customPrice && exist.hargaJual > 0) ? exist.hargaJual : (hargaJual || exist?.hargaJual || 0);

            newProducts.push({
              id: exist?.id || `prd_${String(noInt).padStart(3, '0')}`,
              no: noInt,
              nama,
              tanggalPembelian: tgl || exist?.tanggalPembelian || '',
              deskripsi,
              stok: isFinite(stok) ? stok : (exist?.stok || 0),
              isiKemasan,
              hargaBeli,
              hargaBeliSatuan,
              hargaJual: finalHargaJual,
              customPrice: !!(exist && exist.customPrice),
              kategoriId: guessCat(nama, deskripsi),
              supplier,
              aktif: true
            });
          }
        });

        if (newProducts.length > 0) {
          state.products = newProducts;
        }

        // 2. Ambil Harga Jasa & HPP dari Spreadsheet
        try {
          const tableJasa = await fetchGvizJsonp(sheetId, 'Harga Jasa');
          syncJasaFromSheet(tableJasa);
        } catch (eJasa) {
          console.warn('Gagal memuat tab Harga Jasa:', eJasa);
        }

        // 3. Ambil Belanja (Pengadaan Bahan)
        try {
          const tableBelanja = await fetchGvizJsonp(sheetId, 'Belanja');
          const newBelanja = [];
          tableBelanja.rows.slice(1).forEach((r, idx) => {
            const c = r.c || [];
            const cell = i => (c[i] ? (c[i].f !== undefined && c[i].f !== null ? c[i].f : c[i].v) : '') || '';
            const ket = String(cell(4)).trim();
            const qty = parseIndoNum(cell(5));
            const nominal = parseIndoNum(cell(10));
            if (ket) {
              newBelanja.push({
                id: `blj_${idx + 1}`,
                nama: ket,
                qty: qty || 1,
                nominal: nominal || 0,
                biayaSatuan: qty > 0 ? Math.round(nominal / qty) : nominal
              });
            }
          });
          if (newBelanja.length > 0) state.belanja = newBelanja;
        } catch (eBelanja) {
          console.warn('Gagal memuat tab Belanja:', eBelanja);
        }

        // 4. Kalibrasi Resep Jasa
        autoLinkRecipes();

        state.settings.lastSync = new Date().toISOString();
        save();
        updateBadges();
        renderNav();
        render();

        if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';

        if (label) label.textContent = 'Mode Offline (Lokal)';

        if (!silent) {
          toast('Gagal terhubung ke Google Sheets: ' + err.message + '. Menggunakan data lokal.', 'warning');
        }
      } finally {
        isSyncingSheets = false;
      }
    }

    function syncJasaFromSheet(tableJasa) {
      if (!tableJasa || !tableJasa.rows) return;
      const servicesMap = {
        svc_fotokopi: { items: [], listrik: 2, jasa: 163 },
        svc_print_bw: { items: [], listrik: 21, jasa: 189 },
        svc_print_warna: { items: [], listrik: 42, jasa: 228 },
        svc_jilid: { items: [], listrik: 0, jasa: 0 },
        svc_lam_f4: { items: [], listrik: 320, jasa: 1000 },
        svc_lam_a4: { items: [], listrik: 320, jasa: 1000 }
      };

      let currentSvc = 'svc_fotokopi';
      tableJasa.rows.forEach((r, idx) => {
        const c = r.c || [];
        const cell = i => (c[i] ? (c[i].f !== undefined && c[i].f !== null ? c[i].f : c[i].v) : '') || '';
        const col0 = String(cell(0)).trim().toLowerCase();
        const col1 = String(cell(1)).trim();
        const col6 = parseIndoNum(cell(6));

        if (col0.includes('print warna')) currentSvc = 'svc_print_warna';
        else if (col0.includes('print')) currentSvc = 'svc_print_bw';
        else if (col0.includes('jilid')) currentSvc = 'svc_jilid';
        else if (col0.includes('laminating')) currentSvc = idx < 28 ? 'svc_lam_f4' : 'svc_lam_a4';
        else if (col0.includes('foto copy') || col0.includes('fotokopi')) currentSvc = 'svc_fotokopi';

        if (col1 && !col1.toLowerCase().includes('total')) {
          const lCol1 = col1.toLowerCase();
          if (lCol1.includes('listrik')) {
            servicesMap[currentSvc].listrik = col6 || servicesMap[currentSvc].listrik;
          } else if (lCol1.includes('jasa')) {
            servicesMap[currentSvc].jasa = col6 || servicesMap[currentSvc].jasa;
          } else {
            servicesMap[currentSvc].items.push({ id: uid('b'), nama: col1, biaya: col6 });
          }
        }
      });

      // Update state.services without overriding custom user selling price
      state.services.forEach(s => {
        const parsed = servicesMap[s.id];
        if (parsed && parsed.items.length) {
          s.bahanItems = parsed.items;
          s.listrik = parsed.listrik;
          s.jasa = parsed.jasa;
        }
      });
    }

    const rp = n => { const v = Number(n) || 0; return (v < 0 ? '-' : '') + 'Rp' + Math.round(Math.abs(v)).toLocaleString('id-ID'); };
    const num = (n, d = 2) => (Number(n) || 0).toLocaleString('id-ID', { maximumFractionDigits: d });

      const bahan = (s.bahanItems || []).reduce((a, b) => a + (Number(b.biaya) || 0), 0);

    // -------------------------------------------------------------------------
    // 4. IMPOR EXCEL INVENTARIS (8 KOLOM ASLI TANPA MENGUBAH DATA)
    // -------------------------------------------------------------------------
    function parseIndoNum(v) {
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      let s = String(v ?? '').trim().replace(/Rp\.?/gi, '').replace(/\s+/g, '');
      if (!s) return 0;
      if (s.includes('.') && s.includes(',')) {
        s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
      } else if (s.includes('.')) {
        const parts = s.split('.');
        if (parts.length > 1 && parts[parts.length - 1].length === 3) s = s.replace(/\./g, '');
      } else if (s.includes(',')) {
        const parts = s.split(',');
        s = parts.length > 1 && parts[parts.length - 1].length === 3 ? s.replace(/,/g, '') : s.replace(',', '.');
      }
      const n = parseFloat(s.replace(/[^0-9.\-]/g, ''));
      return isFinite(n) ? n : 0;
    }

    function parseExcelDate(raw, fmt) {
      if (fmt && String(fmt).trim() && isNaN(Number(fmt))) return String(fmt).trim();
      if (typeof raw === 'number' && raw > 20000 && raw < 70000) {
        const d = new Date(Math.floor(raw - 25569) * 86400 * 1000);
        if (!isNaN(d)) {
          const p = n => String(n).padStart(2, '0');
          return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}`;
        }
      }
      return String(fmt ?? raw ?? '').trim();
    }

    function guessCat(nama, desk = '') {
      const t = `${nama} ${desk}`.toLowerCase();
      if (/hvs|kertas|a4|f4|art\s?paper|glossy|foto|stiker|sticker|folio|concorde/.test(t)) return 'cat_kertas';
      if (/tinta|toner|cartridge|cyan|magenta|yellow|black|epson|canon|brother/.test(t)) return 'cat_tinta';
      if (/jilid|buffalo|mika|lakban|spiral|staples|steples|cover|ring/.test(t)) return 'cat_jilid';
      if (/laminat|pouch|plastik/.test(t)) return 'cat_lam';
      if (/pulpen|pena|pensil|spidol|map|amplop|lem|gunting|cutter|buku/.test(t)) return 'cat_atk';
      return 'cat_lain';
    }

    function detectCols(row) {
      const hs = row.map(h => String(h || '').toLowerCase().trim());
      const find = (pats, ex = []) => hs.findIndex(h => h && !ex.some(e => e.test(h)) && pats.some(p => p.test(h)));
      return {
        nama: find([/nama\s*barang/, /^nama$/, /barang/, /produk/, /item/]),
        tanggalPembelian: find([/tanggal\s*pembelian/, /tgl\s*beli/, /tanggal/, /tgl/]),
        deskripsi: find([/deskripsi/, /keterangan/, /detail/, /spek/]),
        stok: find([/^stok$/, /stock/, /stok/]),
        isiKemasan: find([/isi\s*kemasan/, /kemasan/, /^isi$/, /pack/]),
        hargaBeliSatuan: find([/harga\s*beli\s*satuan/, /beli\s*satuan/, /harga\s*satuan/, /satuan/]),
        hargaBeli: find([/harga\s*beli/, /beli/, /modal/], [/satuan/]),
        hargaJual: find([/harga\s*jual/, /jual/])
      };
    }

    function readExcel(file) {
      if (typeof XLSX === 'undefined') return toast('Library Excel belum termuat.', 'error');
      const r = new FileReader();
      r.onload = e => {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const sh = wb.Sheets[wb.SheetNames[0]];
          const raw = XLSX.utils.sheet_to_json(sh, { header: 1, raw: true, defval: '' });
          const fmt = XLSX.utils.sheet_to_json(sh, { header: 1, raw: false, defval: '' });
          prepareExcel(raw, fmt, file.name);
        } catch (err) { toast('Gagal membaca file: ' + err.message, 'error'); }
      };
      r.readAsArrayBuffer(file);
    }

    function readPastedExcel() {
      const txt = (document.getElementById('pasteTable')?.value || '').trim();

      prepareExcel(rows, rows, 'Clipboard Excel');
    }

    function prepareExcel(raw, fmt, name) {
      if (!raw || raw.length < 2) return toast('Baris data tidak mencukupi.', 'error');
      let hIdx = 0, best = -1;
      for (let i = 0; i < Math.min(10, raw.length); i++) {
        const sc = Object.values(detectCols(raw[i])).filter(v => v >= 0).length;
        if (sc > best) { best = sc; hIdx = i; }
      }
      ui.excelPending = { name, hIdx, headers: raw[hIdx], raw, fmt, map: detectCols(raw[hIdx]), mode: 'replace' };
      renderExcelPreview();
    }

    function extractExcelItems() {
      const { hIdx, raw, fmt, map } = ui.excelPending;
      const out = [];
      for (let i = hIdx + 1; i < raw.length; i++) {
        const r = raw[i] || [], f = fmt[i] || r;
        if (!r.some(c => String(c ?? '').trim() !== '')) continue;
        const gR = k => (map[k] >= 0 ? r[map[k]] : '');
        const gF = k => (map[k] >= 0 ? (f[map[k]] ?? r[map[k]]) : '');
        const nama = String(gF('nama') || gR('nama') || '').trim();
        if (!nama || /^total$/i.test(nama)) continue;
        const deskripsi = String(gF('deskripsi') ?? '').trim();
        out.push({
          id: uid('prd'),
          nama,
          tanggalPembelian: parseExcelDate(gR('tanggalPembelian'), gF('tanggalPembelian')),
          deskripsi,
          stok: parseIndoNum(gR('stok')),
          isiKemasan: String(gF('isiKemasan') ?? gR('isiKemasan') ?? '').trim(),
          hargaBeli: parseIndoNum(gR('hargaBeli')),
          hargaBeliSatuan: parseIndoNum(gR('hargaBeliSatuan')),
          hargaJual: parseIndoNum(gR('hargaJual')),
          kategoriId: guessCat(nama, deskripsi),
          aktif: true
        });
      }
      return out;
    }

      if (!ui.excelPending) return;

      autoLinkRecipes();
      save();
      closeModal();
      toast(`Berhasil memuat ${items.length} barang asli dari Excel!`);
      render();

    function autoLinkRecipes() {
      if (!state.products.length) return;
      state.services.forEach(s => (s.resep || []).forEach(r => {
        if (r.productId && state.products.some(p => p.id === r.productId)) return;
        const kws = (r.keyword || r.label || '').toLowerCase().split(/\s+/).filter(Boolean);
        const m = state.products.find(p => kws.every(k => `${p.nama} ${p.deskripsi}`.toLowerCase().includes(k)))
          || state.products.find(p => kws.some(k => k.length > 2 && `${p.nama} ${p.deskripsi}`.toLowerCase().includes(k)));
        if (m) r.productId = m.id;
      }));
    }

    // -------------------------------------------------------------------------
    // 5. JURNAL OTOMATIS & PERHITUNGAN LAPORAN KEUANGAN
    // -------------------------------------------------------------------------
    function addJournal({ type, refNo = '-', description, amount = 0, hpp = 0, direction = 'neutral', paymentMethod = '-', date = new Date().toISOString(), meta = {} }) {
      state.journal.unshift({ id: uid('jrn'), date, type, refNo, description, amount: Number(amount) || 0, hpp: Number(hpp) || 0, direction, paymentMethod, meta });
    }

    function periodRange(period, dateStr, monthStr) {
      if (period === 'harian') {
        return { start: new Date(`${dateStr}T00:00:00`), end: new Date(`${dateStr}T23:59:59.999`), label: fmtD(dateStr) };
      }
      if (period === 'mingguan') {
        const ref = new Date(`${dateStr}T12:00:00`);
        const diff = ref.getDay() === 0 ? -6 : 1 - ref.getDay();
        const start = new Date(ref); start.setDate(ref.getDate() + diff); start.setHours(0, 0, 0, 0);
        const end = new Date(start); end.setDate(start.getDate() + 6); end.setHours(23, 59, 59, 999);
        return { start, end, label: `${fmtD(start.toISOString())} – ${fmtD(end.toISOString())}` };
      }
      const [y, m] = (monthStr || todayISO().slice(0, 7)).split('-').map(Number);
      const start = new Date(y, m - 1, 1, 0, 0, 0, 0);
      const end = new Date(y, m, 0, 23, 59, 59, 999);
      return { start, end, label: start.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }) };
    }

    function calcReport(start, end) {
      const hit = iso => { const d = new Date(iso); return d >= start && d <= end; };
      const sales = state.sales.filter(s => hit(s.date));
      const jrns = state.journal.filter(j => hit(j.date));
      const omzet = sales.reduce((a, s) => a + (Number(s.total) || 0), 0);
      const hpp = sales.reduce((a, s) => a + (Number(s.totalHpp) || 0), 0);
      const labaKotor = omzet - hpp;
      const pengeluaran = jrns.filter(j => j.type === 'Pengeluaran').reduce((a, j) => a + (Number(j.amount) || 0), 0);
      const pembelian = jrns.filter(j => j.type === 'Pembelian').reduce((a, j) => a + (Number(j.amount) || 0), 0);
      const labaBersih = labaKotor - pengeluaran;
      return { omzet, hpp, labaKotor, pengeluaran, pembelian, labaBersih, persediaan: totalInventoryValue(), trxCount: sales.length, sales, jrns };
    }

                <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-100 dark:border-slate-800 space-y-2">
                  <div class="flex items-start justify-between gap-2 text-xs">

                    </div>
                    <button onclick="ui.pos.cart.splice(${idx},1); render()" class="text-slate-400 hover:text-rose-500"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                  </div>
                  <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-1">
                      <button onclick="setCartQty(${idx},${it.qty - 1})" class="w-6 h-6 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold">-</button>
                      <input type="number" min="1" value="${it.qty}" onchange="setCartQty(${idx},this.value)" class="w-12 text-center py-0.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono text-xs" />
                      <button onclick="setCartQty(${idx},${it.qty + 1})" class="w-6 h-6 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold">+</button>
                    </div>
                    <input type="number" min="0" value="${it.harga}" onchange="ui.pos.cart[${idx}].harga=Math.max(0,parseFloat(this.value)||0); render()" class="w-24 text-right px-2 py-0.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-mono text-xs" title="Ubah harga satuan" />
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2.5 text-xs">
              <div class="flex justify-between"><span class="text-slate-400">Subtotal</span><span class="font-mono font-semibold">${rp(calc.subtotal)}</span></div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-slate-400">Diskon</span>
                <div class="flex items-center gap-1">
                  <select onchange="ui.pos.discType=this.value; render()" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
                    <option value="rp" ${ui.pos.discType === 'rp' ? 'selected' : ''}>Rp</option>
                    <option value="pct" ${ui.pos.discType === 'pct' ? 'selected' : ''}>%</option>
                  </select>
                  <input type="number" min="0" value="${ui.pos.discVal}" oninput="ui.pos.discVal=parseFloat(this.value)||0; refreshPosTotals()" class="w-24 text-right px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" />

              </div>

              <div class="p-3 rounded-xl bg-slate-900 dark:bg-amber-500/15 text-white dark:text-amber-300 flex items-center justify-between">

              <div class="grid grid-cols-4 gap-1.5">

              <div class="flex items-center justify-between gap-2">

                <input id="posPaid" type="number" min="0" value="${ui.pos.paid}" oninput="ui.pos.paid=parseFloat(this.value)||0; refreshPosTotals()" class="w-32 text-right px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" />
              </div>
              <div class="flex justify-end gap-1.5">
                <button onclick="quickPay(cartTotals().total)" class="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-medium hover:bg-amber-500 hover:text-slate-950">Pas</button>
                ${[20000, 50000, 100000].map(v => `<button onclick="quickPay(${v})" class="px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-[11px] font-mono hover:bg-amber-500 hover:text-slate-950">${v / 1000}rb</button>`).join('')}

              <div class="flex justify-between">

              <button onclick="checkout()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center justify-center gap-2 transition">

    }

    function cartTotals() {
      const subtotal = ui.pos.cart.reduce((s, i) => s + (Number(i.harga) || 0) * (Number(i.qty) || 0), 0);
      const disc = ui.pos.discType === 'pct'
        ? Math.round(subtotal * Math.min(100, Math.max(0, Number(ui.pos.discVal) || 0)) / 100)
        : Math.min(subtotal, Math.max(0, Number(ui.pos.discVal) || 0));
      const total = Math.max(0, subtotal - disc);
      const paid = Number(ui.pos.paid) || 0;
      return { subtotal, disc, total, paid, change: paid - total };
    }
    function refreshPosTotals() {
      const c = cartTotals();
      const t = document.getElementById('posTot'), ch = document.getElementById('posChg');
      if (t) t.textContent = rp(c.total);
      if (ch) { ch.textContent = rp(c.change); ch.className = `font-mono font-bold ${c.change >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}`; }
    }
    function quickPay(v) { ui.pos.paid = v; const el = document.getElementById('posPaid'); if (el) el.value = v; refreshPosTotals(); }
    function setCartQty(idx, v) { ui.pos.cart[idx].qty = Math.max(1, parseInt(v, 10) || 1); if (ui.pos.method !== 'Tunai') ui.pos.paid = cartTotals().total; render(); }

    function addCart(type, id) {
      const ex = ui.pos.cart.find(c => c.type === type && c.refId === id);
      if (ex) ex.qty += 1;
      else if (type === 'barang') {
        const p = state.products.find(x => x.id === id);
        if (!p) return;
        ui.pos.cart.push({ type, refId: id, nama: p.nama, satuan: p.isiKemasan || 'pcs', harga: Number(p.hargaJual) || 0, hppUnit: Number(p.hargaBeliSatuan) || 0, qty: 1 });
      } else {
        const s = state.services.find(x => x.id === id);
        if (!s) return;
        ui.pos.cart.push({ type, refId: id, nama: s.nama, satuan: s.satuan || 'unit', harga: Number(s.hargaJual) || 0, hppUnit: svcHpp(s).hpp, qty: 1 });
      }
      if (ui.pos.method !== 'Tunai') ui.pos.paid = cartTotals().total;
      render();
    }

    function checkout() {
      if (!ui.pos.cart.length) return toast('Keranjang masih kosong.', 'warning');
      const c = cartTotals();
      if (ui.pos.method === 'Tunai' && c.paid < c.total) return toast('Uang bayar kurang dari total tagihan.', 'error');

      const paidAmount = ui.pos.method === 'Tunai' ? c.paid : c.total;
      const changeAmount = Math.max(0, paidAmount - c.total);
      const now = new Date().toISOString();
      const inv = `${state.settings.invoicePrefix || 'KH'}-${todayISO().replace(/-/g, '').slice(2)}-${String(state.settings.invoiceCounter++).padStart(4, '0')}`;

      let totalHpp = 0;
      const logs = [];

      ui.pos.cart.forEach(it => {
        totalHpp += (Number(it.hppUnit) || 0) * it.qty;
        if (it.type === 'barang') {
          const p = state.products.find(x => x.id === it.refId);
          if (p) {
            const bef = Number(p.stok) || 0, aft = Number((bef - it.qty).toFixed(4));
            p.stok = aft;
            state.stockMovements.unshift({ id: uid('mov'), date: now, type: 'out', source: 'penjualan_barang', productId: p.id, productName: p.nama, qty: it.qty, stockBefore: bef, stockAfter: aft, unitCost: Number(p.hargaBeliSatuan) || 0, totalCost: (Number(p.hargaBeliSatuan) || 0) * it.qty, refNo: inv, notes: `Penjualan ${inv}` });
            logs.push(`${p.nama} (-${it.qty})`);
          }
        } else {
          const s = state.services.find(x => x.id === it.refId);
          (s?.resep || []).forEach(r => {
            if (!r.productId || !r.qtyPerUnit) return;
            const p = state.products.find(x => x.id === r.productId);
            if (!p) return;
            const use = Number(((Number(r.qtyPerUnit) || 0) * it.qty).toFixed(4));
            const bef = Number(p.stok) || 0, aft = Number((bef - use).toFixed(4));
            p.stok = aft;
            state.stockMovements.unshift({ id: uid('mov'), date: now, type: 'out', source: 'resep_jasa', productId: p.id, productName: p.nama, qty: use, stockBefore: bef, stockAfter: aft, unitCost: Number(p.hargaBeliSatuan) || 0, totalCost: (Number(p.hargaBeliSatuan) || 0) * use, refNo: inv, notes: `Resep ${s.nama} (×${it.qty})` });
            logs.push(`${p.nama} (-${use} via ${s.nama})`);
          });
        }
      });

      const sale = {
        id: uid('sale'), invoiceNo: inv, date: now,
        customerName: ui.pos.customer.trim() || 'Pelanggan Umum',
        notes: ui.pos.note.trim(),
        items: ui.pos.cart.map(i => ({ ...i, subtotal: i.harga * i.qty })),
        subtotal: c.subtotal, discountAmount: c.disc, total: c.total, totalHpp,
        paymentMethod: ui.pos.method, paidAmount, changeAmount
      };
      state.sales.unshift(sale);

      addJournal({ type: 'Penjualan', refNo: inv, description: `Penjualan ${sale.customerName} (${sale.items.length} item)`, amount: sale.total, hpp: totalHpp, direction: 'in', paymentMethod: sale.paymentMethod, date: now, meta: { saleId: sale.id } });
      if (logs.length) addJournal({ type: 'Stok Keluar', refNo: inv, description: `Potong stok otomatis: ${logs.join(', ')}`, amount: totalHpp, date: now, meta: { saleId: sale.id } });

      Object.assign(ui.pos, { cart: [], customer: '', note: '', discVal: 0, paid: 0 });
      save();
      toast(`Transaksi ${inv} berhasil dicatat!`);
      render();
      openReceiptModal(sale.id);
    }

    async function drawReceiptCanvas(sale) {
      if (document.fonts?.ready) { try { await document.fonts.ready; } catch {} }
      const cv = document.createElement('canvas');
      cv.width = 1080; cv.height = 1350;
      const ctx = cv.getContext('2d');
      const W = 1080, H = 1350, px = 76;

      const rr = (x, y, w, h, r) => {
        ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
      };
      const wrap = (txt, mw, f) => {
        ctx.font = f; const words = String(txt || '').split(/\s+/), lines = []; let l = '';
        for (const w of words) { const t = l ? `${l} ${w}` : w; if (ctx.measureText(t).width > mw && l) { lines.push(l); l = w; } else l = t; }
        if (l) lines.push(l); return lines;
      };

      // Background
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);

      // Header Bersih Obsidian + Aksen Emas
      ctx.fillStyle = '#0F172A'; ctx.fillRect(0, 0, W, 232);
      ctx.fillStyle = '#F59E0B'; ctx.fillRect(0, 232, W, 6);

      // Emblem
      rr(px, 56, 80, 80, 20); ctx.fillStyle = '#F59E0B'; ctx.fill();
      ctx.strokeStyle = '#0F172A'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.arc(px + 40, 92, 20, Math.PI * 0.85, Math.PI * 0.15, false); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px + 30, 92); ctx.lineTo(px + 37, 96); ctx.lineTo(px + 30, 100); ctx.moveTo(px + 50, 92); ctx.lineTo(px + 43, 96); ctx.lineTo(px + 50, 100); ctx.moveTo(px + 40, 102); ctx.lineTo(px + 40, 118); ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = '#FFFFFF'; ctx.font = '800 32px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText(state.settings.shopName || 'PERCETAKAN KOBRA HITAM', px + 100, 90);
      ctx.fillStyle = '#FBBF24'; ctx.font = '600 18px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText(state.settings.tagline || '', px + 100, 120);
      ctx.fillStyle = '#CBD5E1'; ctx.font = '400 16px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText(state.settings.address || '', px + 100, 156);
      ctx.fillText(`Telp/WA: ${state.settings.phone || '-'}  •  ${state.settings.instagram || ''}`, px + 100, 184);

      ctx.textAlign = 'right';
      ctx.fillStyle = '#F59E0B'; ctx.font = '700 15px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText('NOTA RESMI', W - px, 82);
      ctx.fillStyle = '#FFFFFF'; ctx.font = '700 24px "JetBrains Mono", monospace';
      ctx.fillText(sale.invoiceNo, W - px, 116);
      ctx.fillStyle = '#94A3B8'; ctx.font = '500 16px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText(fmtDT(sale.date), W - px, 148);
      rr(W - px - 104, 166, 104, 32, 16); ctx.fillStyle = 'rgba(16,185,129,0.2)'; ctx.fill();
      ctx.fillStyle = '#34D399'; ctx.font = '700 14px "Plus Jakarta Sans", Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('✓ LUNAS', W - px - 52, 187);

      // Info Pelanggan
      rr(px, 274, W - px * 2, 100, 16); ctx.fillStyle = '#F8FAFC'; ctx.fill();
      ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.textAlign = 'left'; ctx.fillStyle = '#64748B'; ctx.font = '600 14px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText('PELANGGAN', px + 26, 310);
      ctx.fillStyle = '#0F172A'; ctx.font = '700 23px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText(sale.customerName || 'Pelanggan Umum', px + 26, 346);
      ctx.textAlign = 'right'; ctx.fillStyle = '#64748B'; ctx.font = '600 14px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText('PEMBAYARAN', W - px - 26, 310);
      ctx.fillStyle = '#0F172A'; ctx.font = '700 23px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText(sale.paymentMethod || 'Tunai', W - px - 26, 346);

      // Tabel Item
      const ty = 410;
      rr(px, ty, W - px * 2, 48, 12); ctx.fillStyle = '#0F172A'; ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.font = '700 15px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.textAlign = 'left'; ctx.fillText('DESKRIPSI ITEM', px + 22, ty + 30);
      ctx.textAlign = 'center'; ctx.fillText('QTY', px + 510, ty + 30);
      ctx.textAlign = 'right'; ctx.fillText('HARGA', px + 705, ty + 30);
      ctx.fillText('SUBTOTAL', W - px - 22, ty + 30);

      const items = sale.items || [];
      const rowH = items.length > 8 ? Math.max(42, Math.floor(460 / items.length)) : 56;
      const fs = items.length > 8 ? 17 : 19;
      let y = ty + 54;
      items.slice(0, 11).forEach((it, idx) => {
        if (idx % 2 === 1) { ctx.fillStyle = '#F8FAFC'; ctx.fillRect(px, y, W - px * 2, rowH); }
        ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, y + rowH); ctx.lineTo(W - px, y + rowH); ctx.stroke();
        const my = y + Math.round(rowH * 0.62);
        ctx.textAlign = 'left'; ctx.fillStyle = '#0F172A'; ctx.font = `600 ${fs}px "Plus Jakarta Sans", Inter, sans-serif`;
        let nm = (it.type === 'jasa' ? '[Jasa] ' : '') + it.nama;
        while (ctx.measureText(nm).width > 420 && nm.length > 10) nm = nm.slice(0, -2) + '…';
        ctx.fillText(nm, px + 22, my);
        ctx.textAlign = 'center'; ctx.fillStyle = '#334155'; ctx.font = `600 ${fs - 1}px "JetBrains Mono", monospace`;
        ctx.fillText(String(it.qty), px + 510, my);
        ctx.textAlign = 'right'; ctx.fillStyle = '#475569'; ctx.fillText(rp(it.harga), px + 705, my);
        ctx.fillStyle = '#0F172A'; ctx.font = `700 ${fs - 1}px "JetBrains Mono", monospace`; ctx.fillText(rp(it.subtotal), W - px - 22, my);
        y += rowH;
      });
      if (items.length > 11) {
        ctx.textAlign = 'left'; ctx.fillStyle = '#64748B'; ctx.font = 'italic 15px "Plus Jakarta Sans", Inter, sans-serif';
        ctx.fillText(`+ ${items.length - 11} item lainnya`, px + 22, y + 26);
      }

      // Ringkasan Bawah
      const sy0 = 958;
      rr(px, sy0, 410, 148, 16); ctx.fillStyle = '#F8FAFC'; ctx.fill(); ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.textAlign = 'left'; ctx.fillStyle = '#0F172A'; ctx.font = '700 16px "Plus Jakarta Sans", Inter, sans-serif';
      ctx.fillText(sale.notes ? 'CATATAN PESANAN' : 'INFORMASI', px + 22, sy0 + 38);
      ctx.fillStyle = '#475569';
      wrap(sale.notes || 'Terima kasih telah memesan di Percetakan Kobra Hitam.', 366, '400 16px "Plus Jakarta Sans", Inter, sans-serif').slice(0, 4).forEach((ln, i) => ctx.fillText(ln, px + 22, sy0 + 68 + i * 24));

      const bx = 520, bw = W - px - bx;
      rr(bx, sy0, bw, 236, 18); ctx.fillStyle = '#F8FAFC'; ctx.fill(); ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1.5; ctx.stroke();
      let sy = sy0 + 40;
      const row = (l, v, b = false, col = '#0F172A') => {
        ctx.textAlign = 'left'; ctx.fillStyle = b ? '#0F172A' : '#64748B'; ctx.font = `${b ? '700' : '500'} 17px "Plus Jakarta Sans", Inter, sans-serif`; ctx.fillText(l, bx + 24, sy);
        ctx.textAlign = 'right'; ctx.fillStyle = col; ctx.font = `${b ? '700' : '600'} 18px "JetBrains Mono", monospace`; ctx.fillText(v, bx + bw - 24, sy);
        sy += 34;
      };
      row('Subtotal', rp(sale.subtotal));
      row('Diskon', sale.discountAmount > 0 ? `- ${rp(sale.discountAmount)}` : 'Rp0', false, sale.discountAmount > 0 ? '#E11D48' : '#64748B');
      rr(bx + 16, sy - 14, bw - 32, 60, 12); ctx.fillStyle = '#0F172A'; ctx.fill();
      ctx.textAlign = 'left'; ctx.fillStyle = '#FBBF24'; ctx.font = '800 18px "Plus Jakarta Sans", Inter, sans-serif'; ctx.fillText('TOTAL', bx + 32, sy + 23);
      ctx.textAlign = 'right'; ctx.fillStyle = '#FFFFFF'; ctx.font = '800 26px "JetBrains Mono", monospace'; ctx.fillText(rp(sale.total), bx + bw - 32, sy + 25);
      sy += 78;
      row(`Bayar (${sale.paymentMethod})`, rp(sale.paidAmount));
      row('Kembalian', rp(sale.changeAmount), true, '#059669');

      // Footer
      ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(px, 1236); ctx.lineTo(W - px, 1236); ctx.stroke();
      ctx.textAlign = 'center'; ctx.fillStyle = '#475569';
      wrap(state.settings.footerNote, W - px * 2, '500 15px "Plus Jakarta Sans", Inter, sans-serif').slice(0, 2).forEach((ln, i) => ctx.fillText(ln, W / 2, 1272 + i * 22));
      ctx.fillStyle = '#94A3B8'; ctx.font = '600 13px "JetBrains Mono", monospace';
      ctx.fillText(`${state.settings.shopName} • 1080×1350`, W / 2, 1326);
      ctx.fillStyle = '#F59E0B'; ctx.fillRect(0, H - 8, W, 8);
      return cv;
    }

      if (!s) return toast('Data nota tidak ditemukan.', 'error');

            </div>
            <div class="flex-1 w-full space-y-3">

    async function dlReceiptJPG(id) {
      const s = state.sales.find(x => x.id === id); if (!s) return;
      const cv = await drawReceiptCanvas(s);
      const a = document.createElement('a'); a.download = `Nota_${s.invoiceNo}_1080x1350.jpg`; a.href = cv.toDataURL('image/jpeg', 0.96); a.click();
      toast('Nota JPEG 1080×1350 diunduh.');
    }

    async function dlReceiptPDF(id) {
      const s = state.sales.find(x => x.id === id); if (!s) return;
      if (!window.jspdf?.jsPDF) return toast('Library PDF belum termuat.', 'error');
      const cv = await drawReceiptCanvas(s);
      const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'px', format: [1080, 1350], hotfixes: ['px_scaling'] });
      doc.addImage(cv.toDataURL('image/jpeg', 0.96), 'JPEG', 0, 0, 1080, 1350);
      doc.save(`Nota_${s.invoiceNo}_1080x1350.pdf`);
      toast('Nota PDF 1080×1350 diunduh.');
    }

      });
    }

    function saveProd(id) {
      const fd = new FormData(document.getElementById('fProd'));
      const nama = String(fd.get('nama') || '').trim();
      if (!nama) return toast('Nama barang wajib diisi.', 'warning');
      const d = { nama, tanggalPembelian: String(fd.get('tanggalPembelian') || '').trim(), kategoriId: fd.get('kategoriId'), deskripsi: String(fd.get('deskripsi') || '').trim(), stok: parseFloat(fd.get('stok')) || 0, isiKemasan: String(fd.get('isiKemasan') || '').trim(), hargaBeli: parseFloat(fd.get('hargaBeli')) || 0, hargaBeliSatuan: parseFloat(fd.get('hargaBeliSatuan')) || 0, hargaJual: parseFloat(fd.get('hargaJual')) || 0, aktif: true };
      if (id) {
        const i = state.products.findIndex(x => x.id === id);
        if (i >= 0) {
          const old = Number(state.products[i].stok) || 0;
          state.products[i] = { ...state.products[i], ...d };
          if (old !== d.stok) addJournal({ type: 'Penyesuaian Stok', refNo: 'EDIT', description: `Penyesuaian ${d.nama}: ${old} → ${d.stok}`, amount: Math.abs(d.stok - old) * d.hargaBeliSatuan });
        }
      } else state.products.unshift({ id: uid('prd'), ...d });
      save(); closeModal(); toast('Data barang disimpan.'); render();
    }

    function delProd(id) {
      const p = state.products.find(x => x.id === id); if (!p) return;
      confirmDialog('Hapus Barang?', `Hapus "${p.nama}" dari inventaris?`, () => { state.products = state.products.filter(x => x.id !== id); save(); toast('Barang dihapus.', 'info'); render(); }, 'Hapus');
    }

    function exportExcel() {
      if (!state.products.length || typeof XLSX === 'undefined') return toast('Tidak ada data untuk diekspor.', 'warning');
      const ws = XLSX.utils.json_to_sheet(state.products.map(p => ({ 'Nama barang': p.nama, 'Tanggal pembelian': p.tanggalPembelian, 'Deskripsi': p.deskripsi, 'Stok': p.stok, 'Isi kemasan': p.isiKemasan, 'Harga beli': p.hargaBeli, 'Harga beli satuan': p.hargaBeliSatuan, 'Harga jual': p.hargaJual })));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Inventaris');
      XLSX.writeFile(wb, `Inventaris_Kobra_Hitam_${todayISO()}.xlsx`);
      toast('Excel inventaris diekspor.');
    }

    function submitBelanjaMasuk(e, belanjaId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const pid = fd.get('productId');
      const qty = parseFloat(fd.get('qty')) || 0;
      const totalCost = parseFloat(fd.get('totalCost')) || 0;
      const notes = String(fd.get('notes') || '').trim();

      const p = state.products.find(x => x.id === pid);
      if (!p) return toast('Produk tidak ditemukan.', 'error');

      const bef = Number(p.stok) || 0;
      const aft = Number((bef + qty).toFixed(4));
      p.stok = aft;
      if (qty > 0 && totalCost > 0) {
        p.hargaBeliSatuan = Math.round(totalCost / qty);
      }

      const now = new Date().toISOString();
      state.stockMovements.unshift({
        id: uid('mov'),
        date: now,
        type: 'in',
        source: 'belanja_spreadsheet',
        productId: p.id,
        productName: p.nama,
        qty,
        stockBefore: bef,
        stockAfter: aft,
        unitCost: qty > 0 ? totalCost / qty : 0,
        totalCost,
        refNo: 'BLJ-' + todayISO().replace(/-/g, ''),
        notes
      });

      addJournal({
        type: 'Stok Masuk',
        refNo: 'BLJ-' + todayISO().replace(/-/g, ''),
        description: `Belanja stok masuk: ${p.nama} (+${qty})`,
        amount: totalCost,
        direction: 'out',
        date: now
      });

      save();
      closeModal();
      toast(`Stok ${p.nama} bertambah +${qty}. Jurnal kas keluar dicatat.`);
      render();
    }

    function submitOut(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const p = state.products.find(x => x.id === fd.get('pid'));
      const q = parseFloat(fd.get('qty')), mode = fd.get('mode');
      if (!p || isNaN(q) || q < 0) return toast('Input tidak valid.', 'warning');
      const bef = Number(p.stok) || 0, uc = Number(p.hargaBeliSatuan) || 0;
      const iso = new Date(`${fd.get('date') || todayISO()}T${new Date().toTimeString().slice(0, 8)}`).toISOString();
      const notes = String(fd.get('notes') || '').trim();
      if (mode === 'penyesuaian') {
        const diff = Number((q - bef).toFixed(4)); p.stok = q;
        const ref = `ADJ-${Date.now().toString().slice(-5)}`;
        state.stockMovements.unshift({ id: uid('mov'), date: iso, type: 'adjustment', source: 'penyesuaian', productId: p.id, productName: p.nama, qty: diff, stockBefore: bef, stockAfter: q, unitCost: uc, totalCost: Math.abs(diff) * uc, refNo: ref, notes: notes || `${bef} → ${q}` });
        addJournal({ type: 'Penyesuaian Stok', refNo: ref, description: `${p.nama}: ${bef} → ${q}`, amount: Math.abs(diff) * uc, date: iso });
        toast(`Stok ${p.nama} disesuaikan ke ${q}.`);
      } else {
        if (q <= 0) return toast('Jumlah keluar harus > 0.', 'warning');
        const aft = Number((bef - q).toFixed(4)); p.stok = aft;
        const ref = `OUT-${Date.now().toString().slice(-5)}`;
        state.stockMovements.unshift({ id: uid('mov'), date: iso, type: 'out', source: 'manual', productId: p.id, productName: p.nama, qty: q, stockBefore: bef, stockAfter: aft, unitCost: uc, totalCost: q * uc, refNo: ref, notes: notes || 'Keluar manual' });
        addJournal({ type: 'Stok Keluar', refNo: ref, description: `${p.nama} (-${q}) ${notes}`, amount: q * uc, date: iso });
        toast(`Stok ${p.nama} -${q}.`);
      }
      save(); render();
    }

    // -------------------------------------------------------------------------
    // 12. HALAMAN 7: KALKULATOR HPP (6 PRESET + RUMUS MARKUP & MARGIN)
    // -------------------------------------------------------------------------
    function viewHpp(el) {

      const mg = mgPct / 100;

      // Rumus wajib:
      // HPP = Total biaya bahan + listrik + jasa
      // Harga jual markup = HPP × (1 + markup)
      // Harga jual margin = HPP / (1 - margin)

                <h3 class="text-sm font-bold">Biaya HPP — ${esc(s.nama)}</h3>
                <button onclick="resetSvcHpp('${s.id}')" class="text-xs text-slate-400 hover:text-amber-600">Reset Default</button>
              </div>

              <div class="space-y-2">
                <div class="flex justify-between text-[11px] font-semibold text-slate-400">

                    <input type="number" step="any" min="0" value="${b.biaya}" onchange="editBahan('${s.id}',${i},'biaya',this.value)" class="w-28 text-right px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-xs font-semibold" />
                    <button onclick="delBahan('${s.id}',${i})" class="p-1.5 text-slate-400 hover:text-rose-500"><i data-lucide="x" class="w-4 h-4"></i></button>
                  </div>
                `).join('')}
              </div>

              <div class="grid grid-cols-2 gap-3 pt-2 border-t border-slate-100 dark:border-slate-800 text-xs">
                <div><label class="block text-slate-400 mb-1">Listrik (Rp)</label><input type="number" step="any" min="0" value="${s.listrik}" onchange="setSvc('${s.id}','listrik',this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>
                <div><label class="block text-slate-400 mb-1">Jasa / Tenaga (Rp)</label><input type="number" step="any" min="0" value="${s.jasa}" onchange="setSvc('${s.id}','jasa',this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>
              </div>

              <div class="p-4 rounded-xl bg-slate-900 dark:bg-slate-800/80 text-white flex items-center justify-between">
                <div>
                  <div class="text-[11px] text-amber-400 font-mono">HPP = Bahan + Listrik + Jasa</div>

            <!-- Kanan: Markup, Margin & Profit Pesanan -->
            <div class="lg:col-span-6 bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 space-y-4">
              <h3 class="text-sm font-bold">Harga Jual & Keuntungan</h3>

              <div class="grid grid-cols-3 gap-2.5 text-xs">
                <div><label class="block text-slate-400 mb-1">Markup (%)</label><input type="number" step="any" min="0" value="${s.markupPct}" onchange="setSvc('${s.id}','markupPct',this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>
                <div><label class="block text-slate-400 mb-1">Margin (%)</label><input type="number" step="any" min="0" max="99" value="${s.marginPct}" onchange="setSvc('${s.id}','marginPct',Math.min(99,Math.max(0,parseFloat(this.value)||0)))" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono font-bold" /></div>
                <div><label class="block text-amber-600 dark:text-amber-400 font-semibold mb-1">Jml Pesanan</label><input type="number" min="1" value="${qty}" oninput="ui.hpp.qty=Math.max(1,parseInt(this.value)||1); render()" class="w-full px-3 py-2 rounded-xl border border-amber-400 bg-amber-50/40 dark:bg-amber-950/20 font-mono font-bold" /></div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/70 border border-slate-200/80 dark:border-slate-800 space-y-2">
                  <div class="flex justify-between items-center"><span class="font-bold text-blue-600 dark:text-blue-400">Markup</span><span class="font-mono text-[10px] text-slate-400">HPP × (1+${s.markupPct}%)</span></div>

                  <button onclick="applySvcPrice('${s.id}',${Math.round(hMarkup)})" class="w-full py-2 rounded-xl bg-slate-900 dark:bg-blue-600 text-white font-semibold text-[11px] hover:opacity-90">Pakai ke Kasir</button>

                    <div class="flex justify-between"><span class="text-slate-400">Untung (${num(qty)} ${esc(s.satuan)})</span><b class="font-mono text-emerald-600">${rp((hMargin - hpp) * qty)}</b></div>
                  </div>
                  <button onclick="applySvcPrice('${s.id}',${Math.round(hMargin)})" class="w-full py-2 rounded-xl bg-emerald-600 text-white font-semibold text-[11px] hover:opacity-90">Pakai ke Kasir</button>
                </div>
              </div>

              <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
                <span class="text-slate-400">Harga Aktif Kasir: <strong class="font-mono text-slate-900 dark:text-white">${rp(s.hargaJual)}/${esc(s.satuan)}</strong></span>
                <span class="font-mono font-bold text-emerald-600">Profit ${num(qty)}x: ${rp((s.hargaJual - hpp) * qty)}</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function editBahan(id, i, k, v) { const s = state.services.find(x => x.id === id); if (s?.bahanItems[i]) { s.bahanItems[i][k] = k === 'biaya' ? (parseFloat(v) || 0) : v; save(); render(); } }
    function addBahan(id) { const s = state.services.find(x => x.id === id); if (s) { s.bahanItems.push({ id: uid('b'), nama: 'Bahan baru', biaya: 0 }); save(); render(); } }
    function delBahan(id, i) { const s = state.services.find(x => x.id === id); if (s) { s.bahanItems.splice(i, 1); save(); render(); } }
    function setSvc(id, k, v) { const s = state.services.find(x => x.id === id); if (s) { s[k] = parseFloat(v) || 0; save(); render(); } }
    function applySvcPrice(id, p) { const s = state.services.find(x => x.id === id); if (s) { s.hargaJual = p; s.customPrice = true; save(); toast(`Harga ${s.nama} diperbarui menjadi ${rp(p)}.`); render(); } }
    function resetSvcHpp(id) {
      const def = defaultServices().find(x => x.id === id), i = state.services.findIndex(x => x.id === id);
      if (def && i >= 0) { state.services[i] = { ...state.services[i], bahanItems: def.bahanItems, listrik: def.listrik, jasa: def.jasa }; save(); toast('HPP dikembalikan ke standar.'); render(); }
    }
    function openNewSvcModal() {
      openModal({
        title: 'Tambah Jasa Baru', width: 'max-w-sm',
        body: `<form id="fSvc" class="space-y-3 text-xs">
          <div><label class="block font-semibold mb-1">Nama Jasa *</label><input name="nama" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
          <div class="grid grid-cols-2 gap-2"><div><label class="block font-semibold mb-1">Satuan</label><input name="satuan" value="lembar" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div><div><label class="block font-semibold mb-1">Harga Jual</label><input name="harga" type="number" value="5000" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div></div>
          <div class="grid grid-cols-3 gap-2"><div><label class="block font-semibold mb-1">Bahan</label><input name="b" type="number" value="1000" class="w-full px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div><div><label class="block font-semibold mb-1">Listrik</label><input name="l" type="number" value="200" class="w-full px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div><div><label class="block font-semibold mb-1">Jasa</label><input name="j" type="number" value="500" class="w-full px-2.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div></div>
        </form>`,
        foot: `<button onclick="closeModal()" class="px-3.5 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700">Batal</button><button onclick="saveNewSvc()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950">Simpan</button>`
      });
    }
    function saveNewSvc() {
      const fd = new FormData(document.getElementById('fSvc'));
      const nama = String(fd.get('nama') || '').trim(); if (!nama) return toast('Nama jasa wajib diisi.', 'warning');
      const ns = { id: uid('svc'), nama, satuan: fd.get('satuan') || 'unit', aktif: true, bahanItems: [{ id: uid('b'), nama: 'Bahan Utama', biaya: parseFloat(fd.get('b')) || 0 }], listrik: parseFloat(fd.get('l')) || 0, jasa: parseFloat(fd.get('j')) || 0, markupPct: 50, marginPct: 35, hargaJual: parseFloat(fd.get('harga')) || 0, resep: [] };
      state.services.push(ns); ui.hpp.svcId = ns.id; save(); closeModal(); toast('Jasa baru ditambahkan.'); render();
    }

    function updateSvcPriceLive(id, val) {
      const p = parseFloat(val) || 0;
      const s = state.services.find(x => x.id === id);
      if (s) {
        s.hargaJual = p;
        s.customPrice = true;
        save();
        const labaEl = document.getElementById('laba_' + id);
        if (labaEl) {
          const h = svcHpp(s).hpp;
          labaEl.textContent = rp(p - h);
        }
      }
    }

    function updateProdPriceLive(id, val) {
      const p = parseFloat(val) || 0;
      const prod = state.products.find(x => x.id === id);
      if (prod) {
        prod.hargaJual = p;
        prod.customPrice = true;
        save();
        const marginEl = document.getElementById('margin_' + id);
        if (marginEl) {
          marginEl.textContent = rp(p - (Number(prod.hargaBeliSatuan) || 0));
        }
      }
    }

    function deleteJournalEntry(id) {
      const j = state.journal.find(x => x.id === id);
      if (!j) return toast('Catatan jurnal tidak ditemukan.', 'error');
      confirmDialog(
        'Hapus Catatan Jurnal?',
        `Apakah Anda yakin ingin menghapus catatan jurnal "${j.description}" (${rp(j.amount)})?`,
        () => {
          const idx = state.journal.findIndex(x => x.id === id);
          if (idx !== -1) {
            state.journal.splice(idx, 1);
            save();
            toast('Catatan jurnal berhasil dihapus.');
            render();
          }
        },
        'Ya, Hapus Jurnal',
        true
      );
    }

      if (!state.journal || !state.journal.length) return toast('Jurnal sudah kosong.', 'info');
      confirmDialog(

        () => {
          state.journal = [];

          toast('Seluruh catatan jurnal berhasil dikosongkan.', 'info');
          render();

    function saveExp() {
      const fd = new FormData(document.getElementById('fExp'));
      const desc = String(fd.get('desc') || '').trim(), amt = parseFloat(fd.get('amt')) || 0;
      if (!desc || amt <= 0) return toast('Isi keterangan & nominal valid.', 'warning');
      const iso = new Date(`${fd.get('date') || todayISO()}T${new Date().toTimeString().slice(0, 8)}`).toISOString();
      addJournal({ type: 'Pengeluaran', refNo: `EXP-${Date.now().toString().slice(-5)}`, description: desc, amount: amt, direction: 'out', paymentMethod: fd.get('met'), date: iso });
      save(); closeModal(); toast('Pengeluaran tercatat di jurnal.'); render();
    }

    function deleteSaleFromReport(saleId, restoreStock = true) {
      const sale = state.sales.find(s => s.id === saleId);
      if (!sale) return toast('Transaksi penjualan tidak ditemukan.', 'error');
      confirmDialog(
        'Hapus Transaksi Penjualan?',
        `Hapus transaksi ${sale.invoiceNo} (${sale.customerName} - ${rp(sale.total)})? Catatan di jurnal terkait juga akan dibersihkan.${restoreStock ? ' Stok barang akan dikembalikan.' : ''}`,
        () => {
          // 1. Kembalikan stok barang jika ada
          if (restoreStock && Array.isArray(sale.items)) {
            sale.items.forEach(it => {
              if (it.type === 'barang' && it.refId) {
                const p = state.products.find(x => x.id === it.refId);
                if (p) p.stok = Number(((Number(p.stok) || 0) + it.qty).toFixed(4));
              } else if (it.type === 'jasa' && it.refId) {
                const s = state.services.find(x => x.id === it.refId);
                (s?.resep || []).forEach(r => {
                  if (r.productId && r.qtyPerUnit) {
                    const p = state.products.find(x => x.id === r.productId);
                    if (p) {
                      const back = Number(((Number(r.qtyPerUnit) || 0) * it.qty).toFixed(4));
                      p.stok = Number(((Number(p.stok) || 0) + back).toFixed(4));
                    }
                  }
                });
              }
            });
          }

          // 2. Hapus dari state.sales
          const sIdx = state.sales.findIndex(s => s.id === saleId);
          if (sIdx !== -1) state.sales.splice(sIdx, 1);

          // 3. Hapus catatan jurnal terkait
          state.journal = state.journal.filter(j => j.refNo !== sale.invoiceNo && j.meta?.saleId !== saleId);

          // 4. Hapus mutasi stok terkait
          state.stockMovements = state.stockMovements.filter(m => m.refNo !== sale.invoiceNo);

          save();
          toast(`Transaksi ${sale.invoiceNo} berhasil dihapus.`);
          render();
        },
        'Ya, Hapus Transaksi',
        true
      );
    }

    function clearPeriodSales(label, startIso, endIso) {
      const start = new Date(startIso), end = new Date(endIso);
      const hit = iso => { const d = new Date(iso); return d >= start && d <= end; };
      const salesInPeriod = state.sales.filter(s => hit(s.date));
      if (!salesInPeriod.length) return toast('Tidak ada transaksi penjualan pada periode ini.', 'info');

      confirmDialog(
        `Hapus ${salesInPeriod.length} Penjualan (${label})?`,
        `Semua ${salesInPeriod.length} transaksi penjualan pada periode ${label} akan dihapus beserta jurnalnya dan stok dikembalikan. Tindakan ini tidak dapat dibatalkan.`,
        () => {
          const invNos = new Set(salesInPeriod.map(s => s.invoiceNo));
          const saleIds = new Set(salesInPeriod.map(s => s.id));

          // Kembalikan stok
          salesInPeriod.forEach(sale => {
            (sale.items || []).forEach(it => {
              if (it.type === 'barang' && it.refId) {
                const p = state.products.find(x => x.id === it.refId);
                if (p) p.stok = Number(((Number(p.stok) || 0) + it.qty).toFixed(4));
              }
            });
          });

          // Hapus dari state
          state.sales = state.sales.filter(s => !saleIds.has(s.id));
          state.journal = state.journal.filter(j => !invNos.has(j.refNo) && !saleIds.has(j.meta?.saleId));
          state.stockMovements = state.stockMovements.filter(m => !invNos.has(m.refNo));

          save();
          toast(`Berhasil menghapus ${salesInPeriod.length} transaksi pada periode ${label}.`);
          render();
        },
        'Ya, Hapus Semua di Periode Ini',
        true
      );
    }

    function updateSheetUrl() {
      const url = (document.getElementById('cfgSheetUrl')?.value || '').trim();
      if (!url) return toast('Masukkan URL Google Spreadsheet yang valid.', 'error');
      state.settings.spreadsheetUrl = url;
      save();
      toast('URL Google Spreadsheet diperbarui!');
      syncAllFromSheets(false);
    }

    function resetDefaultSheetUrl() {
      state.settings.spreadsheetUrl = DEFAULT_SHEET_URL;
      save();
      toast('URL dikembalikan ke Google Spreadsheet default.');
      const inp = document.getElementById('cfgSheetUrl');
      if (inp) inp.value = DEFAULT_SHEET_URL;
      syncAllFromSheets(false);
    }

    function saveSettings(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      Object.assign(state.settings, {
        shopName: String(fd.get('shopName') || '').trim() || 'PERCETAKAN KOBRA HITAM',
        tagline: String(fd.get('tagline') || '').trim(),
        address: String(fd.get('address') || '').trim(),
        phone: String(fd.get('phone') || '').trim(),
        instagram: String(fd.get('instagram') || '').trim(),
        invoicePrefix: String(fd.get('invoicePrefix') || 'KH').trim().toUpperCase(),
        lowStockThreshold: Math.max(0, parseInt(fd.get('lowStockThreshold'), 10) || 10),
        footerNote: String(fd.get('footerNote') || '').trim()
      });
      save(); toast('Pengaturan berhasil disimpan.'); renderNav();
    }

    function backupJSON() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
      a.download = `Backup_Kobra_Hitam_${todayISO()}.json`;
      a.click();
      toast('Backup JSON berhasil diunduh.');
    }

    function restoreJSON(file) {
      const r = new FileReader();
      r.onload = e => {
        try {
          const d = JSON.parse(e.target.result);
          if (!d || typeof d !== 'object') throw new Error('Format tidak valid');
          state = { ...defaultState(), ...d };
          save(); applyTheme(); toast('Data backup berhasil dipulihkan.'); render();
        } catch (err) { toast('Gagal memulihkan: ' + err.message, 'error'); }
      };
      r.readAsText(file);
    }

    function resetAllData() {
      confirmDialog('Reset Seluruh Data?', 'Semua data barang, transaksi, jurnal, dan pengaturan akan dikembalikan ke awal.', () => {
        state = defaultState(); save(); applyTheme(); toast('Aplikasi direset.', 'info'); go('dashboard');
      }, 'Ya, Reset');
    }

    // 18. INISIALISASI APLIKASI
    // -------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      updateBadges();
      renderNav();
      render();
      document.getElementById('modalWrap').addEventListener('click', e => { if (e.target.id === 'modalWrap') closeModal(); });
      
      // Auto-sinkronisasi dari Google Sheets secara otomatis pada saat web dibuka
      if (state.settings.autoSyncOnOpen !== false) {
        setTimeout(() => {
          syncAllFromSheets(true);
        }, 300);
      }
    });
  </script>
