                <i data-lucide="external-link" class="w-3.5 h-3.5 text-amber-500"></i> Buka Google Spreadsheet
              </a>
            </div>

            <div class="space-y-1.5">
              <label class="block font-semibold text-slate-700 dark:text-slate-300">Tautan (URL) Google Spreadsheet</label>
              <div class="flex flex-col sm:flex-row gap-2">
                <input id="cfgSheetUrl" value="${esc(s.spreadsheetUrl || DEFAULT_SHEET_URL)}" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono text-xs" />
                <button onclick="updateSheetUrl()" class="px-4 py-2 rounded-xl bg-slate-900 dark:bg-slate-800 text-white font-bold shrink-0">Simpan URL</button>
                <button onclick="syncAllFromSheets(false)" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-1.5 transition">
                  <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Tarik Ulang dari Spreadsheet
                </button>
              </div>
            </div>
          </div>

          <!-- Form Profil Usaha & Pengaturan Struk Kasir -->
          <form onsubmit="saveSettings(event)" class="lg:col-span-7 bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 space-y-3.5 text-xs shadow-xs">
            <h3 class="text-sm font-bold">Profil Usaha & Pengaturan Struk Kasir</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div class="sm:col-span-2"><label class="block font-semibold mb-1">Nama Percetakan</label><input name="shopName" value="${esc(s.shopName)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div class="sm:col-span-2"><label class="block font-semibold mb-1">Tagline</label><input name="tagline" value="${esc(s.tagline)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div class="sm:col-span-2"><label class="block font-semibold mb-1">Alamat</label><input name="address" value="${esc(s.address)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div><label class="block font-semibold mb-1">Telepon / WA</label><input name="phone" value="${esc(s.phone)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div><label class="block font-semibold mb-1">Instagram / Sosmed</label><input name="instagram" value="${esc(s.instagram)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900" /></div>
              <div><label class="block font-semibold mb-1">Prefix No. Struk</label><input name="invoicePrefix" value="${esc(s.invoicePrefix)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div>
              <div><label class="block font-semibold mb-1">Batas Stok Menipis</label><input name="lowStockThreshold" type="number" value="${s.lowStockThreshold}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 font-mono" /></div>
              <div class="sm:col-span-2"><label class="block font-semibold mb-1">Catatan Kaki Struk</label><textarea name="footerNote" rows="2" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">${esc(s.footerNote)}</textarea></div>
            </div>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-slate-900 dark:bg-amber-500 text-white dark:text-slate-950 font-bold">Simpan Pengaturan</button>
          </form>

          <!-- Cadangan Offline & Reset -->
          <div class="lg:col-span-5 bg-white dark:bg-[#111623] rounded-2xl border border-slate-200/80 dark:border-slate-800 p-5 space-y-3 text-xs shadow-xs">
            <h3 class="text-sm font-bold">Cadangan Lokal (Offline Backup)</h3>
            <button onclick="backupJSON()" class="w-full py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 font-semibold flex items-center justify-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800"><i data-lucide="download" class="w-4 h-4"></i> Backup Semua Data (.json)</button>
            <label class="w-full py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 font-semibold flex items-center justify-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer">
              <i data-lucide="upload" class="w-4 h-4"></i> Pulihkan Backup (.json)
              <input type="file" accept=".json" class="hidden" onchange="if(this.files[0]) restoreJSON(this.files[0])" />
            </label>
            <button onclick="openExcelModal()" class="w-full py-2.5 px-4 rounded-xl border border-amber-300 dark:border-amber-600/50 bg-amber-50/50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-400 font-semibold flex items-center justify-center gap-2"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Impor Alternatif File Excel Lokal</button>
            <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
              <button onclick="resetAllData()" class="w-full py-2.5 px-4 rounded-xl bg-rose-50 dark:bg-rose-950/30 text-rose-600 dark:text-rose-400 font-bold hover:bg-rose-100">Reset Seluruh Data Aplikasi</button>
            </div>
          </div>
        </div>
      `;
    }

    async function testSupabaseConnection() {
      const url = (document.getElementById('cfgSupabaseUrl')?.value || state.settings.supabaseUrl || '').trim();
      const key = (document.getElementById('cfgSupabaseKey')?.value || state.settings.supabaseKey || '').trim();

      if (!url || !key) return toast('Harap isi Project URL dan Anon Key Supabase.', 'warning');

      state.settings.supabaseUrl = url;
      state.settings.supabaseKey = key;
      save();

      toast('Menguji koneksi ke Supabase PostgreSQL...', 'info');
      sb = null; // reset client
      const client = getSupabase();
      if (!client) return toast('Format URL atau Key Supabase tidak valid.', 'error');

      try {
        const { count, error } = await client.from('products').select('*', { count: 'exact', head: true });
        if (error) throw error;
        toast(`Koneksi Berhasil! Database Supabase terhubung (${count || 0} barang terdaftar).`, 'success');
        syncAllData(false);
      } catch (err) {
        toast('Gagal terhubung ke Supabase: ' + err.message + '. Pastikan Anda telah menjalankan supabase-schema.sql di SQL Editor.', 'error');
        render();
      }
    }

    function disconnectSupabase() {
      confirmDialog('Putus Koneksi Supabase?', 'Aplikasi akan kembali ke mode lokal offline. Transaksi baru tidak akan tersinkronisasi ke cloud sampai dihubungkan kembali.', () => {
        state.settings.supabaseUrl = '';
        state.settings.supabaseKey = '';
        sb = null;
        if (sbRealtimeChannel) {
          try { sb.removeChannel(sbRealtimeChannel); } catch (e) {}
        }
        save();
        toast('Koneksi Supabase diputus. Mode lokal aktif.');
        render();
        updateBadges();
      }, 'Ya, Putus', false);
    }

    async function migrateAllToSupabase() {
      const client = getSupabase();
      if (!client) return toast('Hubungkan ke Supabase terlebih dahulu sebelum migrasi.', 'warning');

      confirmDialog(
        'Migrasikan Data ke Supabase?',
        `Data ${state.products.length} barang, ${state.sales.length} transaksi, dan ${state.journal.length} catatan jurnal lokal akan diunggah ke Supabase. Lanjutkan?`,
        async () => {
          toast('Sedang mengunggah data ke Supabase Cloud...', 'info');
          try {
            // 1. Upload Produk
            if (state.products.length) {
              const pRows = state.products.map(p => ({
                id: p.id,
                no: p.no,
                nama: p.nama,
                tanggal_pembelian: p.tanggalPembelian || '',
                deskripsi: p.deskripsi || '',
                stok: Number(p.stok) || 0,
                isi_kemasan: p.isiKemasan || '',
                harga_beli: Number(p.hargaBeli) || 0,
                harga_beli_satuan: Number(p.hargaBeliSatuan) || 0,
                harga_jual: Number(p.hargaJual) || 0,
                custom_price: !!p.customPrice,
                kategori_id: p.kategoriId || 'cat_atk',
                supplier: p.supplier || '',
                aktif: p.aktif !== false
              }));
              await client.from('products').upsert(pRows, { onConflict: 'id' });
            }

            // 2. Upload Sales
            if (state.sales.length) {
              const sRows = state.sales.map(s => ({
                id: s.id,
                invoice_no: s.invoiceNo,
                date: s.date,
                customer_name: s.customerName,
                notes: s.notes || '',
                subtotal: Number(s.subtotal) || 0,
                discount_amount: Number(s.discountAmount) || 0,
                total: Number(s.total) || 0,
                total_hpp: Number(s.totalHpp) || 0,
                payment_method: s.paymentMethod || 'Tunai',
                paid_amount: Number(s.paidAmount) || 0,
                change_amount: Number(s.changeAmount) || 0,
                items: s.items || []
              }));
              await client.from('sales').upsert(sRows, { onConflict: 'id' });
            }

            // 3. Upload Journal
            if (state.journal.length) {
              const jRows = state.journal.map(j => ({
                id: j.id,
                date: j.date,
                type: j.type,
                ref_no: j.refNo || '-',
                description: j.description || '',
                direction: j.direction || 'neutral',
                amount: Number(j.amount) || 0,
                hpp: Number(j.hpp) || 0,
                payment_method: j.paymentMethod || 'Tunai',
                meta: j.meta || {}
              }));
              await client.from('journal').upsert(jRows, { onConflict: 'id' });
            }

            toast('Migrasi Berhasil! Seluruh data Anda kini berada di Supabase Cloud.', 'success');
            syncAllData(false);
          } catch (err) {
            toast('Gagal migrasi: ' + err.message, 'error');
          }
        },
        'Ya, Migrasikan Sekarang',
        false
      );
    }

    function openSupabaseModal() {
      openModal({
        title: 'Panduan Praktis Setup Database Supabase',
        sub: 'Database cloud PostgreSQL gratis & super cepat dengan sinkronisasi realtime',
        width: 'max-w-2xl',
        body: `
          <div class="space-y-4 text-xs text-slate-600 dark:text-slate-300">
            <div class="p-3.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200">
              <b>Mengapa Supabase?</b> Supabase memberikan database PostgreSQL cloud profesional (gratis) dengan fitur Realtime WebSockets. Setiap kali kasir input penjualan di PC, data otomatis terkirim dan HP pemilik langsung terupdate dalam hitungan milidetik tanpa perlu reload!
            </div>

            <ol class="space-y-3 list-decimal list-inside font-medium leading-relaxed">
              <li class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-100 dark:border-slate-800">
                <b>Buat Akun & Project:</b> Buka <a href="https://supabase.com" target="_blank" class="text-emerald-600 dark:text-emerald-400 font-bold underline">supabase.com</a>, daftar/login (gratis), lalu klik <b>New Project</b>. Beri nama misal <code>Kobra Hitam POS</code> dan atur password database Anda.
              </li>
              <li class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-100 dark:border-slate-800">
                <b>Jalankan SQL Schema:</b> Klik menu <b>SQL Editor</b> di bilah kiri Supabase > klik <b>New Query</b>. Unduh dan buka file <code>supabase-schema.sql</code>, salin seluruh kodenya, tempel ke editor Supabase, lalu klik tombol hijau <b>RUN</b>. (Semua tabel & 83 barang langsung terbuat otomatis).
              </li>
              <li class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-100 dark:border-slate-800">
                <b>Salin Kredensial API:</b> Buka menu <b>Project Settings (ikon gear)</b> di kiri bawah > pilih <b>Data API</b>. Salin:
                <div class="mt-1 ml-4 text-[11px] text-slate-500 font-mono space-y-0.5">
                  <div>1. <b>Project URL</b> (contoh: <code>https://xyzcompany.supabase.co</code>)</div>
                  <div>2. <b>anon / public key</b> (contoh: <code>eyJhbGciOi...</code>)</div>
                </div>
              </li>
              <li class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-100 dark:border-slate-800">
                <b>Selesai!</b> Tempelkan Project URL dan Anon Key tersebut ke form di menu Pengaturan web ini, lalu klik <b>Simpan & Uji Koneksi</b>. Seluruh HP dan komputer Anda kini otomatis terhubung 100%!
              </li>
            </ol>

            <div class="pt-2 flex flex-col sm:flex-row gap-2">
              <a href="supabase-schema.sql" download="supabase-schema.sql" class="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 dark:border-slate-700 font-bold flex items-center justify-center gap-2 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
                <i data-lucide="download" class="w-4 h-4 text-emerald-600"></i> Unduh File supabase-schema.sql
              </a>
              <a href="https://supabase.com/dashboard" target="_blank" class="flex-1 py-2.5 px-4 rounded-xl bg-slate-900 dark:bg-emerald-600 text-white font-bold flex items-center justify-center gap-2 transition">
                <i data-lucide="external-link" class="w-4 h-4"></i> Buka Dashboard Supabase
              </a>
            </div>
          </div>
        `,
        foot: `<button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold">Tutup Panduan</button>`
      });
    }

    function updateSheetUrl() {
      const url = (document.getElementById('cfgSheetUrl')?.value || '').trim();
      if (!url) return toast('Masukkan URL Google Spreadsheet yang valid.', 'error');
      state.settings.spreadsheetUrl = url;
      save();
      toast('URL Google Spreadsheet diperbarui!');
      syncAllFromSheets(false);
    }

    function resetDefaultSheetUrl() {
      state.settings.spreadsheetUrl = DEFAULT_SHEET_URL;
      save();
      toast('URL dikembalikan ke Google Spreadsheet default.');
      const inp = document.getElementById('cfgSheetUrl');
      if (inp) inp.value = DEFAULT_SHEET_URL;
      syncAllFromSheets(false);
    }

    function saveSettings(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      Object.assign(state.settings, {
        shopName: String(fd.get('shopName') || '').trim() || 'Stationary and Advertising Kobra Hitam',
        tagline: String(fd.get('tagline') || '').trim(),
        address: String(fd.get('address') || '').trim(),
        phone: String(fd.get('phone') || '').trim(),
        instagram: String(fd.get('instagram') || '').trim(),
        invoicePrefix: String(fd.get('invoicePrefix') || 'KH').trim().toUpperCase(),
        lowStockThreshold: Math.max(0, parseInt(fd.get('lowStockThreshold'), 10) || 10),
        footerNote: String(fd.get('footerNote') || '').trim()
      });
      save(); toast('Pengaturan berhasil disimpan.'); renderNav();
    }

    function backupJSON() {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
      a.download = `Backup_Kobra_Hitam_${todayISO()}.json`;
      a.click();
      toast('Backup JSON berhasil diunduh.');
    }

    function restoreJSON(file) {
      const r = new FileReader();
      r.onload = e => {
        try {
          const d = JSON.parse(e.target.result);
          if (!d || typeof d !== 'object') throw new Error('Format tidak valid');
          state = { ...defaultState(), ...d };
          save(); applyTheme(); toast('Data backup berhasil dipulihkan.'); render();
        } catch (err) { toast('Gagal memulihkan: ' + err.message, 'error'); }
      };
      r.readAsText(file);
    }

    function resetAllData() {
      confirmDialog('Reset Seluruh Data?', 'Semua data barang, transaksi, jurnal, dan pengaturan akan dikembalikan ke awal.', () => {
        state = defaultState(); save(); applyTheme(); toast('Aplikasi direset.', 'info'); go('dashboard');
      }, 'Ya, Reset');
    }

    // -------------------------------------------------------------------------
    // 18. INISIALISASI APLIKASI
    // -------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      applySidebarState();
      updateBadges();
      renderNav();
      renderQuickNavPills();
      render();
      initScrollAutoHide();
      document.getElementById('modalWrap').addEventListener('click', e => { if (e.target.id === 'modalWrap') closeModal(); });

      // Resize window handler untuk responsif sidebar
      window.addEventListener('resize', () => {
        if (window.innerWidth >= 1024) {
          sidebarOpen = localStorage.getItem('kobra_sidebar_open') !== 'false';
        } else {
          sidebarOpen = false;
        }
        applySidebarState();
      });
      
      // Inisialisasi Supabase Client jika kredensial sudah ada
      getSupabase();

      // Auto-sinkronisasi data (dari Supabase jika ada, atau Google Sheets fallback)
      if (state.settings.autoSyncOnOpen !== false) {
        setTimeout(() => {
          syncAllData(true);
        }, 300);
      }

      // Auto-sinkronisasi saat tab aktif kembali di HP atau PC (window focus)
      window.addEventListener('focus', () => {
        if (!isSyncing) {
          syncAllData(true);
        }
      });

      // Polling berkala jika tab aktif
      setInterval(() => {
        if (!document.hidden && !isSyncing) {
          syncAllData(true);
        }
      }, 60000);
    });
  </script>
</body>
</html>
